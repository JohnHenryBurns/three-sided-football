  markHot();
  drawPolish(nowMs);
  ren.render(scene, cam);
};


// ── THE CHROME ──────────────────────────────────────────────────────────────
const scoresEl = document.getElementById('scores');
function renderScore(){
  const best = Math.max(...score);
  scoresEl.innerHTML = TEAMS.map((T, t) =>
    '<span class="sc' + (score[t] === best && best > 0 ? ' lead' : '') + (out[t] ? ' out' : '') + '">' +
    '<span class="sw" style="background:' + T.color + '"></span>' + T.short +
    ' <b>' + score[t] + '</b><span class="fl">\u{1F525}</span></span>').join('');
  // tapping a side's chip takes charge of it
  [...scoresEl.children].forEach((el2, t) => el2.addEventListener('click', () => openCoach(t)));
  markHot();
}

// Underdog fire is a 20-second boost the engine grants on `boostUntil`. Read from there rather
// than tracked here, and refreshed each frame because it expires on the match clock rather than
// on anything the page knows about.
function markHot(){
  if (typeof boostUntil === 'undefined') return;
  for (let t = 0; t < 3; t++) {
    const el = scoresEl.children[t];
    if (el) el.classList.toggle('hot', clockSec < boostUntil[t]);
  }
}
function fmtClock(s){
  const m = Math.floor(s/60);
  return m + ':' + String(Math.floor(s%60)).padStart(2, '0');
}


// ── THE SCREENS ─────────────────────────────────────────────────────────────
// One card, four uses: a goal, extra time, a champion, and anything the engine
// wants held in front of the play. The engine already distinguishes them by which
// hook it calls, so the page does not need four components to say so.
const celeEl = document.getElementById('cele');
const celeCard = document.getElementById('celeCard');
const confettiBox = document.getElementById('confetti');
let celeUntil = 0;

// The most recent urgent line, and the card's way of collecting it. A second's grace either
// side: a goal's commentary and its card arrive in the same handful of milliseconds, and nothing
// older than that belongs on it.
let lastBig = null;
function applyFlav(){
  if (!lastBig || !celeUntil) return;
  if (performance.now() - lastBig.at > 1200) return;
  let slot = celeCard.querySelector('.flav');
  if (!slot) {
    slot = document.createElement('div');
    slot.className = 'flav';
    celeCard.appendChild(slot);
  }
  slot.innerHTML = lastBig.html;
}

function showCard(colour, big, who, sub, ms, confetti, fire){
  celeCard.style.setProperty('--cele', colour);
  celeCard.innerHTML =
    '<div class="big">' + big + '</div>' +
    (who ? '<div class="who">' + who + '</div>' : '') +
    (sub ? '<div class="sub">' + sub + '</div>' : '') +
    // The fifth argument, which this page was dropping: the flavour line. "Spain catch fire —
    // 20s boost", "the killing blow". It is the part that makes a goal card feel like a
    // broadcast rather than a scoreline, and it was being thrown away because the hook took
    // four parameters and the engine has always passed five.
    (fire ? '<div class="fire">' + fire + '</div>' : '');
  confettiBox.innerHTML = '';
  if (confetti) {
    const pal = [colour, '#ffd166', '#ffffff'];
    for (let i = 0; i < 28; i++) {
      const c = document.createElement('span');
      c.className = 'confetti';
      c.style.left = (Math.random() * 100) + '%';
      c.style.background = pal[i % 3];
      c.style.animationDelay = (Math.random() * 0.5).toFixed(2) + 's';
      confettiBox.appendChild(c);
    }
  }
  celeEl.classList.add('on');
  // Infinity for a champion: the match is over and there is nothing to go back to.
  celeUntil = ms === Infinity ? Infinity : performance.now() + ms;
  applyFlav();                     // a line that arrived just before the card still lands on it
}
function hideCard(){ celeEl.classList.remove('on'); confettiBox.innerHTML = ''; }

// ── INTO THE NET ────────────────────────────────────────────────────────────
// The engine's work is done the moment the ball crosses the line: it scores, calls the
// celebration and waits for a restart. So the ball simply FROZE on the line while play was held,
// which is the one moment everybody is looking at it.
//
// A goal ends with the ball in the back of the net. This carries it there — render-only, during
// a hold when nothing else is moving, and it stops when it arrives rather than drifting.
let netFly = null;
ENGINE_HOOKS.showCelebration = (colour, big, who, sub, fire) => {
  // Which goal? The nearest one to where the ball is, which at the moment of a goal is the one
  // it just went into — no need for the engine to say, and nothing to keep in step if it changes.
  let gi = -1, best = 1e9;
  for (const g of GOAL_EDGE) {
    const e = EDGES[g], d = Math.hypot(ball.x - e.mx, ball.y - e.my);
    if (d < best) { best = d; gi = g; }
  }
  if (gi >= 0 && best < 220) {
    const e = EDGES[gi];
    const sp = Math.hypot(ball.vx, ball.vy) || 1;
    netFly = {
      x: ball.x, y: ball.y, z: Math.max(0, ball.z || 0),
      // Along its own travel if it had any, otherwise straight through the mouth — a ball that
      // trickles over the line still ends up in the net.
      vx: sp > 0.6 ? ball.vx/sp : -e.nx,
      vy: sp > 0.6 ? ball.vy/sp : -e.ny,
      speed: Math.min(9, Math.max(3.5, sp)),
      // The back of the net, measured from the line: it slopes, so the stop depth depends on how
      // high the ball is. Low and hard goes deep; a lob dies against the top of the sheet.
      stop: 34 * (1 - Math.min(1, Math.max(0, ball.z || 0) / 54) * 0.75),
      nx: e.nx, ny: e.ny, mx: e.mx, my: e.my, dead: false
    };
  }
  showCard(colour || '#ffd166', big || 'GOAL', who || '', sub || '', 2600, true, fire);
};

// `dur` is already MILLISECONDS — the flat page does `performance.now() + dur` with it, and the
// engine passes 4200 for a yellow card. Multiplying by a thousand, as this did, would have held
// a card up for seventy minutes with the match frozen behind it. Nothing in a headless run can
// catch that: the number is valid, the units are not.
ENGINE_HOOKS.showNotice = (colour, big, who, sub, dur) =>
  showCard(colour || '#ffd166', big || '', who || '', sub || '', dur || 2200, false);

// ── FULL TIME ───────────────────────────────────────────────────────────────
// The same table the flat page's report builds, from the same numbers: points, goals, saves,
// tackles, possession. Read straight off `stats` rather than counted here — a scoreboard that
// keeps its own tally is a scoreboard that will one day disagree with the match.
//
// Sorted by the engine's own rankCmp, so the order on this card is the order that decided the
// title rather than a second opinion about it.
ENGINE_HOOKS.crownChampion = (t, how) => {
  const T = TEAMS[t];
  const order = [0, 1, 2].sort(rankCmp);
  const tot = stats.poss.reduce((a, b) => a + b, 0) || 1;
  const line = m => scoreMode === 'conceded'
    ? TEAMS[m].short + ' ' + conceded[m]
    : TEAMS[m].short + ' ' + (score[m] > 0 ? '+' : '') + score[m];

  const row = m =>
    '<tr' + (m === t ? ' class="won"' : '') + '>' +
    '<td><span class="sw" style="background:' + TEAMS[m].color + '"></span>' + TEAMS[m].short + '</td>' +
    '<td><b>' + (score[m] > 0 ? '+' : '') + score[m] + '</b></td>' +
    '<td>' + scored[m] + '</td><td>' + stats.saves[m] + '</td><td>' + stats.tackles[m] + '</td>' +
    '<td>' + Math.round(100 * stats.poss[m] / tot) + '%</td></tr>';
  const table =
    '<table class="ft"><thead><tr><th>Team</th><th>Pts</th><th>G</th><th>Sv</th><th>Tk</th>' +
    '<th>Poss</th></tr></thead><tbody>' + order.map(row).join('') + '</tbody></table>';

  // EVERY GOAL, IN ORDER. The flat page lists them and it is the part people actually read — a
  // table says who won, a list of goals says what the match WAS.
  const mmss = x => String(Math.floor(x/60)).padStart(2,'0') + ':' + String(Math.floor(x%60)).padStart(2,'0');
  const hl = goalsLog.length
    ? '<div class="hl">' + goalsLog.map(g => g.own
        ? '\u{1F631} ' + mmss(g.t) + ' own goal \u2014 ' + TEAMS[g.conceder].short + (g.ot ? ' (OT)' : '')
        : '\u26bd ' + mmss(g.t) + ' ' + g.name + ' (' + TEAMS[g.scorer].short + ') v ' +
          TEAMS[g.conceder].short + (g.ot ? ' (OT)' : '')).join('<br>') + '</div>'
    : '';

  // Player of the match, weighted the flat page's way: goals count six, saves two, tackles one
  // and a half, and the champions get a multiplier — a hat-trick for a losing side is a fine
  // afternoon but it is not the story of the match.
  let potm = null, pv = 0;
  players.forEach(pl => {
    let v = (pl.goals || 0) * 6 + (pl.saves || 0) * 2 + (pl.tackles || 0) * 1.5;
    if (pl.team === t) v *= 1.4;
    if (v > pv) { pv = v; potm = pl; }
  });
  const bits = [];
  if (potm) {
    if (potm.goals)   bits.push(potm.goals + ' goal' + (potm.goals > 1 ? 's' : ''));
    if (potm.saves)   bits.push(potm.saves + ' save' + (potm.saves > 1 ? 's' : ''));
    if (potm.tackles) bits.push(potm.tackles + ' tackle' + (potm.tackles > 1 ? 's' : ''));
  }
  const potmLine = (pv > 0 && potm)
    ? '<div class="potm">\u2b50 Player of the Match: ' + potm.name +
      ' (' + TEAMS[potm.team].short + ') \u2014 ' + bits.join(', ') + '</div>'
    : '';

  showCard(T.color, '\u{1F3C6} CHAMPIONS!', T.name + ' take the title',
           order.map(line).join(' \u00b7 ') + (how ? ' \u2014 ' + how : ''), Infinity, true);

  const extra = document.createElement('div');
  extra.className = 'ftwrap';
  extra.innerHTML = table + hl + potmLine +
    '<div class="champBtns">' +
    '<button class="cmBtn go" id="btnRematch">Rematch</button>' +
    '<button class="cmBtn" id="btnReport">\u{1F4C4} Match report</button></div>';
  celeCard.appendChild(extra);

  document.getElementById('btnRematch').onclick = () => { hideCard(); celeUntil = 0; openSetup(); };
  // The report is markdown built by the ENGINE, so both pages download the same document — and a
  // Blob rather than a data URL, because a long match report is longer than some browsers will
  // accept in a URL.
  document.getElementById('btnReport').onclick = () => {
    const md = buildMatchReport();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([md], { type: 'text/markdown' }));
    a.download = 'match-report-' + [0,1,2].map(m => TEAMS[m].short).join('-') + '.md';
    // ATTACHED FIRST. Chrome refuses click() on an anchor that is not in the document, which is
    // why nothing happened — no error, no download, just a button that did not work. The flat
    // page gets away with it on desktop; a phone does not.
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
  };

  say('<span class="goal">\u{1F3C6} ' + T.name + ' ARE CHAMPIONS OF THE HEX!</span>', true);
};

// Purely the announcement now. The engine's knockOut() has already set out[t], marked every one
// of their players out, dropped the ball if one of them held it and released their coach — which
// this hook used to be expected to do, and never did.
ENGINE_HOOKS.eliminateTeam = t => {
  const T = TEAMS[t];
  showCard(T.color, '\u{1F480} ELIMINATED', T.name + ' are out',
           aliveTeams().length + ' left', 2200, false);
};

// A card against a team flashes that team's chip, which is where the eye already is when
// something happens to a score. The flat page flashes a whole scorecard; there is no room for one
// here, and the chip carries the same information in a tenth of the space.
ENGINE_HOOKS.flash = t => {
  const el = scoresEl.children[t];
  if (!el) return;
  const red = players.some(p => p.team === t && p.redCard);
  el.classList.remove('flash', 'red');
  void el.offsetWidth;
  el.classList.add('flash');
  if (red) el.classList.add('red');
};


// ── THE MATCH MENU ──────────────────────────────────────────────────────────
// Shown on load and whenever the match is reset, because those are the two moments you might
// want a different match — and a settings panel you have to go looking for is one nobody changes.
const setupEl = document.getElementById('setup');
const slotsEl = document.getElementById('teamSlots');

// Three pickers, one per side. Choosing a team that is already out there swaps the two, rather
// than refusing: refusing means working out which of the other two to change first, and swapping
// is what you meant.
const tpEl = document.getElementById('tp'), tpCard = document.getElementById('tpCard');

function renderTeamSlots(){
  slotsEl.innerHTML = '';
  selTeams.forEach((sel, slot) => {
    const L = TEAM_LIBRARY[sel];
    const b = document.createElement('button');
    b.className = 'slotBtn';
    b.textContent = L.short;
    b.style.borderColor = L.color;
    b.style.color = L.color;
    b.style.boxShadow = 'inset 0 -3.5px 0 ' + L.accent;   // a stripe of the away colour
    b.addEventListener('click', () => openTeamPick(slot));
    slotsEl.appendChild(b);
  });
  const dice = document.createElement('button');
  dice.className = 'diceBtn';
  dice.textContent = '\u{1F3B2}';
  dice.title = 'Random matchup';
  dice.addEventListener('click', () => {
    const pool = [...TEAM_LIBRARY.keys()];
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    for (let i = 0; i < 3; i++) selTeams[i] = pool[i];
    applyTeamSelection(); renderTeamSlots();
  });
  slotsEl.appendChild(dice);
}

// The sheet. Every side, in its own colours, with the identity the engine gives it — which is
// what you are actually choosing between: a team that presses is a different match from one that
// sits in, and the name alone does not say so.
function openTeamPick(slot){
  const rows = ['<div class="big2">Slot ' + (slot + 1) + ': choose a side</div>',
    '<div class="tpTeam" data-i="-1" style="border-color:var(--hot)">' +
      '<div class="tpDot" style="display:flex;align-items:center;justify-content:center;' +
      'font-size:1.2rem">\u{1F3B2}</div><div class="tpBody">' +
      '<span class="tpName" style="color:var(--hot)">Surprise me</span>' +
      '<span class="tpId">a random side</span></div></div>'];
  TEAM_LIBRARY.forEach((T, i) => {
    const taken = selTeams.indexOf(i);
    rows.push('<div class="tpTeam" data-i="' + i + '" style="border-color:' + T.color +
      (taken >= 0 && taken !== slot ? ';opacity:.55' : '') + '">' +
      '<div class="tpDot" style="background:' + T.color +
        ';box-shadow:inset 0 -6px 0 ' + T.accent + '"></div>' +
      '<div class="tpBody"><span class="tpName" style="color:' + T.color + '">' + T.name + '</span>' +
      '<span class="tpId">' + T.id.atk + ' \u00b7 ' + T.id.def + ' \u00b7 ' + T.id.agg +
      (taken >= 0 && taken !== slot ? ' \u00b7 already picked \u2014 tap to swap' : '') +
      '</span></div></div>');
  });
  tpCard.innerHTML = rows.join('');
  tpCard.querySelectorAll('.tpTeam').forEach(el => el.addEventListener('click', () => {
    let want = +el.dataset.i;
    if (want < 0) {                                  // the die, for one slot only
      const free = [...TEAM_LIBRARY.keys()].filter(i => selTeams.indexOf(i) < 0);
      want = free.length ? free[Math.floor(Math.random() * free.length)] : selTeams[slot];
    }
    const other = selTeams.indexOf(want);
    if (other >= 0 && other !== slot) selTeams[other] = selTeams[slot];   // swap, do not refuse
    selTeams[slot] = want;
    applyTeamSelection();
    renderTeamSlots();
    tpEl.classList.remove('on');
  }));
  tpEl.classList.add('on');
}
tpEl.addEventListener('click', e => { if (e.target === tpEl) tpEl.classList.remove('on'); });
ENGINE_HOOKS.renderTeamSlots = renderTeamSlots;
ENGINE_HOOKS.showSetup = () => openSetup();

function startMatch(){
  // Read every control into the engine, then build. The engine owns all of these — the page is
  // only collecting answers.
  scoreMode  = document.getElementById('setRules').value;
  matchLen   = parseInt(document.getElementById('setLen').value, 10);
  foulMult   = parseFloat(document.getElementById('setRef').value);
  momentumOn = document.getElementById('setMom').checked;
  zoneRule   = document.getElementById('setZone').checked;
  oobRule    = document.getElementById('setOob').checked;
  capsOn     = document.getElementById('setCaps').checked;
  // The debug overlay is a match setting now rather than a key nobody would find. D still
  // toggles it mid-match, because that is when you actually want it on and off.
  showJobs   = document.getElementById('setJobs').checked;
  // Speech has to be started by a gesture on mobile, and this click IS one — asking for it here
  // rather than at load is the difference between a working announcer and a silent one.
  sayAloud   = speechOK && document.getElementById('setVoice').checked;
  if (sayAloud) { try { speechSynthesis.cancel(); } catch(e){} }

  setupEl.classList.remove('on');
  document.body.classList.remove('setup');
  feedEl.innerHTML = '';
  hideCard(); celeUntil = 0;
  applyTeamSelection();
  resetMatch();
  kickoff(0, true);
  renderScore();
  buildBodies();          // the kits change with the teams, so the bodies are rebuilt
  running = true;
  setPlayIcon();
  keepAwake(true);
  if (oobRule) say('Touchlines in play \u2014 throw-ins, goal kicks, and corners.');
  startCountdown();
}
document.getElementById('btnStart').addEventListener('click', startMatch);


// ── THE COUNTDOWN ───────────────────────────────────────────────────────────
// Four beats, 6.6 seconds, and the ball waits for the booth. That wait is the whole point: it
// gives a kick-off the feeling of a thing about to start rather than a thing that already has.
//
// Each step checks the menu is still down before drawing, because a reset during the count would
// otherwise leave a "2" floating over the setup screen.
let countTok = 0;
function startCountdown(){
  const tok = ++countTok;
  const el2 = document.getElementById('countdown');
  resumeAt = performance.now() + 6600;
  el2.classList.add('on');
  ['3', '2', '1', 'GO!'].forEach((t2, i) => setTimeout(() => {
    if (tok !== countTok || setupEl.classList.contains('on')) { el2.classList.remove('on'); return; }
    el2.innerHTML = '<span' + (t2 === 'GO!' ? ' style="font-size:.74em;letter-spacing:.05em"' : '') +
      '>' + t2 + '</span>';
    if (t2 === 'GO!') {
      ENGINE_HOOKS.spawnNote(CX, CY - 46, 'kick-off!', '#ffd166');
      setTimeout(() => { if (tok === countTok) el2.classList.remove('on'); }, 1100);
    }
  }, 1500 + i * 1250));
}

// ── THE LOOP ────────────────────────────────────────────────────────────────
// Deliberately simpler than the 2D page's. That one carries celebration timing, the walk of
// shame, penalties and coach menus; this one plays football and restarts after a goal. The match
// flow it omits is flow the engine does not require — which is worth knowing, because it means
// that flow is presentation and could move here later rather than being duplicated.
// `running` and `resumeAt` are ENGINE names — declaring them again here is a SyntaxError, and a
// SyntaxError in an inline script kills the whole block before its first line runs. That is why
// the page showed its buttons and nothing else: not a failure during boot, a failure to reach
// boot at all, which is also why the try/catch around boot() never said a word.
//
// The engine owns them, so use them rather than shadowing them.
let last = performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - last)/1000);
  last = now;
  // A card holds the play. Without this a goal celebration sits over a match that carries on
  // behind it, and the restart happens while nobody is looking at the pitch.
  if (celeUntil && now >= celeUntil && celeUntil !== Infinity) {
    hideCard(); celeUntil = 0; resumeAt = now + 500;
  }
  const held = celeUntil > 0;

  // ── THE WALK OF SHAME ─────────────────────────────────────────────────────
  // A sending-off leaves the player on the pitch with `sentOff` set, and the engine hands him
  // over as `walkPending` once the card has been shown. Somebody has to walk him off; the flat
  // page's loop does it and this one never did, so a red-carded player simply stood there until
  // the next restart teleported him to the bench.
  //
  // It owns the stage: play holds, the camera escorts him, and he is only out when he sits down.
  // That pause is the point — a sending-off should cost the match a moment.
  if (!held && typeof walkPending !== 'undefined' && walkPending) { walkOff = walkPending; if (typeof setWalking==='function') setWalking(walkOff); walkPending = null; }
  if (walkOff) {
    const q = walkOff, B = benchAt[q.team];
    if (!B) { q.out = true; q.benched = true; walkOff = null; if (typeof setWalking==='function') setWalking(null); }
    else {
      const dx = B.x - q.x, dy = B.y - q.y, bd = Math.hypot(dx, dy) || 1;
      q.x += dx/bd * 1.5 * dt * 60;
      q.y += dy/bd * 1.5 * dt * 60;
      q.vx = 0; q.vy = 0;
      q.hx = dx/bd; q.hy = dy/bd;                 // he faces where he is trudging
      if (ball.owner === q) ball.owner = null;
      if (follow) { look.x += (q.x - look.x) * 0.06; look.z += (q.y - look.z) * 0.06; placeCam(); }
      resumeAt = now + 120;                        // play stays held while he goes
      if (bd < 12) {
        q.out = true; q.sentOff = false; q.benched = true;
        q.seat = players.filter(o => o.team === q.team && o.benched).length - 1;
        walkOff = null; if (typeof setWalking==='function') setWalking(null);
        // FIVE LINES, PICKED, not one fixed string. I had flattened this to a single sentence,
        // which means the tenth sending-off of a match reads exactly like the first. The flat
        // page has always picked, and the engine's pick() and pronoun helper are right here.
        // PRN gives capitalised forms too — His, He — so a sentence can start with one without
        // upper-casing by hand, which would have produced "Her teammates" correctly and "She
        // knows" wrongly if I had done it the other way round.
        const P = (typeof PRN === 'function') ? PRN(q)
                : { his:'his', His:'His', him:'him', he:'he', He:'He', man:'man' };
        const who = '<b>' + q.name + '</b>';
        say(pick([
          who + ' takes ' + P.his + ' seat on the bench, head in hands. ' +
            tm(q.team) + ' regroup a ' + P.man + ' light.',
          who + ' sits down in the dugout and studies ' + P.his + ' boots. ' +
            tm(q.team) + ' play on without ' + P.him + '.',
          'A towel over the head for ' + who + '. The bench is a lonely place tonight.',
          who + ' takes the long seat. ' + P.His + ' teammates do not look over.',
          'Down ' + P.he + ' sits \u2014 ' + who + '\u2019s evening is over, and ' + P.he +
            ' knows exactly whose fault it is.']));

        // ── DOWN TO THE KEEPER ──────────────────────────────────────────
        // The two lines this page has never had. A side with no outfielders left is the funniest
        // state the rules can reach, and all three at once is the punchline the whole format has
        // been building toward — "Three goalkeepers enter. One lifts the cup."
        //
        // fieldersLeft() is in the engine and appeared ZERO times in this file.
        if (typeof fieldersLeft === 'function') {
          if (fieldersLeft(q.team) === 0)
            say(tm(q.team) + ' are down to just the goalkeeper. He abandons his line \u2014 needs must.', true);
          if ([0, 1, 2].every(tt => out[tt] || fieldersLeft(tt) === 0))
            say('<b>Scenes. Three goalkeepers enter. One lifts the cup.</b>', true);
        }
      }
    }
  }

  if (running && !held && !walkOff && now >= resumeAt) {
    if (pendingKickoff !== null && typeof pendingKickoff !== 'undefined') {
      kickoff(pendingKickoff); pendingKickoff = null; resumeAt = now + 900;
    } else {
      // The 2D page's step, verbatim: dt * speed * 0.75. `speedMult` is a PLAYER speed
      // multiplier and taking it for a clock rate was a guess from its name — it wants a player
      // and returns how fast that one runs. The clock and the simulation take the same step, so
      // the match clock and the football agree about how long a second is.
      const step = dt * speed * 0.75;
      clockSec += step;
      retargetTimer += step;
      if (retargetTimer > 6) { retargetTimer = 0; computeTargets(); }
      think(step); physics(step); colorCommentary();
      if (typeof telFrame === 'function') telFrame();   // telemetry for the match report

      // ── STOPPAGE TIME AND FULL TIME ─────────────────────────────────────
      // This page had the resolveFullTime() call and neither of the two things around it: the
      // phase gate, and the fourth official's board. Without the gate it kept calling full time
      // on a match that had already gone to overtime, and without the board a match simply ran
      // past its own length with nothing said.
      //
      // The engine has always tracked `stoppageLen` — every foul and card adds to it — and only
      // the flat page ever read it out.
      if (phase === 'regulation') {
        if (!stoppageAnnounced && clockSec >= matchLen) {
          stoppageAnnounced = true;
          say('\u{1F4CB} The fourth official\u2019s board goes up: <b>+' +
              Math.ceil(stoppageLen) + 's</b> added on!', true);
        }
        if (clockSec >= matchLen + stoppageLen) resolveFullTime();
      }
    }
  }
  document.getElementById('clock').textContent = fmtClock(clockSec);
  drawGL();
}

const PAUSE_D = 'M8 5v14M16 5v14', PLAY_D = 'M7 4l13 8-13 8z';
function setPlayIcon(){
  const b = document.getElementById('play');
  b.querySelector('path').setAttribute('d', running ? PAUSE_D : PLAY_D);
  b.setAttribute('aria-label', running ? 'Pause' : 'Play');
}
document.getElementById('play').addEventListener('click', () => {
  running = !running; setPlayIcon(); keepAwake(running);
});
// Reset opens the menu rather than restarting the same match: a reset is the moment you might
// want different teams or a different length, and the flat page treats it the same way.
function openSetup(){
  running = false;
  keepAwake(false);
  hideCard(); celeUntil = 0;
  shutUp();                      // an announcer mid-sentence about a match you just ended
  renderTeamSlots();
  setupEl.classList.add('on');
  document.body.classList.add('setup');
}
document.getElementById('reset').addEventListener('click', openSetup);
// Speed. The same five steps the flat page offers, and it multiplies the engine's own `speed`,
// so a second of match clock and a second of football stay the same length as each other.
// ── SPEED ───────────────────────────────────────────────────────────────────
// 0.25x at the bottom, because John wants to watch transitions happen rather than infer them
// from the aftermath — a restart that takes three seconds at 1x takes twelve at a quarter, and
// the handoffs between instructions become visible.
//
// 5x at the top for the opposite reason: watching a whole match for shape rather than incident.
const SPEEDS = [0.25, 0.5, 1, 1.5, 2, 3, 5];
function setSpeed(i){
  i = Math.max(0, Math.min(SPEEDS.length-1, i));
  speed = SPEEDS[i];
  document.getElementById('spdNow').innerHTML = speed + '&times;';
  // a button with nowhere to go says so, rather than doing nothing when pressed
  document.getElementById('spdDown').disabled = (i === 0);
  document.getElementById('spdUp').disabled   = (i === SPEEDS.length-1);
}
document.getElementById('spdDown').addEventListener('click', () =>
  setSpeed(SPEEDS.indexOf(speed) - 1));
document.getElementById('spdUp').addEventListener('click', () =>
  setSpeed(SPEEDS.indexOf(speed) + 1));
setSpeed(SPEEDS.indexOf(1));

// Fullscreen. On the STAGE rather than the document, so the pitch fills the screen and the
// controls come with it — a fullscreen page that leaves its buttons behind is a trap on a phone,
// where there is no obvious way back.
// The icon shows the way OUT, not the state you are in: arrows pointing outward mean "this will
// expand", inward mean "this will shrink". A button that shows its current state leaves you
// working out what pressing it does.
const EXPAND_D = 'M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5';
const SHRINK_D = 'M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5';
function setFullIcon(){
  const b = document.getElementById('full');
  const inFs = !!document.fullscreenElement;
  b.querySelector('path').setAttribute('d', inFs ? SHRINK_D : EXPAND_D);
  b.setAttribute('aria-label', inFs ? 'Exit fullscreen' : 'Enter fullscreen');
  b.classList.toggle('on', inFs);
}
document.getElementById('full').addEventListener('click', async () => {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else await document.documentElement.requestFullscreen();
  } catch (err) { /* refused, or unsupported: the icon is corrected by the event below */ }
});
document.addEventListener('fullscreenchange', () => {
  setFullIcon();
  resize();                      // the canvas is sized from its box, and the box just changed
});


// ── CAMERAS ─────────────────────────────────────────────────────────────────
// Six views. `follow` says whether the look-at point chases the ball; the rest is where the
// camera sits relative to it.
//
// Three-sided football is the reason this needs more than one. There is no attacking direction,
// so no single angle is right for everything: overhead shows the shape of a three-way press and
// nothing about height, a low goal camera shows a shot arriving and nothing about what is
// happening behind it. Offering both is cheaper than choosing wrong.
const CAMS = [
  { id:'follow',  glyph:'\u26BD', name:'Follow ball',
    what:'three-quarter, over the shoulder',      az:-Math.PI/2, rad:840,  el:0.52, follow:true },   // 1250 * 0.82^2: two steps in
  { id:'broad',   glyph:'\u{1F4FA}', name:'Broadcast',
    what:'the whole hex at once',  az:-Math.PI/2, rad:1177, el:0.62, follow:false },
  { id:'over',    glyph:'\u{1F53D}', name:'Overhead',
    what:'shape, space and the three thirds', az:-Math.PI/2, rad:1009, el:1.42, follow:false },
  // STRAIGHT DOWN AND CHASING. Overhead shows you the shape of the game; Follow shows you where
  // the game is; until now you had to choose. On a hex with three goals the shape IS the story,
  // so keeping it overhead while the ball moves is the one combination this pitch most wants —
  // and it is the only camera from which you can see all three thirds and the ball at once.
  { id:'tac',     glyph:'\u{1F3AF}', name:'Overhead follow',
    what:'straight down, chasing the ball', az:-Math.PI/2, rad:660, el:1.42, follow:true },
  { id:'low',     glyph:'\u{1F3DF}', name:'Pitchside',
    what:'low \u2014 height and pace',           az:-Math.PI/2, rad:605,  el:0.16, follow:true },
  { id:'goal',    glyph:'\u{1F945}', name:'Behind the goal',
    what:'shots arriving at you',   az:Math.PI/2,  rad:706,  el:0.34, follow:false },
  { id:'free',    glyph:'\u{1F504}', name:'Free look',
    what:'wherever you leave it',      az:null,       el:null, rad:null, follow:false },
];
let camId = 'follow';
const cmEl = document.getElementById('cm'), cmCard = document.getElementById('cmCard');
const camBtn = document.getElementById('cam');

function useCam(id){
  const C = CAMS.find(c => c.id === id) || CAMS[0];
  camId = C.id;
  follow = C.follow;
  // Free look keeps EVERYTHING — angle, distance and the point you were looking at. Choosing it
  // means "stop following", not "start again somewhere else": if you were watching a chase from
  // a low angle behind the play, that is the shot you wanted to keep, and snapping to a default
  // would throw away the thing you pressed the button to preserve.
  //
  // Every other preset snaps, because choosing one is choosing a whole view.
  if (C.az !== null) { az = C.az; el = C.el; rad = C.rad; }
  // Free look touches the target not at all: if you were following, it stays wherever the ball
  // just was, which is the frame you were looking at when you decided to stop. Everything else
  // that does not follow recentres, because choosing it is choosing a whole view.
  if (C.id !== 'free' && !C.follow) look.set(CX, 0, CY);
  // Behind the goal looks at that goal's mouth rather than the middle, or it is just Broadcast
  // from the other side.
  if (C.id === 'goal') { const e = EDGES[GOAL_EDGE[0]]; look.set(e.mx, 0, e.my); }
  placeCam();
  camBtn.textContent = C.name;
  camBtn.classList.toggle('on', C.id !== 'free');
}

function openCams(){
  // WHICH CAMERAS TRACK, said out loud. It changes what your gestures do — a tracking camera
  // orbits and zooms but cannot be panned, because it overwrites its own target every frame —
  // and until now you had to discover that by trying to pan one and watching nothing happen.
  //
  // Two groups, headed, rather than a flag on each row: the difference is a property of the
  // camera, and grouping says it once instead of six times.
  const row = C =>
    '<div class="cmOpt' + (C.id === camId ? ' on' : '') + '" data-id="' + C.id + '">' +
    '<span class="cmGlyph">' + C.glyph + '</span><div class="cmBody">' +
    '<span class="cmName">' + C.name + '</span>' +
    '<span class="cmWhat">' + C.what + '</span></div></div>';
  cmCard.innerHTML = '<div class="big2">Camera</div>' +
    '<div class="cmGrp">Follows the ball \u00b7 turn and zoom</div>' +
    CAMS.filter(C => C.follow).map(row).join('') +
    '<div class="cmGrp">Stays put \u00b7 turn, zoom and pan</div>' +
    CAMS.filter(C => !C.follow).map(row).join('');
  cmCard.querySelectorAll('.cmOpt').forEach(el2 => el2.addEventListener('click', () => {
    useCam(el2.dataset.id);
    cmEl.classList.remove('on');
  }));
  cmEl.classList.add('on');
}
camBtn.addEventListener('click', openCams);

// ── THE COACH ───────────────────────────────────────────────────────────────
// Reached by tapping a side's chip on the scoreboard, which is where your eye already is when
// you decide a team needs help. The flat page has a button; there is no room for one here and
// the chip is a better target anyway — it already identifies the team.
//
// The presets are the engine's own. Reading the lists from there rather than repeating them
// means a tactic added to the rules appears here without anyone remembering to add it.
const coEl = document.getElementById('co'), coCard = document.getElementById('coCard');

function openCoach(t){
  if (out[t]) return;
  if (!coached[t]) {
    coached[t] = true;
    say('\u{1F3AF} A new manager takes the ' +
        '<span class="tm" style="color:' + TEAMS[t].color + '">' + TEAMS[t].name + '</span> bench!', true);
  }
  // THE FLAT PAGE'S LAYOUT, which is the right one: rows of buttons in a grid rather than a
  // stacked list, a line of description under each row saying what the choice DOES, and a foot
  // with release and resume. The stacked version this page had was three times as tall and said
  // nothing about what any of the options meant.
  const rivals = [0, 1, 2].filter(x => x !== t && !out[x]);
  const LBL = { TikiTaka:'Tiki-Taka', RouteOne:'Route 1', Swashbuckle:'Swash',
                ParkTheBus:'The Bus', Gegenpress:'Gegen' };
  const btn = (txt, sel, attrs) =>
    '<button class="cmBtn' + (sel ? ' sel' : '') + '" ' + attrs + '>' + txt + '</button>';
  const cols = n => 'style="grid-template-columns:repeat(' + n + ',1fr)"';
  const row = (keys, presets, current, key) =>
    '<div class="cmRow" ' + cols(keys.length) + '>' +
    keys.map(k => btn(LBL[k] || k, current === k, 'data-' + key + '="' + k + '"')).join('') + '</div>';

  const huntDesc = coachTarget[t] === null
    ? 'AI decides \u2014 every attack hunts the current leader.'
    : 'Every attack targets ' + TEAMS[coachTarget[t]].name + '.';

  coCard.style.setProperty('--cele', TEAMS[t].color);
  coCard.innerHTML =
    '<div class="big2" style="color:' + TEAMS[t].color + '">' + TEAMS[t].name + ' bench</div>' +
    '<div class="cmSec">Hunt</div>' +
    '<div class="cmRow" ' + cols(1 + rivals.length) + '>' +
      btn('Auto', coachTarget[t] === null, 'data-h="auto"') +
      rivals.map(r => btn(TEAMS[r].short, coachTarget[t] === r, 'data-h="' + r + '"')).join('') +
    '</div><div class="cmDesc">' + huntDesc + '</div>' +
    '<div class="cmSec">Attack</div>' + row(Object.keys(ATK_PRESETS), ATK_PRESETS, teamATK[t], 'a') +
    '<div class="cmDesc">' + (ATK_D[teamATK[t]] || '') + '</div>' +
    '<div class="cmSec">Defence</div>' + row(Object.keys(DEF_PRESETS), DEF_PRESETS, teamDEF[t], 'd') +
    '<div class="cmDesc">' + (DEF_D[teamDEF[t]] || '') + '</div>' +
    '<div class="cmSec">Aggression</div>' + row(Object.keys(AGG_PRESETS), AGG_PRESETS, teamAGG[t], 'g') +
    '<div class="cmDesc">' + (AGG_D[teamAGG[t]] || '') + '</div>' +
    '<div class="cmRow cmFoot" ' + cols(2) + '>' +
      '<button class="cmBtn" id="cmRelease">Release team</button>' +
      '<button class="cmBtn go" id="cmResume">Resume \u25b8</button></div>';

  const again = () => { renderScore(); openCoach(t); };
  coCard.querySelectorAll('[data-h]').forEach(b2 => b2.onclick = () => {
    coachTarget[t] = b2.dataset.h === 'auto' ? null : parseInt(b2.dataset.h, 10);
    computeTargets(); again(); });
  coCard.querySelectorAll('[data-a]').forEach(b2 => b2.onclick = () => {
    teamATK[t] = b2.dataset.a; applyPresets(t); again(); });
  coCard.querySelectorAll('[data-d]').forEach(b2 => b2.onclick = () => {
    teamDEF[t] = b2.dataset.d; applyPresets(t); again(); });
  coCard.querySelectorAll('[data-g]').forEach(b2 => b2.onclick = () => {
    teamAGG[t] = b2.dataset.g; applyPresets(t); again(); });

  // RELEASE puts the side back to the identity its team data declares, which is what "default"
  // means here — not a blank slate but the character the side was written with.
  document.getElementById('cmRelease').onclick = () => {
    coached[t] = false; coachTarget[t] = null;
    teamATK[t] = TEAMS[t].id.atk; teamDEF[t] = TEAMS[t].id.def; teamAGG[t] = TEAMS[t].id.agg;
    applyPresets(t);
    if (typeof activeCoach !== 'undefined' && activeCoach === t) {
      const n2 = coached.findIndex(c => c); activeCoach = n2 >= 0 ? n2 : null;
    }
    say('<span class="tm" style="color:' + TEAMS[t].color + '">' + TEAMS[t].name +
        '</span> return to AI control.', true);
    computeTargets(); renderScore();
    coEl.classList.remove('on');
  };
  document.getElementById('cmResume').onclick = () => coEl.classList.remove('on');

  coEl.classList.add('on');
}
coEl.addEventListener('click', e => { if (e.target === coEl) coEl.classList.remove('on'); });
ENGINE_HOOKS.openCoachMenu = openCoach;
cmEl.addEventListener('click', e => { if (e.target === cmEl) cmEl.classList.remove('on'); });

// ── WHAT A CAMERA IS, AND WHAT A GESTURE IS ─────────────────────────────────
// These are two different things and I had them tangled. A preset says WHAT THE CAMERA LOOKS AT
// — the ball, the middle, a goal mouth. A gesture says HOW YOU LOOK AT IT. Turning and zooming
// do not contradict "follow the ball"; they are the angle you want to follow it FROM.
//
// So dragging and pinching no longer break tracking. Only choosing another camera does, which is
// the one action that means "look at something else" — and Free look is exactly the preset whose
// answer to "what do you look at" is "wherever I left it".
//
// The old behaviour dropped you into Free look on any drag, which meant you could not adjust
// your view of a chase without losing the chase, and the button lied about it afterwards.
function panAllowed(){ return !follow; }   // following overwrites the target every frame


// drag to orbit, wheel or pinch to pull back
// ── GESTURES ────────────────────────────────────────────────────────────────
// `drag.pan` was read and never set, so on a touchscreen there was NO path to a pan at all — the
// only one was two fingers, and two fingers also fires pointermove for the first of them, so the
// orbit fought the pan and won. Free look could not be panned by any gesture a phone can make.
//
// Fixed by counting fingers. One finger orbits. Two fingers pinch and pan, and the pointer
// handler steps aside entirely while more than one is down rather than trying to share.
let drag = null, pinch = 0, touching = 0;
cv.addEventListener('touchstart', e => { touching = e.touches.length; }, { passive: true });
cv.addEventListener('touchend',   e => { touching = e.touches.length; }, { passive: true });
cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointerup',   () => { drag = null; });
// ── PANNING ─────────────────────────────────────────────────────────────────
// Free look can move the point it is looking AT, not just orbit around it. Without that, "free"
// only meant free to circle the centre spot — which is not much freedom on a pitch where the
// interesting thing is rarely in the middle.
//
// Two fingers pans, one orbits. That is the gesture people already know from every map, and it
// needs no modifier key on a phone that has none. On a mouse, shift-drag or the right button.
//
// The pan is in the CAMERA's frame rather than the world's: dragging right moves the view right
// as it appears on screen, whichever way the camera happens to be facing. A world-space pan
// sends the pitch sideways in a direction that depends on where you last orbited to, which feels
// broken even though it is consistent.
function panBy(dx, dy){
  const right = new THREE.Vector3(Math.sin(az), 0, -Math.cos(az));
  const fwd   = new THREE.Vector3(-Math.cos(az), 0, -Math.sin(az));
  const k = rad * 0.0016;                       // further out, faster — the same screen distance
  look.addScaledVector(right, -dx * k);
  look.addScaledVector(fwd,   -dy * k);
  // Kept near the ground so the pitch cannot be pushed entirely off screen and lost.
  look.x = Math.max(CX - 900, Math.min(CX + 900, look.x));
  look.z = Math.max(CY - 900, Math.min(CY + 900, look.z));
  look.y = 0;
  placeCam();
}

cv.addEventListener('pointermove', e => {
  if (!drag) return;
  if (touching > 1) { drag = { x: e.clientX, y: e.clientY }; return; }   // two fingers: touchmove owns it
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  // On a mouse, shift or the right button pans — a phone has neither, which is why two fingers
  // has to be the gesture there.
  if ((e.shiftKey || e.buttons === 2) && panAllowed()) panBy(dx, dy);
  else {
    az += dx * 0.006;
    el = Math.max(0.16, Math.min(1.42, el + dy * 0.005));
    placeCam();
  }
  drag = { x: e.clientX, y: e.clientY };
});
cv.addEventListener('contextmenu', e => e.preventDefault());   // so right-drag can pan
// ── ZOOM ────────────────────────────────────────────────────────────────────
// Independent of the presets, and deliberately so. A preset fixes the ANGLE — overhead, behind
// the goal, pitchside — and `rad` is a separate axis, so pulling back from Overhead is still
// overhead. That is why zooming does NOT drop you into Free look the way dragging does: dragging
// contradicts what the preset claims about the view, and zooming does not.
//
// The cost is that switching preset resets the distance, since a preset carries one. That is the
// right way round: choosing a whole view should give you the whole view, and the zoom is one
// button away again.
const ZOOM_MIN = 420, ZOOM_MAX = 2400;
function zoomBy(f){
  rad = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, rad * f));
  placeCam();
}
document.getElementById('zoomIn').addEventListener('click',  () => zoomBy(0.82));
document.getElementById('zoomOut').addEventListener('click', () => zoomBy(1.22));
cv.addEventListener('wheel', e => {
  e.preventDefault();
  rad = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, rad + e.deltaY * 0.9));
  placeCam();
}, { passive: false });
let twoMid = null;
cv.addEventListener('touchmove', e => {
  if (e.touches.length !== 2) return;
  e.preventDefault();
  const [a, b] = e.touches;
  const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
  const mx = (a.clientX + b.clientX) / 2, my = (a.clientY + b.clientY) / 2;
  if (pinch) { rad = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, rad * (pinch/d))); placeCam(); }
  // The midpoint between two fingers moving IS a pan, and it comes for free alongside the pinch:
  // people spread and slide in one gesture and expect both to happen.
  // Panning only means anything when nothing is overwriting the target. While following, two
  // fingers still pinch — you just cannot drag the ball out of frame, which is the point of
  // having asked to follow it.
  if (twoMid && panAllowed()) panBy(mx - twoMid.x, my - twoMid.y);
  pinch = d; twoMid = { x: mx, y: my };
}, { passive: false });
cv.addEventListener('touchend', () => { pinch = 0; twoMid = null; });

// ── BOOT, OUT LOUD ──────────────────────────────────────────────────────────
// The first version of this ran bare. When it failed the page showed its buttons, an empty
// pitch and a clock stuck at 0:00 — which says nothing about which line died, and a phone has no
// console to ask. Any failure now appears where the commentary would be.
function boot(){
  if (!window.THREE) throw new Error('three.js did not load');
  if (typeof ENGINE_HOOKS === 'undefined') throw new Error('engine.js did not load');
  buildPitch();
  buildGround();
  buildEmbers();
  buildFireLight();
  applyTeamSelection();
  resetMatch();
  kickoff(0, true);
  renderScore();
  buildBodies();
  renderTeamSlots();
  setPlayIcon();
  setFullIcon();
  document.body.classList.add('setup');
  resize();
  // The match is built but held: the menu is up and `running` is false, so the first frame draws
  // a pitch with players standing on it behind the card, which is a better backdrop than black.
  running = false;
  requestAnimationFrame(loop);
}
// ── FAILURES GO ON TOP OF EVERYTHING ────────────────────────────────────────
// They used to go to the feed, which was fine until the setup menu became full-screen and opaque
// at z-index 20 — since when a boot failure has been reported into a layer nobody can see, which
// is worse than not reporting it, because it looks like it worked.
//
// Its own element, above the menu, dismissible.
function fatal(label, e){
  const box = document.createElement('div');
  box.id = 'fatal';
  box.innerHTML =
    '<b>' + label + '</b> ' + ((e && e.message) ? e.message : String(e)) +
    '<div class="where">' + (((e && e.stack) ? String(e.stack).split('\n')[1] : '') || '') + '</div>' +
    '<div class="tap">tap to dismiss</div>';
  box.addEventListener('click', () => box.remove());
  document.body.appendChild(box);
  console.error(e);
}
try { boot(); }
catch (e) { fatal('Could not start:', e); }
// and a frame that throws must not take the loop with it — one bad frame is a glitch, a dead
// loop is a black screen
// ONE TRY AROUND THE WHOLE FRAME WAS THE REAL FAULT BEHIND THE STUCK EMBERS. If anything threw
// partway through drawGL, everything after it was skipped — including stepEmbers — so embers
// stopped ageing and sat on the pitch glowing. And because the report fires only once, there was
// nothing on screen to say it had happened.
//
// The ageing runs in its own guard now, after the frame, so it cannot be skipped by a failure
// somewhere else. Whatever else breaks, the fire still goes out.
let frameFailed = false, ageFailed = false;
const rawDraw = drawGL;
drawGL = function(){
  try { rawDraw(); }
  catch (e) {
    if (!frameFailed) { frameFailed = true; fatal('Draw failed:', e); }
  }
  try { retireStale(); }
  catch (e) {
    if (!ageFailed) { ageFailed = true; fatal('Ageing failed:', e); }
  }
};

// A last sweep, independent of everything above: anything that has outlived any plausible life
// goes away. Cheap, and it is the difference between one bad frame and a pitch that stays on
// fire for the rest of the match.
function retireStale(){
  for (const e of embers) {
    if (e.sp.visible && !(e.life < 1.4)) { e.sp.visible = false; e.sp.material.opacity = 0; }
  }
}
</script>
