// ── SCORCH ──────────────────────────────────────────────────────────────────
// Where somebody erupted. The flat page burns a mark into the turf and leaves it for the rest of
// the match, which is the joke: the pitch remembers.
// ── SCORCH ──────────────────────────────────────────────────────────────────
// Burned into the turf where something hot happened, and fading over a minute. Permanent marks
// were fine while only a keeper's dive made them; a burning shot leaves one every time it lands,
// and forty of those never fading turns a pitch into a hearth.
const scorch = [];
function burnMark(x, y, r, life){
  if (scorch.length > 60) { const old = scorch.shift(); scene.remove(old.m); }
  const m = new THREE.Mesh(
    new THREE.CircleGeometry(r, 12),
    new THREE.MeshBasicMaterial({ color: 0x120a04, transparent: true, opacity: 0.62,
                                  depthWrite: false }));
  m.rotation.x = Math.PI/2;
  m.rotation.z = Math.random() * Math.PI;
  m.position.set(x, 0.9, y);
  scene.add(m);
  scorch.push({ m, t: 0, life: life || 55, o0: 0.62 });
}
function stepScorch(dt){
  for (let i = scorch.length - 1; i >= 0; i--) {
    const s2 = scorch[i];
    s2.t += dt;
    if (s2.t >= s2.life) { scene.remove(s2.m); scorch.splice(i, 1); continue; }
    // Holds for the first half, then fades — grass does not start recovering the instant it burns.
    const k = s2.t / s2.life;
    s2.m.material.opacity = s2.o0 * (k < 0.5 ? 1 : 1 - (k - 0.5) / 0.5);
  }
}

// ── THE BURNING DIVE ────────────────────────────────────────────────────────
// A keeper spends 0.6 of his burst to reach 23 instead of 17 for a second and a bit. The flat
// page throws seven embers in a ring around him; this page drew only the scorch mark, which is
// the thing that REMAINS rather than the thing that HAPPENS.
ENGINE_HOOKS.flamePop = q => {
  if (!q) return;
  const pal = (typeof firePal === 'function') ? firePal(q.team) : ['#ff3d00'];
  for (let i = 0; i < 26; i++) {
    const e = embers[emberNext = (emberNext + 1) % EMBERS];
    const a = (i / 26) * Math.PI * 2 + Math.random() * 0.2;
    e.sp.position.set(q.x + Math.cos(a) * 9, H_P * (0.2 + Math.random() * 0.6),
                      q.y + Math.sin(a) * 9);
    // Outward and up, hard: a dive is an explosion of effort, not a plume.
    e.vx = Math.cos(a) * (1.8 + Math.random() * 2.2);
    e.vz = Math.sin(a) * (1.8 + Math.random() * 2.2);
    e.vy = 1.1 + Math.random() * 1.6;
    e.life = 0; e.max = 0.4 + Math.random() * 0.35;
    e.size = 9 + Math.random() * 6;
    e.pal = heatRamp(pal); e.t0 = Math.random() * 0.25;
    e.sp.visible = true;
  }
  burnMark(q.x, q.y, 14 + Math.random() * 6, 40);
};

// Called every frame from drawGL, after the players have moved.
function drawPolish(now){
  // possession
  if (ball.owner) {
    haloGL.position.set(ball.x, 1.1, ball.y);      // the halo stays on the grass, held or not
    haloGL.material.color.set(TEAMS[ball.owner.team].color);
    haloGL.material.opacity = 0.85;
  } else haloGL.material.opacity = 0;

  // the trail: only while the ball is loose and moving, as in 2D — a ball being dribbled does
  // not streak, and a trail behind a walking player is noise
  const fast = !ball.owner && Math.hypot(ball.vx, ball.vy) > 3.2;
  if (fast) trailPts.unshift({ x: ball.x, y: ball.y, z: Math.max(0, ball.z || 0) });
  else if (trailPts.length) trailPts.pop();
  trailPts.length = Math.min(trailPts.length, TRAIL_N);
  trail.forEach((m, i) => {
    const p = trailPts[i];
    if (!p) { m.visible = false; return; }
    m.visible = true;
    m.position.set(p.x, 9 + p.z, p.y);
    m.material.opacity = 0.42 * (1 - i/TRAIL_N);
  });

  // notes rise and fade over two seconds, as they do in 2D
  for (let i = notes3.length - 1; i >= 0; i--) {
    const n = notes3[i], age = (now - n.t0) / 2100;
    if (age >= 1) { scene.remove(n.sp); notes3.splice(i, 1); continue; }
    // The rise is scaled to the camera's distance for the same reason the text is: 34 world
    // units is a clear lift when you are close in and about a pixel when you are pulled all the
    // way back, so a note that looked like it floated up would just sit there and vanish.
    n.sp.position.y = n.y0 + 34 * age * (rad / 840);
    n.sp.material.opacity = age < 0.45 ? 0.95 : 0.95 * (1 - (age - 0.45)/0.55);
  }
  // pings expand and fade over half a second
  for (let i = pings3.length - 1; i >= 0; i--) {
    const p = pings3[i], age = (now - p.t0) / 620;
    if (age >= 1) { scene.remove(p.m); pings3.splice(i, 1); continue; }
    p.m.scale.setScalar(1 + age * 2.6);
    p.m.material.opacity = 0.9 * (1 - age);
  }
}



// ── THE GROUND ──────────────────────────────────────────────────────────────
//
// Everything outside the touchline. None of it is simulated — the engine does not know a stand
// exists — but a pitch floating in black reads as a diagram, and this is meant to be a place.
//
// Built entirely from the engine's V and EDGES, so it cannot drift from the shape the ball
// bounces off, and so it stays right if the pitch ever changes size.
const SPONSORS = [
  "CANBY HAZELNUTS","MAX FC","ATLAS K9 SECURITY","JORN & SONS","HEX\u2022COLA","THE THIRD SIDE",
  "BURNS FAMILY FARMS","WILLAMETTE TURF CO.","TRAEGER SMOKE SIGNALS","PUMPKIN PATCH XXL",
  "GRAMPY CLIFF'S TRACTOR PARTS","NANNY'S BAKING SHOP","FRESH EGGS DAILY","HOME GYM IRONWORKS",
  "LONESOME DOVE OUTFITTERS","BLUEBERRY ROW","THE DIP STATION","REMUDA RENTALS",
  "QUIRT SPORTING GOODS","GOLDEN CONCESSIONS","WALK OF SHAME INSURANCE","TACTICAL HUGS LLC",
  "ROW Z AIRLINES","KEEPER WARS PPV","HORSECAMP","HELLFIRE CLUB",
];
const BOARD_INK = [["#c8102e","#ffd166"],["#0a2a66","#ffffff"],["#ffd166","#1a1a1a"],
  ["#0b6e3f","#ffffff"],["#ffffff","#0a2a66"],["#5b2a86","#ffd166"],["#e8600a","#ffffff"]];

/** Text on a coloured board. There is no mirror argument any more: BoxGeometry already orients
 *  each face's UVs to read from outside it, so one plain texture serves both sides. */
function boardTexture(text, bg, fg){
  const c = document.createElement('canvas');
  c.width = 512; c.height = 64;
  const x = c.getContext('2d');
  x.fillStyle = bg; x.fillRect(0, 0, 512, 64);
  x.fillStyle = fg;
  x.font = '700 40px "Barlow Condensed","Arial Narrow",sans-serif';
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(text, 256, 34);
  const t = new THREE.CanvasTexture(c);
  t.minFilter = THREE.LinearFilter;
  return t;
}

// The stand pieces, so the near ones can be faded out. Declared HERE, above buildGround, because
// buildGround fills it — and because it was not declared anywhere at all, which is what the page
// meant by "stands is not defined".
//
// The symptom was a missing team selector, three functions downstream: boot() calls buildGround
// before renderTeamSlots, buildGround threw, the guard caught it, and everything after it in
// boot never ran. Worth remembering — a thing missing from the screen is often a thing that
// threw somewhere earlier and quietly took the rest of the sequence with it.
const stands = [];

// ── THE NEAR SIDE COMES DOWN ────────────────────────────────────────────────
// A stand between you and the pitch is a wall. Broadcast cameras live in a hole cut through the
// seating for exactly this reason, and a ground with six sides has one wherever you stand.
//
// Each piece records which way it faces outward. If that agrees with the direction of the camera
// from the middle, the piece is on the camera's side and in the way — so it fades.
//
// (Restored: this function was written once and then lost, when a later edit replaced the region
// it had been appended to. Only the call in placeCam() survived, which is why the page said
// "occludeStands is not defined" from inside resize.)
function occludeStands(){
  const cx = cam.position.x - CX, cz = cam.position.z - CY;
  const cl = Math.hypot(cx, cz) || 1;
  const nx = cx/cl, nz = cz/cl;
  for (const s of stands) {
    const facing = s.ox*nx + s.oy*nz;          // 1 = directly between camera and pitch
    // Transparent below 0.30, clear above 0.62 — a band of angle rather than a line, because a
    // stand that pops in and out as you orbit is worse than one you cannot see through.
    const a = Math.max(0, Math.min(1, (0.62 - facing) / 0.32));
    const m = s.m.material;
    if (a >= 1) { s.m.visible = true; m.transparent = false; m.opacity = 1; }
    else if (a <= 0) { s.m.visible = false; }
    else { s.m.visible = true; m.transparent = true; m.opacity = a; }
  }
}

function buildGround(){
  // ── THE SURROUND ─────────────────────────────────────────────────────────
  // Grass beyond the touchline, out to the stands. A pitch that stops dead at its own line
  // looks like a cut-out; real grounds have run-off, and the eye expects it.
  {
    const out = new THREE.Shape();
    V.forEach((p, i) => {
      const x = CX + (p.x - CX) * 1.72, y = CY + (p.y - CY) * 1.72;
      i ? out.lineTo(x, y) : out.moveTo(x, y);
    });
    out.closePath();
    const surround = new THREE.Mesh(new THREE.ShapeGeometry(out),
      new THREE.MeshLambertMaterial({ color: 0x1b4f27, side: THREE.DoubleSide }));
    surround.rotation.x = Math.PI/2;
    surround.position.y = -0.4;                // under the pitch, so the touchline still reads
    scene.add(surround);
  }

  // ── THE HOARDINGS ────────────────────────────────────────────────────────
  // One board per edge, standing just outside the touchline and leaning back a little, the way
  // they do — a board square to the ground is invisible from a raised camera.
  EDGES.forEach((e, k) => {
    const [bg, fg] = BOARD_INK[k % BOARD_INK.length];
    const text = SPONSORS[(k * 7 + 3) % SPONSORS.length];
    // A BOX, NOT A PLANE. A hoarding has a thickness and an edge that catches the light, and a
    // plane seen edge-on from a low camera simply vanishes. Six materials, one per face: the two
    // long faces carry the advertisement and the rest are the board's own colour, darkened.
    //
    // three.js orders BoxGeometry materials +X, -X, +Y, -Y, +Z, -Z. The geometry is built
    // width-along-X and depth-along-Z, so the two faces to letter are +Z and -Z.
    const edgeMat = new THREE.MeshLambertMaterial({ color: new THREE.Color(bg).multiplyScalar(0.72) });
    // One texture, both lettered faces — see below.
    const faceMat = new THREE.MeshLambertMaterial({ map: boardTexture(text, bg, fg) });
    const board = new THREE.Mesh(
      new THREE.BoxGeometry(e.len * 0.92, 26, 3.2),
      // NO MIRRORING. Both previous attempts came out backwards on one side or the other, which
      // was the tell: the fault was never WHICH face got the mirrored copy, it was that either
      // face got one.
      //
      // BoxGeometry UV-maps every face so its texture reads upright when viewed from OUTSIDE
      // that face. three.js has already done the flip. Mirroring one side undoes it, and there
      // is no arrangement of one plain and one mirrored texture that reads correctly from both —
      // which is exactly what the two failed attempts demonstrated between them.
      //
      // The same plain texture on both faces is right, and is what a real hoarding does anyway:
      // printed once, seen from either side, legible from both.
      [edgeMat, edgeMat, edgeMat, edgeMat, faceMat, faceMat]);
    // BACK AGAINST THE STANDS. At 34 the boards sat INSIDE the goal frame, which reaches 40
    // behind the line — so a hoarding ran straight through the stanchions on all three goal
    // edges. Nothing was wrong with either piece; they were competing for the same ground.
    //
    // 64 puts them clear of the frame at 40 and in front of the first stand tier, whose face is
    // at 72 — with room for the lean, which tilts the top of a 26-tall board about 3 further
    // back. At 68 the top cleared the seating by barely a unit.
    //
    // Which is also where hoardings live in a real ground: at the foot of the seating, not out
    // on the grass.
    board.position.set(e.mx - e.nx * 64, 13, e.my - e.ny * 64);
    // ORDER MATTERS. three.js applies Euler angles XYZ by default, so setting .x then .y leans
    // the board in WORLD space and only then swings it to face the pitch — which points the lean
    // somewhere different on every edge, and is exactly what "askew" looks like. YXZ faces it
    // first and leans it in its own frame, so all six lean back the same way.
    board.rotation.order = 'YXZ';
    board.rotation.y = -Math.atan2(e.uy, e.ux);
    board.rotation.x = -0.22;
    scene.add(board);
  });

  // ── THE STANDS ───────────────────────────────────────────────────────────
  // Three tiers of raked seating on each edge, rising away from the pitch. Boxes rather than a
  // ramp because a rake made of steps reads as seating at a glance and a smooth slope does not.
  // BIGGER, AND CLOSED AT THE CORNERS. Five tiers rather than three, rising to nearly three
  // times the old height — the stands were a low wall you looked over rather than a bowl you sat
  // in, and a ground's scale is most of what makes it feel like a place.
  //
  // The gaps mattered more. Stands built per-edge leave a triangular hole at every hex corner,
  // and from a low camera you saw straight through the ground into black. Real stadiums close
  // those; so does this now, with a wedge at each of the six vertices.
  const TIERS = 5;
  const tierAt = t => ({ depth: 30 + t * 34, h: 26 + t * 34 });
  EDGES.forEach(e => {
    for (let t = 0; t < TIERS; t++) {
      const { depth, h } = tierAt(t);
      const tier = new THREE.Mesh(
        new THREE.BoxGeometry(e.len * 1.30, h, 32),
        new THREE.MeshLambertMaterial({ color: t % 2 ? 0x232c33 : 0x2b353d }));
      tier.position.set(e.mx - e.nx * (depth + 58), h/2, e.my - e.ny * (depth + 58));
      tier.rotation.y = -Math.atan2(e.uy, e.ux);
      scene.add(tier);
      stands.push({ m: tier, ox: -e.nx, oy: -e.ny });   // which way this stand faces outward
      const crowd = new THREE.Mesh(
        new THREE.PlaneGeometry(e.len * 1.30, 22),
        new THREE.MeshBasicMaterial({ map: crowdTexture(), side: THREE.DoubleSide }));
      crowd.position.set(e.mx - e.nx * (depth + 42), h - 7, e.my - e.ny * (depth + 42));
      crowd.rotation.order = 'YXZ';
      crowd.rotation.y = -Math.atan2(e.uy, e.ux);
      crowd.rotation.x = -0.34;
      scene.add(crowd);
      stands.push({ m: crowd, ox: -e.nx, oy: -e.ny });
    }
  });

  // The corners. A vertex of the hex is where two edges meet at 120 degrees, so the hole between
  // their stands is a wedge — filled with a column of the same tiers, turned to bisect the two.
  V.forEach(v => {
    const bx = v.x - CX, by = v.y - CY, bl = Math.hypot(bx, by);
    const ox = bx/bl, oy = by/bl;                 // outward, along the corner's own bisector
    for (let t = 0; t < TIERS; t++) {
      const { depth, h } = tierAt(t);
      const wedge = new THREE.Mesh(
        new THREE.BoxGeometry(96, h, 32),
        new THREE.MeshLambertMaterial({ color: t % 2 ? 0x1f272d : 0x27313a }));
      wedge.position.set(v.x + ox * (depth + 30), h/2, v.y + oy * (depth + 30));
      wedge.rotation.y = -Math.atan2(oy, ox) + Math.PI/2;
      scene.add(wedge);
      stands.push({ m: wedge, ox, oy });
      const crowd = new THREE.Mesh(
        new THREE.PlaneGeometry(96, 22),
        new THREE.MeshBasicMaterial({ map: crowdTexture(), side: THREE.DoubleSide }));
      crowd.position.set(v.x + ox * (depth + 14), h - 7, v.y + oy * (depth + 14));
      crowd.rotation.order = 'YXZ';
      crowd.rotation.y = -Math.atan2(oy, ox) + Math.PI/2;
      crowd.rotation.x = -0.34;
      scene.add(crowd);
      stands.push({ m: crowd, ox, oy });      // the corner crowds fade with their wedge
    }
  });

  // ── THE BENCHES ──────────────────────────────────────────────────────────
  // One per team, beside their own goal, where the 2D page puts them. A dugout roof and a row of
  // seats; who is sitting on them is drawn each frame, because that changes.
  GOAL_EDGE.forEach((k, t) => {
    const e = EDGES[k], hw = e.len * GOAL_HALF;
    // FROM THE ENGINE. It is derived from the goal edge, which is engine geometry, and it was
    // computed here and again in index.html — so a sent-off man walked to a different place
    // depending on which page you had open.
    const B = benchSpot(t);
    const bx = B.x, by = B.y;
    benchAt[t] = B;
    const dug = new THREE.Mesh(new THREE.BoxGeometry(78, 4, 26),
      new THREE.MeshLambertMaterial({ color: 0x1a2229 }));
    dug.position.set(bx, 44, by);           // raised: see the note on the seat below
    dug.rotation.y = -Math.atan2(e.uy, e.ux);
    scene.add(dug);
    for (const s of [-1, 1]) {
      const post = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 1.6, 30, 6),
        new THREE.MeshLambertMaterial({ color: 0x1a2229 }));
      post.position.set(bx + e.ux * 37 * s, 15, by + e.uy * 37 * s);
      scene.add(post);
    }
    // ── ROOM TO SIT ──────────────────────────────────────────────────────
    // 74 x 5 x 12 under a roof at 30 gave a seated player 2.5 units of headroom and a seat
    // shallower than his own body, so he perched on the front edge with his head in the ceiling.
    //
    // Wider for five, deeper than a person, and the roof lifted to 44 — which is 16.5 of
    // clearance over a seated player rather than 2.5, and reads as a dugout instead of a shelf.
    const seat = new THREE.Mesh(new THREE.BoxGeometry(96, 5, 20),
      new THREE.MeshLambertMaterial({ color: new THREE.Color(TEAMS[t].color) }));
    seat.position.set(bx, 8, by);
    seat.rotation.y = -Math.atan2(e.uy, e.ux);
    scene.add(seat);
  });
}

/** A band of speckled colour: a crowd, at the distance a crowd is ever seen from here. */
let crowdTex = null;
function crowdTexture(){
  if (crowdTex) return crowdTex;
  const c = document.createElement('canvas');
  c.width = 256; c.height = 32;
  const x = c.getContext('2d');
  x.fillStyle = '#161d22'; x.fillRect(0, 0, 256, 32);
  const pal = ['#c8102e','#0a2a66','#ffd166','#f2f2f2','#6fb7e3','#3c4b55','#8a6a4a','#2b6b3f'];
  for (let i = 0; i < 900; i++) {
    x.fillStyle = pal[(Math.random() * pal.length) | 0];
    x.globalAlpha = 0.5 + Math.random() * 0.5;
    x.fillRect(Math.random() * 256, Math.random() * 32, 2.4, 2.4);
  }
  crowdTex = new THREE.CanvasTexture(c);
  crowdTex.minFilter = THREE.LinearFilter;
  return crowdTex;
}
const benchAt = [];


// ── FIRE ────────────────────────────────────────────────────────────────────
//
// The burst used to be three cones that got brighter. Cones do not read as fire from any angle
// but side-on, because a cone is a solid shape and fire is not — fire is a lot of small hot
// things going up and away and cooling as they go. So: particles.
//
// ONE POOL, SHARED BY EVERY PLAYER. A per-player emitter would be fifteen systems and fifteen
// draw calls for something only two or three people do at once. This is a fixed ring of sprites,
// claimed by whoever is burning and returned when they die — so the cost is constant whether
// nobody is sprinting or everybody is, which is the property you want on a phone.
// 440, sized from a measurement rather than a guess. Five minutes of football peaked at 370
// embers in flight with four players burning at once — a pool of 220 would have started
// recycling sprites that were still alive, which shows up as embers vanishing mid-flight
// exactly when the effect is busiest and most worth looking at.
//
// 440 is that peak plus room, and it is 440 sprites whether anyone is sprinting or nobody is:
// the cost is flat, which is the point of a pool.
const EMBERS = 440;
const embers = [];
let emberNext = 0;

/** A soft round blob, brightest in the middle. Additive blending turns overlapping blobs into a
 *  hot core without any of them having to know about the others, which is why fire drawn this
 *  way looks lit from inside rather than painted. */
/** A five-pointed star, drawn once and shared. Additive, so overlapping stars glow rather than
 *  stack, and bright in the middle so it reads as light rather than as a sticker. */
let starTex = null;
/** A card: a rounded rectangle with a dark edge, tinted at use so one texture serves both. */
let cardTex = null;
function cardTexture(){
  if (cardTex) return cardTex;
  const c = document.createElement('canvas');
  c.width = 48; c.height = 64;
  const x = c.getContext('2d');
  x.fillStyle = 'rgba(6,10,8,.85)';
  x.fillRect(3, 3, 42, 58);
  x.fillStyle = '#ffffff';
  x.fillRect(6, 6, 36, 52);
  cardTex = new THREE.CanvasTexture(c);
  cardTex.minFilter = THREE.LinearFilter;
  return cardTex;
}

function starTexture(){
  if (starTex) return starTex;
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const x = c.getContext('2d');
  const g2 = x.createRadialGradient(32, 32, 0, 32, 32, 30);
  g2.addColorStop(0, 'rgba(255,255,255,.9)');
  g2.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g2; x.beginPath(); x.arc(32, 32, 30, 0, Math.PI*2); x.fill();
  x.beginPath();
  for (let k = 0; k < 10; k++) {
    const a = k * Math.PI/5 - Math.PI/2, r = k % 2 ? 11 : 27;
    const px = 32 + r*Math.cos(a), py = 32 + r*Math.sin(a);
    k ? x.lineTo(px, py) : x.moveTo(px, py);
  }
  x.closePath();
  x.fillStyle = '#ffffff'; x.fill();
  starTex = new THREE.CanvasTexture(c);
  starTex.minFilter = THREE.LinearFilter;
  return starTex;
}

function emberTexture(){
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
  g.addColorStop(0.0, 'rgba(255,255,255,1)');
  g.addColorStop(0.28, 'rgba(255,255,255,.72)');
  g.addColorStop(0.65, 'rgba(255,255,255,.20)');
  g.addColorStop(1.0, 'rgba(255,255,255,0)');
  x.fillStyle = g;
  x.fillRect(0, 0, 64, 64);
  const t = new THREE.CanvasTexture(c);
  t.minFilter = THREE.LinearFilter;
  return t;
}

function buildEmbers(){
  const tex = emberTexture();
  for (let i = 0; i < EMBERS; i++) {
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({
      map: tex, transparent: true, depthWrite: false,
      blending: THREE.AdditiveBlending, opacity: 0 }));
    sp.visible = false;
    scene.add(sp);
    embers.push({ sp, life: 0, max: 1, vx: 0, vy: 0, vz: 0, size: 1, pal: null });
  }
}

/** Spawn one ember behind a burning player. */
function emit(p, pal, hard){
  const e = embers[emberNext = (emberNext + 1) % EMBERS];
  // FIRE RISES AND CLINGS. The first version spawned at hip height and fired straight backwards
  // — a horizontal jet leaving a body at exactly the height and angle that reads as flatulence,
  // which is what it looked like and there is no arguing with that.
  //
  // Now it wraps the player and goes UP. Spawned in a ring around the whole body rather than a
  // patch behind it, biased to the rear so it still trails, and the dominant velocity is
  // vertical. A flame that leaves faster sideways than upwards is an exhaust.
  const hl = Math.hypot(p.hx, p.hy) || 1;
  const bx = -p.hx/hl, bz = -p.hy/hl;                 // backwards, for the bias
  const a = Math.random() * Math.PI * 2;
  const r = R_P * (0.35 + Math.random() * 0.7);
  e.sp.position.set(
    p.x + Math.cos(a) * r + bx * 5,
    H_P * (0.10 + Math.random() * 0.85),              // the whole body, feet to head
    p.y + Math.sin(a) * r + bz * 5);
  // Up hard, out gently. The small backward component is what still makes it a trail on a
  // sprinter and nothing at all on someone standing still.
  e.vx = bx * (0.35 + Math.random()*0.5) + (Math.random()-0.5)*0.35;
  e.vz = bz * (0.35 + Math.random()*0.5) + (Math.random()-0.5)*0.35;
  e.vy = 1.5 + Math.random() * 1.5;
  e.life = 0;
  e.max = 0.34 + Math.random() * 0.36;   // brief: a flame, not a cloud
  e.size = (hard ? 9 : 6.5) + Math.random() * 4.5;
  e.pal = heatRamp(pal);
  // A BLAST IS MANY TEMPERATURES AT ONCE. Each ember starts a little way into the ramp rather
  // than all at the same white — so at any instant the mass shows white cores, yellow bodies and
  // red edges together, which is what makes fire look like heat rather than a coloured cloud.
  e.t0 = Math.random() * 0.32;
  e.sp.visible = true;
}

// ── HEAT ────────────────────────────────────────────────────────────────────
// The palette ran the wrong way. FLAME3 is red, orange, pale yellow — and an ember spent its
// LONGEST, LARGEST, most spread-out phase on the last entry, so the thing you actually saw was a
// big soft yellow blob, additive, over green grass. Toxic gas, exactly as described.
//
// Real fire cools the other way: white-hot at the core, then yellow, orange, red, and dark as it
// dies. So the ramp is built hot-to-cold with the team's palette THROUGH THE MIDDLE of it —
// which keeps the easter egg (a rainbow side still burns rainbow) while making everyone read as
// heat rather than gas.
// STOPS ARE EVENLY SPACED IN TIME, so the shape of the ramp IS the shape of the colour you see.
// The old one was white, amber, orange, red, dark — five stops, which spent two fifths of every
// ember's life in the amber band. That is why it still read yellow after being reversed: the
// order was right and the WEIGHTING was not.
//
// Weighted toward the red end now. The white flash is a single short stop, amber gets one, and
// the orange-through-red descent gets four — so an ember is briefly bright and then spends most
// of what you actually watch glowing red, which is what a blast of heat looks like.
const HEAT_IN  = ['#fff0d8', '#ffb347'];                          // the flash, brief
const HEAT_OUT = ['#ff7a18', '#ff3d00', '#c81a00', '#7a0d00', '#360400'];   // the long red fall
// HERS IS NOT FIRE AT ALL. Bookending her rainbow with a heat ramp meant seven of her thirteen
// stops were somebody else's flame — she arrived orange and left red, and the rainbow was a
// stripe in the middle. If she is the easter egg, she should not be spending most of her life
// looking like everybody else.
//
// So an ordinary side burns pure heat, and she burns pure rainbow: white-hot for an instant
// because everything hot is, then straight round the wheel twice, ending on a colour rather than
// on ash. Twice, because one pass over a third of a second is a gradient and two is a shimmer.
const SPARK_IN = '#ffffff';
function heatRamp(pal){
  const special = pal.length > 3;
  if (!special) return HEAT_IN.concat(HEAT_OUT);
  const wheel = pal.concat(pal);
  return [SPARK_IN].concat(wheel, [pal[0]]);
}

/** Age every live ember, cooling it along its own heat ramp. */
const _c1 = new THREE.Color(), _c2 = new THREE.Color();
function stepEmbers(dt){
  for (const e of embers) {
    if (!e.sp.visible) continue;
    e.life += dt;
    // AN ABSOLUTE CEILING as well as the proportional one. Embers were occasionally left glowing
    // on the grass forever, and a life that is only ever compared against its own max cannot
    // recover from a bad max — an undefined or zero one makes t NaN or Infinity, and NaN >= 1 is
    // FALSE, so the ember lives on with no way back.
    //
    // 1.4 seconds is longer than any emitter asks for, so this never truncates a healthy ember
    // and always retires a broken one.
    const t = e.life / e.max;
    if (!(t < 1) || e.life > 1.4) { e.sp.visible = false; e.sp.material.opacity = 0; continue; }
    const ct = Math.min(1, (e.t0 || 0) + t * (1 - (e.t0 || 0)));   // where it sits on the ramp
    e.sp.position.x += e.vx;
    e.sp.position.z += e.vz;
    e.sp.position.y += e.vy;
    e.vy *= 0.94;                       // rises, slows, hangs
    e.vx *= 0.93; e.vz *= 0.93;
    // through the palette, hot to cool
    const n = e.pal.length, f = ct * (n - 1);
    const i = Math.min(n - 2, Math.floor(f));
    _c1.set(e.pal[i]); _c2.set(e.pal[i + 1]);
    e.sp.material.color.copy(_c1).lerp(_c2, f - i);
    // grows as it cools and fades from the tail, which is how smoke leaves a flame
    const s = e.size * (0.6 + t * 0.9);
    e.sp.scale.set(s, s, 1);
    e.sp.material.opacity = t < 0.18 ? t / 0.18 : Math.pow(1 - (t - 0.18)/0.82, 1.6);
  }
}

// A light that burns with them. Fire that does not light anything is a picture of fire — this is
// what puts the colour of a sprint onto the grass around it. One light, moved to whoever is
// burning hardest, because a phone will not thank us for fifteen.
let fireLight = null;
function buildFireLight(){
  fireLight = new THREE.PointLight(0xff8c00, 0, 420, 2);
  scene.add(fireLight);
}

// ── THE PLAYERS ─────────────────────────────────────────────────────────────
// H_P comes from the ENGINE. It is drawn here and TESTED there — a keeper's reach, the header
// band, the "too high to control" threshold all use it — and a number both sides need is a
// number neither should own privately. Same reasoning as GOAL_H.
const R_P = 11, H_P = (typeof H_HEAD !== 'undefined') ? H_HEAD : 34;
// How light a colour is, for deciding whether a number on it should be dark or pale. index.html
// has its own copy; this page cannot see it, because it lives in the front end rather than the
// engine. Duplicated deliberately — four lines is cheaper than moving a colour helper into a
// file about the rules of football.
const lum = hex => {
  const n = parseInt(String(hex).replace('#',''), 16);
  return (0.2126*((n>>16)&255) + 0.7152*((n>>8)&255) + 0.0722*(n&255)) / 255;
};
let bodies = [];
function buildBodies(){
  // Ribbons are added to the SCENE rather than to a player's group, so they lag behind her
  // instead of being carried by her — which means they have to be removed by hand here, or a
  // team change leaves streamers hanging over an empty pitch.
  bodies.forEach(b => {
    scene.remove(b.g);
    if (b.ribbons) for (const rb of b.ribbons) for (const m of rb.seg) scene.remove(m);
  });
  bodies = players.map(p => {
    const g = new THREE.Group();
    const T = TEAMS[p.team];
    const col = new THREE.Color(T.color);
    const acc = new THREE.Color(T.accent || '#ffffff');
    const thr = new THREE.Color(T.third  || T.accent || '#222222');

    // ── THE KIT ──────────────────────────────────────────────────────────
    // Every team already carries three colours and the 3D page was using one of them, so fifteen
    // cylinders came out as three flat blocks of colour. Shirt, shorts and a collar is the least
    // that reads as a kit, and it uses exactly the palette the flat page already draws with.
    //
    // Built as three stacked cylinders rather than one textured body: a texture would have to be
    // authored per team and would blur at this scale, and the geometry costs nothing.
    const SHORTS = H_P * 0.3;
    const shirt = new THREE.Mesh(
      new THREE.CylinderGeometry(R_P, R_P * 0.97, H_P - SHORTS, 16),
      new THREE.MeshLambertMaterial({ color: col }));
    shirt.position.y = SHORTS + (H_P - SHORTS)/2;
    g.add(shirt);
    const shorts = new THREE.Mesh(
      new THREE.CylinderGeometry(R_P * 0.97, R_P * 0.9, SHORTS, 16),
      new THREE.MeshLambertMaterial({ color: thr }));
    shorts.position.y = SHORTS/2;
    g.add(shorts);
    // a collar, and for a keeper the whole shirt is the accent instead — which is what a keeper
    // kit IS, rather than a badge stuck on an outfield one
    if (p.role === 'K') {
      shirt.material.color.copy(acc);
      shorts.material.color.copy(col);
    }
    const collar = new THREE.Mesh(
      new THREE.CylinderGeometry(R_P * 1.04, R_P * 1.04, 3.4, 16),
      new THREE.MeshLambertMaterial({ color: p.role === 'K' ? col : acc }));
    collar.position.y = H_P - 2.4;
    g.add(collar);
    // EYES, NOT A BEAK. A cone on the front pointed the way the player faced and read as a bird,
    // which my four-year-old reviewer spotted before I did. Two eyes carry the same information —
    // you can see which way something is looking — and a face is easier to read at a glance than
    // an arrow, because reading faces is a thing people are extremely good at.
    //
    // Set slightly apart and slightly forward, so the direction is legible in profile as well as
    // head on: from the side you see one eye, which is still a heading.
    const eyeW = new THREE.MeshLambertMaterial({ color: 0xf6f8f6 });
    const eyeD = new THREE.MeshBasicMaterial({ color: 0x14181a });
    for (const side of [-1, 1]) {
      const white = new THREE.Mesh(new THREE.SphereGeometry(3.1, 10, 8), eyeW);
      white.position.set(R_P - 1.4, H_P * 0.74, side * 4.2);
      g.add(white);
      const pupil = new THREE.Mesh(new THREE.SphereGeometry(1.5, 8, 6), eyeD);
      pupil.position.set(R_P + 1.2, H_P * 0.74, side * 4.2);
      g.add(pupil);
    }
    // A SMILE. Half a torus, opening downward, which is the cheapest curve in three.js that
    // reads as a mouth — a flat arc would vanish edge-on and a sphere would read as a nose.
    // It sits below the eyes and slightly proud of the body so the cylinder does not clip it.
    const smile = new THREE.Mesh(
      new THREE.TorusGeometry(4.4, 0.9, 6, 14, Math.PI),
      new THREE.MeshBasicMaterial({ color: 0x14181a }));
    smile.position.set(R_P - 0.6, H_P * 0.56, 0);
    smile.rotation.y = Math.PI/2;      // face the front
    smile.rotation.z = Math.PI;        // corners up, not down
    g.add(smile);
    // stamina, as a ring on the grass. The 2D page shortened an arc; from a raised camera an arc
    // is unreadable, so the value lives in colour, opacity and radius instead.
    const ring = new THREE.Mesh(new THREE.RingGeometry(R_P + 3, R_P + 7, 24),
      new THREE.MeshBasicMaterial({ color: 0x7ec97e, side: THREE.DoubleSide, transparent: true }));
    ring.rotation.x = -Math.PI/2; ring.position.y = 0.9; g.add(ring);
    // ── THE BURST ────────────────────────────────────────────────────────
    // Three tongues, in the team's own fire palette, ANCHORED AT THE BACK.
    //
    // The single cone before this had its base at x=-9 while the body's back surface is at -11 —
    // so the wide end sat INSIDE the player and the flame appeared to erupt from the middle of
    // them. Each tongue now starts at the surface and runs outward from there.
    //
    // The palette comes from the engine's firePal(), which is where the easter egg lives: a team
    // flagged `she` burns rainbow instead of orange, and the Sparkle Princesses are the only one.
    // Reading it from there rather than hard-coding three oranges is what keeps that working.
    const pal = (typeof firePal === 'function') ? firePal(p.team) : ['#ff3d00','#ff8c00','#ffd166'];
    const flames = [];
    for (let f = 0; f < 3; f++) {
      const len = 26 - f * 5;
      const tongue = new THREE.Mesh(
        new THREE.ConeGeometry(5.4 - f * 1.1, len, 7),
        new THREE.MeshBasicMaterial({
          // The CORE, so it takes the hot end of the ramp — the innermost tongue nearly white,
          // the outer ones cooling. It was indexing the raw palette, which put the palest colour
          // on the longest tongue and made the middle of a fire the coolest part of it.
          color: new THREE.Color(heatRamp(pal)[f]),
          transparent: true, opacity: 0, depthWrite: false,
          blending: THREE.AdditiveBlending }));
      tongue.rotation.order = 'YZX';
      tongue.rotation.z = Math.PI/2;                  // lay it along -X, pointing back
      // base ON the surface, tip trailing away: half the length beyond the shell
      tongue.position.set(-R_P - len/2 + 1, H_P * (0.36 + f * 0.07), (f - 1) * 3.4);
      g.add(tongue);
      flames.push(tongue);
    }
    // A SPRITE, NOT A BOX. A card is information, and a flat box shows you its edge from half
    // the angles you might be watching from — which is exactly when a booking is worth knowing
    // about. A sprite always faces the camera.
    //
    // World-scaled rather than screen-scaled, unlike the name: a card belongs to the player, not
    // to the reader, and should shrink with him as you pull back.
    const pip = new THREE.Sprite(new THREE.SpriteMaterial({
      map: cardTexture(), transparent: true, depthWrite: false, color: 0xffd166 }));
    pip.scale.set(9, 12, 1);
    pip.position.set(0, H_P + 13, 0); pip.visible = false; g.add(pip);
    // ── UNDERDOG FIRE, ON THE PLAYER ─────────────────────────────────────
    // The chip on the scoreboard says a TEAM is boosted; this says WHICH PLAYERS, which is the
    // half that matters while you are watching the pitch rather than the header. The whole side
    // gets the 15 per cent, so the whole side shows it.
    //
    // A sprite, so it faces you from any camera, and additive so it reads as light rather than a
    // sticker stuck above a head.
    // ── STARS AND RIBBONS, FOR HERS ONLY ─────────────────────────────────
    // She gets every easter egg. Three stars turning around her at different radii and speeds,
    // and two ribbons streaming off her shoulders — both drawn only for a side flagged `she`, so
    // they cost nothing at all for anybody else.
    //
    // The stars turn on their OWN clocks rather than a shared one, because three things orbiting
    // in lockstep read as a mechanism and three at different rates read as magic.
    const sparkly = !!TEAMS[p.team].she;
    const stars = [], ribbons = [];
    if (sparkly) {
      for (let k = 0; k < 3; k++) {
        const st = new THREE.Sprite(new THREE.SpriteMaterial({
          map: starTexture(), transparent: true, depthWrite: false,
          blending: THREE.AdditiveBlending,
          color: new THREE.Color(pal[(k * 2) % pal.length]), opacity: 0.9 }));
        st.scale.set(9 - k, 9 - k, 1);
        g.add(st);
        stars.push({ sp: st, r: 15 + k * 4, y: H_P * (0.45 + k * 0.22),
                     w: 1.4 + k * 0.55, ph: k * 2.1 });
      }
      // Ribbons: a short strip of segments that lags behind the shoulder, so it trails when she
      // runs and hangs when she stops — the same idea as the ball's trail and for the same
      // reason, that a streamer which does not lag is a stick.
      for (const side of [-1, 1]) {
        const seg = [];
        for (let k = 0; k < 7; k++) {
          const r = new THREE.Mesh(
            new THREE.PlaneGeometry(5.5 - k * 0.5, 3.2),
            new THREE.MeshBasicMaterial({
              color: new THREE.Color(pal[(k + (side > 0 ? 3 : 0)) % pal.length]),
              side: THREE.DoubleSide, transparent: true, opacity: 0.85 - k * 0.09,
              depthWrite: false }));
          scene.add(r);                       // in the world, not the group: it must LAG
          seg.push(r);
        }
        ribbons.push({ seg, side, hist: [] });
      }
    }

    const mo = new THREE.Sprite(new THREE.SpriteMaterial({
      map: emberTexture(), transparent: true, depthWrite: false,
      blending: THREE.AdditiveBlending, color: new THREE.Color(pal[0]), opacity: 0 }));
    mo.scale.set(15, 15, 1);
    mo.position.set(0, H_P + 17, 0);
    mo.visible = false;
    g.add(mo);
    // The name, riding above the head. Surnames only: full names are too wide to read at this
    // scale and the commentary already says who somebody is — the label's job is to let you
    // follow ONE player across a crowded pitch, and a surname does that.
    // THE NUMBER, ON THE BACK. Drawn onto a plane rather than a sprite: a sprite always faces
    // the camera, which is right for a name floating above a head and wrong for a number on a
    // shirt — the whole point of a squad number is that you read it when a player is running
    // away from you, and it should disappear when they turn round.
    // Guarded: a missing helper should cost a shirt number, not the whole match. This page
    // cannot control when a browser decides its copy of engine.js is stale.
    const num = (typeof shirtOf === 'function') ? shirtOf(p.name) : 0;
    if (num) {
      const c = document.createElement('canvas');
      c.width = 96; c.height = 64;
      const x = c.getContext('2d');
      x.font = '700 46px "Barlow Condensed", "Arial Narrow", sans-serif';
      x.textAlign = 'center'; x.textBaseline = 'middle';
      // Ink chosen against whatever the shirt actually is — the keeper's is the accent, so
      // testing the team colour would give a white number on a yellow keeper.
      const shirtCol = p.role === 'K' ? (TEAMS[p.team].accent || '#ffffff') : TEAMS[p.team].color;
      x.fillStyle = lum(shirtCol) > 0.62 ? '#14181a' : '#f6f8f6';
      x.fillText(String(num), 48, 34);
      const tex = new THREE.CanvasTexture(c);
      tex.minFilter = THREE.LinearFilter;
      // A CURVED PANEL, NOT A FLAT ONE. A plane hovering off the back of a cylinder reads as a
      // sign held behind a player, which is what looked wrong: shirts are not flat and neither
      // are the numbers on them. This is a 90-degree slice of a cylinder at the shirt's own
      // radius, so the number wraps with the body and catches the light the same way.
      //
      // ON THE BACK, WHICH IS 270 DEGREES AND NOT 180. three.js places cylinder vertices at
      // x = r*sin(theta), z = r*cos(theta) — so theta is measured from +Z, not +X. A slice
      // centred on 180 lands on -Z, which is the player's SIDE, and that is where the number
      // was. The eyes face +X, so the back is -X, which is theta 270.
      //
      // Same shape of mistake as the boards leaning the wrong way: an assumption about which
      // axis an angle starts from, invisible until something is drawn and looked at.
      const back = new THREE.Mesh(
        new THREE.CylinderGeometry(R_P * 1.005, R_P * 0.985, 15, 14, 1, true,
                                   Math.PI * 1.25, Math.PI * 0.5),
        new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide }));
      back.position.y = H_P * 0.66;
      g.add(back);
    }
    // WHITE WITH A BLACK EDGE, at the same size as an on-pitch note.
    //
    // AND A NATION'S PLAYER GETS HIS SURNAME WHILE ONE OF OURS GETS HER WHOLE NAME. That is how
    // each is actually known: nobody says "Lionel", and nobody calls Jupiter "Burns". On the
    // Banana Wizards the surname is worse than useless — two of the five are Baldwins, so the
    // label named neither of them.
    //
    // The flat page shows the full name for everybody and gets away with it because its labels
    // sit in a bigger frame; here the surname is the default and `ours` is the exception.
    const T2 = TEAMS[p.team];
    const shown = T2.ours ? p.name : p.name.split(' ').slice(-1)[0];
    const label = nameSprite(shown, '#ffffff', 30, 'rgba(6,10,8,.92)');
    // ── THE DEBUG LABEL ───────────────────────────────────────────────────
    // What this player is being told to do, right now. The engine names each branch of think()
    // as it is taken; this draws the name. Off by default and rebuilt on demand, because it is
    // a development tool rather than a feature.
    // THE BADGE, LYING FLAT ON THE CROWN OF HIS HEAD. A sprite was the obvious choice and the
    // wrong one: it faces the camera, so from overhead you see a badge standing on edge rather
    // than the disc the flat page draws.
    //
    // A horizontal plane instead, on the top of the head. From the overhead cameras it reads
    // exactly like the 2D version — which is the point, because that view IS the flat page with
    // depth — and from pitchside it foreshortens into a cap badge, which is what a thing lying on
    // somebody's head should do.
    const badge = new THREE.Mesh(
      new THREE.PlaneGeometry(R_P * 1.75, R_P * 1.75),
      new THREE.MeshBasicMaterial({ map: badgeTexture(p.team), transparent: true,
                                    depthWrite: false, side: THREE.DoubleSide }));
    badge.rotation.x = -Math.PI / 2;        // flat: its normal points at the sky
    badge.position.set(0, H_P + 0.6, 0);    // just clear of the scalp, so it never z-fights
    badge.renderOrder = 9;
    g.add(badge);

    const jobLabel = nameSprite('', '#7ee787', 22, 'rgba(6,10,8,.92)');
    jobLabel.position.set(0, H_P + 40, 0);
    jobLabel.visible = false;
    g.add(jobLabel);
    label.position.set(0, H_P + 26, 0);
    label.material.depthWrite = false;
    g.add(label);
    scene.add(g);
    return { g, ring, flames, pip, label, pal, mo, stars, ribbons, jobLabel, jobText:'', badge };
  });
}

// ── THE BALL ────────────────────────────────────────────────────────────────
// A white sphere is a marble. A football is white with black patches, and the patches are what
// make rotation VISIBLE — a featureless sphere can spin as fast as it likes and look still,
// which is why the ball never read as rolling.
//
// Drawn rather than modelled: a real truncated icosahedron is 32 faces of geometry to say
// something a texture says at a tenth of the cost, and at this size nobody counts the pentagons.
function ballTexture(){
  const c = document.createElement('canvas');
  c.width = 256; c.height = 128;
  const x = c.getContext('2d');
  x.fillStyle = '#f4f4f2'; x.fillRect(0, 0, 256, 128);
  // pentagons in two offset rows, which is what the pattern looks like unwrapped
  const put = (cx, cy, r) => {
    x.beginPath();
    for (let k = 0; k < 5; k++) {
      const a = k * 2*Math.PI/5 - Math.PI/2;
      const px = cx + r*Math.cos(a), py = cy + r*Math.sin(a);
      k ? x.lineTo(px, py) : x.moveTo(px, py);
    }
    x.closePath(); x.fillStyle = '#16181a'; x.fill();
  };
  for (let i = 0; i < 5; i++) put(26 + i*52, 40, 15);
  for (let i = 0; i < 5; i++) put(52 + i*52, 92, 15);
  put(0, 66, 13); put(256, 66, 13);
  const t = new THREE.CanvasTexture(c);
  t.minFilter = THREE.LinearFilter;
  return t;
}
const ballGL = new THREE.Mesh(new THREE.SphereGeometry(9, 22, 16),
  new THREE.MeshLambertMaterial({ map: ballTexture() }));
scene.add(ballGL);


const shadowGL = new THREE.Mesh(new THREE.CircleGeometry(9, 18),
  new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.34 }));
shadowGL.rotation.x = -Math.PI/2; shadowGL.position.y = 0.5;
scene.add(shadowGL);

// Per-frame bookkeeping the fire needs: a real delta so embers age in seconds rather than
// frames, and a note of who is burning hardest so the light knows where to sit.
// DEBUG: what every player is being told to do. Toggled with the D key, or ?jobs in the URL —
// no button, because it is for developing rather than for watching.
let showJobs = new URLSearchParams(location.search).has('jobs');
addEventListener('keydown', e => {
  if (e.key === 'd' || e.key === 'D') { showJobs = !showJobs; say(showJobs ? 'debug: instructions on' : 'debug: instructions off'); }
});

let hottest = { spent: 0, p: null };
// NOT declared here: `walkOff` is an engine name, and re-declaring it is a SyntaxError that kills
// the whole inline script. Caught by parsing the two files together before pushing, which is the
// third time that check has earned its place. The engine owns it, so the engine's is used.
let lastFrameAt = performance.now();
let drawGL = function drawGL(){
  const nowMs = performance.now();
  const dt = Math.min(0.05, (nowMs - lastFrameAt) / 1000);
  lastFrameAt = nowMs;
  hottest = { spent: 0, p: null };
  if (bodies.length !== players.length) buildBodies();
  players.forEach((p, i) => {
    const b = bodies[i]; if (!b) return;
    if (p.out && !p.benched) { b.g.visible = false; return; }
    b.g.visible = true;
    if (p.benched) {
      // ON THE BENCH, not stacked at the origin. The engine keeps a sent-off player's own x,y
      // wherever they were standing, so drawing them there leaves a ghost on the pitch.
      // SITTING ON IT, not standing in it. He was placed at y=11 at full-ish scale, which put
      // his feet on the seat top and his head 5.5 THROUGH the dugout roof, with a body wide
      // enough to fill the seat front to back. A man standing inside the furniture.
      //
      // A seated body is a bit over half a standing one, its base is the seat surface, and it
      // sits BACK from the front edge rather than centred on it. All three of those, plus the
      // roof clearance checked rather than assumed.
      const B = benchAt[p.team];
      if (B) {
        // 0.50 rather than 0.55: at 0.55 his head cleared the dugout roof by 0.8, which is not
        // clearance so much as a coincidence. 0.50 gives 2.5 and still reads as a person rather
        // than a stool.
        const SIT = 0.50;
        const slot = ((p.seat || 0) % 5) - 2;   // five seats, not four
        // along the bench for the seat, and back from its front edge so he is on it not over it
        // 2 back, not 5. The seat is 20 deep so it runs 10 either side of its centre, and a
        // seated body is 7.9 in radius — at 5 back his spine hung 2.9 over the rear edge. At 2
        // he sits inside it front and back, which is what sitting on a bench is.
        const bx2 = B.x + B.ux * slot * 18 - B.nx * 2;
        const bz2 = B.y + B.uy * slot * 18 - B.ny * 2;
        b.g.position.set(bx2, 10.5, bz2);                  // the seat's top surface
        // NO +PI. The edge normal already points INWARD — checked against the direction to the
        // centre, dot product +294 — so adding half a turn faced him at the stands. He has been
        // sitting with his back to the match since the bench was built, which the comment
        // claiming otherwise did nothing to prevent.
        b.g.rotation.y = -Math.atan2(B.ny, B.nx);
        b.g.rotation.z = 0;
        b.g.scale.set(0.72, SIT, 0.72);                    // squat, not shrunk: still his width
      }
    } else {
      b.g.position.set(p.x, p._jump || 0, p.y);
      b.g.rotation.y = -Math.atan2(p.hy, p.hx);
      b.g.scale.setScalar(1);
      // ── THE JUMP ────────────────────────────────────────────────────────
      // A header is the one moment a footballer leaves the ground, and nobody here ever did. The
      // engine's threshold for "too high to control" is ball.z > 34, and a player is 34 tall —
      // so a ball in the header band is, by the engine's own arithmetic, exactly at the top of
      // somebody's head. That is a jump waiting to be drawn.
      //
      // Render-only: it does not change who wins the ball, which the simulation decides. It
      // shows the contest that was already happening.
      // THE ENGINE OWNS THE JUMP NOW. This used to invent a height from proximity and decay it —
      // a cosmetic guess that changed nothing about who won the ball. The engine gives every
      // player a real arc with real gravity, and his reach grows with it, so the renderer's only
      // job is to draw where he already is.
      p._jump = p.jz || 0;
      // THE SULK. The engine decides how much; this draws it — a forward slump and a little lower
      // in the seat, deepening over four seconds and then easing into sullen acceptance.
      if (p.benched && p.sulk) {
        b.g.rotation.x = p.sulk * 0.34;

      // page has ever drawn it — the most consequential number in the mechanic was invisible,

      // sprite was correct when it was made and never remade.
      if (showJobs && ((p.job || '') !== b.jobText || p.jobTier !== b.jobTierDrawn)) {

        b.jobTierDrawn = p.jobTier;

        // in drawGL the only handle on it is b.g. It parsed because `g` is a legal identifier
        // and there is no `g` in scope here — which a linter would have said and a parse check
        // cannot, since the file is syntactically perfect and semantically wrong.
        b.g.remove(b.jobLabel);

        // A name alone does not say whether he was TOLD, FORBIDDEN, COACHED or DECIDING, and
        // that is the thing worth seeing at a glance. Red compels, orange forbids, yellow
        // advises, green chooses — and grey is the old cascade, which is none of those because
        // nobody has named it yet. Watching for grey is watching for work left to do.
        // 0 IS GREY AND LOUD. An untiered job means nobody assigned it — a cascade branch, or a
        // call that forgot its tier — and it must not borrow PLAYER's green. That default is how
        // a surviving cascade block hid in plain sight for hours.

  // snap that survived the ball's own journey being fixed.
  //
  // He walks. Same shape as the walk of shame: a hold-time behaviour that moves one named player
  // while the simulation is paused, opposite direction.
  // ── EVERYBODY WALKS, NOT JUST THE TAKER ───────────────────────────────────

  // instant it ran. The taker walking out was one man moving properly among fourteen who
  // materialised, which reads worse than all fifteen materialising together.

    // units on the handover frame.

    // the drawn ball was jumping, which was not. Fixing the observer would have left the jump

  }

    const f = netFly;

    // how far behind the line it has travelled, measured along the goal's own inward normal

      f.vx = f.vy = 0;

  const z = netFly ? Math.max(0, netFly.z) : Math.max(0, (ball.z || 0), held);

  // heading, through an angle of distance/radius — that is what rolling IS, and getting it from

  // it snap back to zero the moment the ball stopped.

      // step turns 1.55 radians a frame, which at 60fps is nine rotations a second — past the
      // point where a rendered wheel starts to look like it is standing still or going
      // backwards. Physically honest and visually useless. Slower reads as faster here.

    // and the header band runs 18.7 to 50 — so both hold heights sit inside it, and the holder

    // and fired again: the ball hopped in the keeper's arms.

  // this page had never once read the flag, so a power shot looked exactly like a tap-in.

    // trail of scorches down the pitch, not a solid black stripe.

    // usually a keeper's gloves — the engine says "extinguished" at exactly this moment.

    // the engine's ball sits frozen on the centre spot from the moment kickoff() runs — but what
    // is DRAWN is the one being booted back up the pitch. A tracking camera watched the spot and
    // ignored the ball, which is the one stretch where the ball is the only thing moving.
    const tx = netFly ? netFly.x : ball.x;

    // and faster than anything in open play and a lazy follow simply loses it
    const k = netFly && netFly.returning ? 0.09 : 0.035;

  stepScorch(dt);

  // a sprint pulses rather than glowing steadily — a constant light reads as a lamp, not a fire.
  if (fireLight) {
    if (hottest.p) {
      const pal = bodies[players.indexOf(hottest.p)];
      fireLight.color.set((pal && pal.pal ? pal.pal[0] : '#ff8c00'));
      fireLight.position.set(hottest.p.x, H_P * 0.7, hottest.p.y);
      fireLight.intensity = (1.4 + 1.8 * hottest.spent) *
                            (0.72 + 0.28 * Math.sin(nowMs / 42));
    } else fireLight.intensity = 0;
