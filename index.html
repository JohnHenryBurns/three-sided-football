<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b1410">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Three-Sided Football · 3D</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<!--
  A SECOND FRONT END, NOT A SECOND GAME.

  This page owns nothing about football. It loads engine.js, hands it the seventeen things it asks
  for, and draws whatever comes back. The rules, the AI, the commentary text and the ball's
  physics are all over there, and a fix to any of them lands here for free.

  The first attempt at 3D was a copy of index.html with its renderer swapped — 93 per cent
  duplicate, and every rule change would have needed making twice. That is what engine.js exists
  to prevent, and this is what it buys: a few hundred lines instead of three and a half thousand.

  It is deliberately NOT a port of the 2D page's chrome. Coach menus, team pickers, sponsor
  boards, the walk of shame — none of that is here. A camera you can move is worth more in three
  dimensions than a settings panel, and the flat page still exists for everything else.
-->

<style>
/* The flat page's palette, verbatim and under its own names — this page had the same colours
   under different ones (--line for --panel-edge, --dim for --ink-dim) and a different accent,
   hollerbox's burnt orange instead of the chalk yellow this game uses everywhere else. Two names
   for one colour is how two pages drift apart. */
:root{
  --bg:#0d1410; --panel:#152019; --panel-edge:#233529;
  --chalk:rgba(255,255,255,.85); --ink:#e8efe9; --ink-dim:#8fa596;
  --esp:#e63946; --arg:#6fb7e3; --eng:#f2f2f2;
  --hot:#ffd166;                       /* the accent this game has always used */
  --sans:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
/* CHROME PUT THE CONTROLS BELOW THE FOLD, and it took two goes.
   First fault: `height:100%` on a phone resolves against the LARGE viewport — the one you get
   with the URL bar hidden — so the bottom of the page sat below what you can see, and #bar is
   exactly at the bottom. `dvh` is the dynamic viewport height and means "the part you can see
   right now"; the vh line is the fallback for anything too old to know the unit.
   Second fault, which I introduced fixing the first: splitting `html,body{...overflow:hidden}`
   into two rules, I kept the overflow on body and dropped it from html. The document root could
   still scroll, so the page simply sat scrolled down past its own header.
   Fixed by pinning the body to the viewport instead: `position:fixed; inset:0` IS the visible
   box, tracks it as the URL bar comes and goes, and needs no dvh at all. An explicit height
   alongside inset:0 would only have been two rules arguing about the same number. */
html{height:100%;overflow:hidden}
body{position:fixed;inset:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);
  display:flex;flex-direction:column}

header{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem .75rem;
  padding:.5rem .9rem;border-bottom:1px solid var(--panel-edge);flex:0 0 auto}
h1{font-size:1.1rem;font-weight:600;letter-spacing:-.01em;color:var(--hot)}
.sub{font-family:var(--mono);font-size:.72rem;color:var(--ink-dim);letter-spacing:.04em}
.spacer{flex:1}

/* The score. Three teams, so no home-and-away layout to borrow — they sit in a row and the one
   in the lead is marked, which is the only ranking that fits on a phone. */
.scores{display:flex;gap:.35rem}
/* Over grass now rather than a dark bar, so the panel colour is not enough on its own — the chip
   carries its own shadow and a slightly heavier ground, or a pale kit behind it eats the edge. */
.sc{display:flex;align-items:center;gap:.32rem;padding:.2rem .5rem;border-radius:7px;
  background:rgba(13,20,16,.86);border:1px solid var(--panel-edge);font-size:.82rem;
  white-space:nowrap;box-shadow:0 1px 6px rgba(0,0,0,.5)}
.sc .sw{width:.6rem;height:.6rem;border-radius:2px;flex:0 0 auto}
.sc b{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sc.lead{border-color:var(--hot)}
.sc.out{opacity:.42}


#stage{position:relative;flex:1;min-height:0}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* Commentary, over the pitch rather than beside it — the pitch is the interesting part and a
   side panel would take a third of a phone to show four lines of text. */
#feed{position:absolute;left:0;right:0;bottom:0;padding:.5rem .8rem 0;
  pointer-events:none;display:flex;flex-direction:column;justify-content:flex-end;
  max-height:42%;overflow:hidden;
  background:linear-gradient(transparent,rgba(6,10,8,.82))}
#feed p{font-size:.86rem;line-height:1.35;margin-top:.2rem;text-shadow:0 1px 3px rgba(0,0,0,.8)}
#feed p:not(:last-child){opacity:.5}
#feed .goal{color:#ffd166;font-weight:700}
#feed .big{font-weight:600;font-size:.94rem}
#feed p .goal{color:#ffd166;font-weight:700}

/* The bar is now at the true bottom of the visible viewport, so on a phone with a home
   indicator it would sit under it. env() is zero everywhere that has no such thing. */
#bar{display:flex;gap:.4rem;align-items:center;
  padding:.45rem .9rem calc(.45rem + env(safe-area-inset-bottom, 0px));
  border-top:1px solid var(--panel-edge);flex:0 0 auto}
button{font-family:inherit;font-size:.82rem;color:var(--ink);background:var(--panel);
  border:1px solid var(--panel-edge);border-radius:7px;padding:.34rem .66rem;cursor:pointer}
button:hover{border-color:var(--ink)}
button.on{border-color:var(--hot);color:var(--hot)}
.hint{font-family:var(--mono);font-size:.68rem;color:var(--ink-dim);margin-left:auto}
@media (max-width:560px){ .hint{display:none} .sub{display:none} }

/* ── THE SCREENS ───────────────────────────────────────────────────────────
   A goal, a card, extra time, a champion. In the flat page these are four
   separate bits of markup; they are one component here, because they are the
   same thing — a coloured card over the pitch with a headline and a line under
   it — and four copies of one idea is how the nav went wrong earlier today. */
#cele{position:absolute;inset:0;z-index:6;display:none;
  align-items:center;justify-content:center;pointer-events:none;
  background:radial-gradient(ellipse at center,rgba(6,10,8,.35),rgba(6,10,8,.82))}
#cele.on{display:flex}
#celeCard{text-align:center;padding:1.1rem 1.6rem;border-radius:14px;
  background:rgba(10,16,13,.88);border:2px solid var(--cele,#ffd166);
  box-shadow:0 0 60px -10px var(--cele,#ffd166);max-width:88%;
  animation:celePop .34s cubic-bezier(.2,1.3,.4,1)}
@keyframes celePop{from{transform:scale(.72);opacity:0}to{transform:scale(1);opacity:1}}
#celeCard .big{font-size:2.1rem;font-weight:700;letter-spacing:-.01em;color:var(--cele,#ffd166);
  line-height:1.05}
#celeCard .who{font-size:1.15rem;font-weight:600;margin-top:.25rem}
#celeCard .sub{font-size:.9rem;color:var(--ink-dim);margin-top:.3rem}
/* The flavour line, in the card's own colour — it is the bit with the joke in it. */
#celeCard .fire{font-size:.92rem;font-weight:600;color:var(--cele,#ffd166);margin-top:.45rem}
/* The commentary's own line, under the facts. Smaller than the headline and looser than the
   sub, because it is a sentence rather than a stat. */
#celeCard .flav{font-size:.94rem;line-height:1.32;margin-top:.5rem;
  padding-top:.5rem;border-top:1px solid var(--panel-edge)}
/* Full time. Tabular figures so the columns line up, and the champion's row lifted — you should
   be able to find who won without reading the headline again. */
.ftwrap{margin-top:.7rem;padding-top:.6rem;border-top:1px solid var(--panel-edge)}
/* The goal list and the player of the match, taken from the flat page. The list scrolls if a
   match got out of hand — a 90-goal blitz should not push the buttons off the card. */
#celeCard .hl{font-size:.78rem;line-height:1.5;color:var(--ink);margin-top:.6rem;
  max-height:9rem;overflow-y:auto;text-align:left}
#celeCard .potm{font-size:.82rem;margin-top:.55rem;color:var(--hot);font-weight:600}
#celeCard .champBtns{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;margin-top:.8rem}
#celeCard .champBtns .cmBtn{font-size:.84rem;padding:.5rem .4rem;pointer-events:auto}
/* The card sits inside a layer that ignores pointers so the pitch stays draggable behind it;
   these buttons have to opt back in or they cannot be pressed. */
#cele{pointer-events:none}
#celeCard{pointer-events:auto}
table.ft{width:100%;border-collapse:collapse;font-size:.84rem;
  font-variant-numeric:tabular-nums}
table.ft th{font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-dim);font-weight:600;padding:.16rem .3rem;text-align:right}
table.ft th:first-child{text-align:left}
table.ft td{padding:.2rem .3rem;text-align:right;border-top:1px solid rgba(255,255,255,.06)}
table.ft td:first-child{text-align:left;white-space:nowrap}
table.ft tr.won td{color:var(--cele,#ffd166);font-weight:600}
table.ft .sw{display:inline-block;width:.55rem;height:.55rem;border-radius:2px;
  margin-right:.3rem;vertical-align:baseline}
@media (max-width:560px){ #celeCard .big{font-size:1.5rem} }

/* Confetti. Twenty-eight strips is enough to read as celebration and few enough
   that a phone does not care. */
#confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.confetti{position:absolute;top:-12%;width:7px;height:13px;border-radius:2px;
  animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(120vh) rotate(760deg);opacity:.15}}
@media (prefers-reduced-motion:reduce){ .confetti{display:none} #celeCard{animation:none} }

/* A card shown against a team flashes that team's chip, which is where the eye
   already is when a score changes. */
.sc.flash{animation:scFlash .7s ease-out}
@keyframes scFlash{0%{background:#ffd166;color:#14181a}100%{background:var(--panel)}}
.sc.flash.red{animation-name:scFlashRed}
@keyframes scFlashRed{0%{background:#e11d2e;color:#fff}100%{background:var(--panel)}}

/* ── THE MATCH MENU ────────────────────────────────────────────────────────
   Same options as the flat page, minus the voice engine — this page has no
   announcer, so offering a choice of throat would be a control that does
   nothing, which is worse than not having it. */
/* THE WHOLE SCREEN, not just the stage. The overlay used to stop at the pitch, so a card taller
   than the pitch had its bottom rows — the team pickers and Kick off among them — cut off below
   the fold with no indication they were there. It is fixed to the viewport now and covers the
   header and the control bar as well, which is also right in itself: while you are choosing a
   match, the controls for a match in progress are not things you should be able to reach. */
#setup{position:fixed;inset:0;z-index:20;display:none;overflow-y:auto;
  background:rgba(6,10,8,.96);padding:.8rem .7rem 2rem;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain}
#setup.on{display:block}
.setupCard{max-width:24rem;margin:0 auto;padding:.85rem 1rem 1.05rem;
  background:var(--panel);border:1px solid var(--panel-edge);border-radius:14px}
/* A chalk rule under the title, like a touchline — the flat page has one and the card looks
   unfinished without it. */
.setupCard h2{font-size:1.2rem;color:var(--hot);letter-spacing:-.01em;line-height:1}
.setupCard .tag{font-family:var(--mono);font-size:.66rem;color:var(--ink-dim);
  letter-spacing:.06em;margin:.12rem 0 .7rem;padding-bottom:.6rem;
  border-bottom:1px solid var(--panel-edge)}

/* TIGHTER. A row was a stacked label and control with three quarters of a rem above it, which is
   a lot of card spent on air when there are seven of them. Label and control share a line now,
   the label sized to the longest of them so the controls align down the right. */
.frow{display:flex;align-items:center;gap:.5rem;margin-top:.42rem}
.frow>label{flex:0 0 5.6rem;font-size:.7rem;color:var(--ink-dim);letter-spacing:.07em;
  text-transform:uppercase}
.frow select{flex:1;min-width:0;font-family:inherit;font-size:.9rem;padding:.36rem .45rem;
  background:var(--bg);color:var(--ink);border:1px solid var(--panel-edge);border-radius:7px}

/* The three toggles as one block, hairline-separated, rather than three loose rows. */
.chks{margin-top:.7rem;border:1px solid var(--panel-edge);border-radius:9px;overflow:hidden}
.chk{display:flex;justify-content:space-between;align-items:center;
  padding:.4rem .6rem;font-size:.88rem;background:var(--bg)}
.chk+.chk{border-top:1px solid var(--panel-edge)}
.chk input{width:1.05rem;height:1.05rem;accent-color:var(--hot)}
#teamSlots select{width:100%;font-family:inherit;font-size:.92rem;padding:.4rem .5rem;
  background:var(--bg);color:var(--ink);border:1px solid var(--panel-edge);border-radius:7px}
#btnStart{width:100%;margin-top:.85rem;font-size:1.05rem;font-weight:700;padding:.55rem;
  letter-spacing:.03em;
  background:var(--hot);color:#1a1005;border:0;border-radius:9px}
#btnStart:hover{filter:brightness(1.08)}

/* ── TEAM SELECTORS ────────────────────────────────────────────────────────
   The flat page's shape: three chips in the team's own colours with a stripe of
   the accent under each, a die for a random matchup, and a sheet to choose from.
   A dropdown lists names; these show you the kit, which is what you recognise a
   side by on the pitch. */
/* flex:1 so it fills the row. Without it the slot chips had no width to share and each dropped
   onto its own line — which is the column of buttons in the screenshot, not three side by side. */
#teamSlots{flex:1;min-width:0;display:flex;flex-direction:row;gap:.4rem;align-items:stretch}
.slotBtn{flex:1;min-width:0;font-family:var(--sans);font-size:1.05rem;font-weight:700;letter-spacing:.04em;
  padding:.5rem .2rem;background:var(--bg);border:2px solid var(--panel-edge);border-radius:9px;
  cursor:pointer}
.diceBtn{flex:0 0 auto;font-size:1.1rem;padding:.5rem .6rem;background:var(--bg);
  border:2px solid var(--panel-edge);border-radius:9px;cursor:pointer}
.diceBtn:hover,.slotBtn:hover{border-color:var(--ink)}

#tp{position:fixed;inset:0;z-index:21;display:none;overflow:auto;
  background:rgba(6,10,8,.94);padding:1rem}
#tp.on{display:block}
#tpCard{max-width:26rem;margin:0 auto;padding:.9rem 1rem 1.1rem;
  background:var(--panel);border:1px solid var(--panel-edge);border-radius:14px}
#tpCard .big2{font-size:1.05rem;font-weight:600;margin-bottom:.6rem;color:var(--hot)}
.tpTeam{display:flex;gap:.6rem;align-items:center;padding:.5rem .6rem;margin-top:.35rem;
  border:2px solid var(--panel-edge);border-radius:10px;cursor:pointer;background:var(--bg)}
.tpTeam:hover{border-color:var(--ink)}
.tpDot{width:2rem;height:2rem;border-radius:6px;flex:0 0 auto}
.tpBody{display:flex;flex-direction:column;min-width:0}
.tpName{font-size:1rem;font-weight:600}
.tpId{font-family:var(--mono);font-size:.66rem;color:var(--ink-dim);letter-spacing:.04em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Icons on the transport, because Pause/Play is the one control whose state you read at a
   glance and a word makes you read it. 22px so it matches the cap height beside it. */
.ico{width:1.05rem;height:1.05rem;fill:none;stroke:currentColor;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round;display:block}

/* The camera sheet, same shape as the team picker — one pattern for "choose one of these". */
#cm{position:fixed;inset:0;z-index:21;display:none;overflow:auto;background:rgba(6,10,8,.94);padding:1rem}
#cm.on{display:block}
#cmCard{max-width:22rem;margin:0 auto;padding:.9rem 1rem 1rem;
  background:var(--panel);border:1px solid var(--panel-edge);border-radius:14px}
#cmCard .big2{font-size:1.05rem;font-weight:600;margin-bottom:.6rem;color:var(--hot)}
/* The group headings in the camera sheet. Small and quiet — they are a fact about the rows
   under them, not a section of their own. */
#cmCard .cmGrp{font-size:.62rem;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-dim);margin:.7rem 0 .2rem}
#cmCard .cmGrp:first-of-type{margin-top:.4rem}
.cmOpt{display:flex;gap:.6rem;align-items:center;padding:.5rem .6rem;margin-top:.35rem;
  border:2px solid var(--panel-edge);border-radius:10px;cursor:pointer;background:var(--bg)}
.cmOpt:hover{border-color:var(--ink)}
.cmOpt.on{border-color:var(--hot)}
.cmGlyph{font-size:1.25rem;width:2rem;text-align:center;flex:0 0 auto}
.cmBody{display:flex;flex-direction:column;min-width:0}
.cmName{font-size:.98rem;font-weight:600}
.cmWhat{font-family:var(--mono);font-size:.64rem;color:var(--ink-dim);letter-spacing:.04em}

/* The overlay covers everything now, so nothing needs hiding — but the body class stays, because
   it is what tells the rest of the page a match is not running. */
body.setup{overflow:hidden}

/* Captions sit above the feed, in the middle, the way a broadcast puts them — big enough to read
   from arm's length and gone before the next line arrives. */
#caption{position:absolute;left:0;right:0;bottom:34%;z-index:5;text-align:center;
  padding:0 1.2rem;pointer-events:none;opacity:0;transition:opacity .18s}
#caption.on{opacity:1}
#caption:empty{display:none}
#caption{font-size:1.05rem;font-weight:600;line-height:1.3;
  text-shadow:0 2px 6px rgba(0,0,0,.95),0 0 14px rgba(0,0,0,.8)}
@media (max-width:560px){ #caption{font-size:.98rem;bottom:38%} }

/* Kick off sits in the header now. It is the only control that belongs to the MATCH rather than
   to the view, and the bar was getting crowded enough that everything read as equally important.
   It also stays reachable when the transport hides under the setup screen. */
header #reset{font-size:.78rem;padding:.28rem .55rem;margin-left:.1rem}

/* Both header buttons are compact — they are match-and-window controls, not the transport, and
   sizing them like the transport would say they were the same kind of thing. */
header #reset,header #full{font-size:.78rem;padding:.28rem .5rem}
header #full{padding:.3rem .42rem}
header #full.on{border-color:var(--hot);color:var(--hot)}

/* The countdown, straight from the flat page. Four beats over 6.6 seconds: the ball waits for
   the booth, which is what gives a kick-off the feeling of a thing about to start rather than a
   thing that already has. */
#countdown{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  z-index:7;pointer-events:none;font-weight:900;font-size:7rem;color:#fff;
  text-shadow:0 4px 22px rgba(0,0,0,.75)}
#countdown.on{display:flex}
#countdown span{animation:countPop 1.06s ease-out forwards;display:block}
@keyframes countPop{0%{transform:scale(1.7);opacity:0}22%{transform:scale(1);opacity:1}
  82%{opacity:1}100%{transform:scale(.92);opacity:0}}
@media (max-width:560px){ #countdown{font-size:5rem} }
@media (prefers-reduced-motion:reduce){ #countdown span{animation:none;opacity:1} }

/* ── THE SCOREBOARD ────────────────────────────────────────────────────────
   On the pitch rather than in the header. A score belongs to the match you are
   watching, and putting it in a bar above the picture makes it a page element —
   which is also why it vanished the moment you went fullscreen and the page went
   away. It travels with the pitch now.

   The clock sits centred UNDER the scores because it belongs to all three of
   them equally. Beside them it looked like a fourth team's column. */
#hud{position:absolute;top:0;left:0;right:0;z-index:4;pointer-events:none;
  display:flex;flex-direction:column;align-items:center;gap:.22rem;
  padding:.5rem .6rem 0;
  background:linear-gradient(rgba(6,10,8,.72),transparent)}
#hud .scores{display:flex;gap:.35rem;flex-wrap:wrap;justify-content:center}
#hud #clock{font-family:var(--mono);font-size:.86rem;font-variant-numeric:tabular-nums;
  color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.9);letter-spacing:.04em}

/* Above the setup menu, which is z-index 20. An error you cannot see is worse than no error
   reporting at all, because the page looks like it merely did nothing. */
#fatal{position:fixed;left:.6rem;right:.6rem;bottom:.6rem;z-index:40;
  background:rgba(40,10,12,.97);border:1px solid #ff6b6b;border-radius:10px;
  padding:.6rem .75rem;font-size:.86rem;line-height:1.35;color:#ffdede}
#fatal b{color:#ff6b6b}
#fatal .where{font-family:var(--mono);font-size:.66rem;opacity:.75;margin-top:.3rem;
  word-break:break-all}
#fatal .tap{font-family:var(--mono);font-size:.62rem;opacity:.5;margin-top:.35rem}

/* Team names in the commentary carry their colour inline from the engine; the weight is the
   page's job and this page was not doing it. */
.tm{font-weight:600}

/* The momentum flame, from the flat page's scorecards: a side on a boost gets a flame on its
   chip. It is the only visible sign that underdog fire is doing anything, and without it the
   setting is a checkbox with no consequence you can see. */
.sc .fl{display:none;margin-left:.1rem;font-size:.78rem}
.sc.hot .fl{display:inline-block;animation:flick .6s infinite alternate}
@keyframes flick{from{transform:scale(1) rotate(-4deg)}to{transform:scale(1.25) rotate(5deg)}}
@media (prefers-reduced-motion:reduce){ .sc.hot .fl{animation:none} }

/* The coach sheet. Same shape as the camera and team pickers — one pattern for "choose one of
   these" — and reached by tapping a side's chip on the scoreboard, which is where your eye
   already is when you decide a team needs help. */
#co{position:fixed;inset:0;z-index:22;display:none;overflow:auto;
  background:rgba(6,10,8,.94);padding:1rem}
#co.on{display:block}
#coCard{max-width:24rem;margin:0 auto;padding:.9rem 1rem 1rem;
  background:var(--panel);border:1px solid var(--panel-edge);border-radius:14px}
#coCard .big2{font-size:1.05rem;font-weight:600;margin-bottom:.5rem}
#coCard .grp{font-size:.64rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim);
  margin:.7rem 0 .3rem}
/* The flat page's coach layout, taken verbatim — rows of buttons in a grid, a line of
   description under each saying what the choice DOES, and a foot with release and resume. The
   stacked list this page had was three times as tall and explained nothing. */
.cmSec{margin-top:.75rem;font-size:.64rem;letter-spacing:.16em;color:var(--ink-dim);
  text-transform:uppercase}
.cmRow{display:grid;gap:.35rem;margin-top:.32rem}
.cmBtn{width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;
  font-family:inherit;font-size:.72rem;padding:.38rem .3rem;background:var(--bg);color:var(--ink);
  border:1px solid var(--panel-edge);border-radius:7px;cursor:pointer}
.cmBtn:hover{border-color:var(--ink)}
.cmBtn.sel{border-color:var(--cele);color:#fff;background:rgba(255,255,255,.08);
  box-shadow:0 0 8px var(--cele)}
.cmBtn.go{border-color:var(--arg)}
.cmFoot{grid-template-columns:1fr 1fr;margin-top:.9rem}

<header>

  <span class="sub">3D · experimental</span>
  <span class="spacer"></span>
  <button id="reset" title="New match">Kick off</button>
  <button id="full" title="Fullscreen" aria-label="Enter fullscreen">

  </div>
  <div id="setup" class="on">
    <div class="setupCard">

      <p class="tag">One ball. Three goals. Two enemies each.</p>

      <div class="frow"><label for="setRules">Scoring</label>
        <select id="setRules">
          <option value="points" selected>&plusmn;1 points &mdash; scorer +1, conceder &minus;1</option>

  <!-- ── SPEED: A SLOWER AND A FASTER, WITH THE TRUTH BETWEEN THEM ──────────────
       One button that cycled meant you could only reach 0.25x by pressing through everything
       else, and could not tell what the next press would do. Two buttons say it: the arrows
       point the way each one moves, the number between them is where you are, and a button

<!-- The version tag exists because GitHub Pages caches, and a page fetched fresh alongside an
     engine.js from twenty minutes ago fails in the most confusing way available: everything works
     except the newest thing. That is what "shirtOf is not defined" was — the page had the call and
     the cached engine did not have the function. Bump this whenever engine.js changes shape. -->
<script src="engine.js?v=204"></script>
<script>
// ── WHAT THE ENGINE ASKS FOR ────────────────────────────────────────────────
// Seventeen hooks. Most of them are about chrome this page does not have — coach menus, team
// pickers, sponsor boards — and those stay no-ops rather than being invented. A hook that does
// nothing is a decision; a hook that is missing is a crash.
const feedEl = document.getElementById('feed');
// ── THE COLOUR RULES OF THE COMMENTARY ──────────────────────────────────────
// The engine writes team names already wrapped: <span class="tm" style="color:...">. It does NOT
// wrap player names — the flat page colours those itself, from a map the engine builds, and this
// page never did. So Spain was red and Lamine Yamal was plain white in the same sentence.
//
// NAME_COL is filled by the engine's refreshNameColors(); all that was missing here was the
// half that reads it.
function colorNames(html){
  if (typeof NAME_COL === 'undefined' || !NAME_COL) return html;
  for (const [n, c] of NAME_COL)
    if (html.indexOf(n) >= 0) html = html.split(n).join('<b style="color:' + c + '">' + n + '</b>');
  return html;
}

function say(html, big){
  html = colorNames(html);
  announce(html, big);
  // THE CARD SITS ON TOP OF THE FEED, so a goal's flavour line — the good one, "HOLY HAND
  // GRENADE from Kane", "John Wick calm, one look one finish" — arrived in the feed at exactly
  // the moment the celebration was covering it, and was gone by the time the card lifted.
  //
  // A big line while a card is up belongs ON the card. It is the same event described twice: the
  // hook gives the facts, the commentary gives the flavour, and separating them across two
  // layers means you only ever see the facts.
  // BUFFERED, NOT INJECTED. The engine calls say() and showCelebration() in whichever order
  // suits it — for a legit goal the card comes first, for an OWN GOAL the line comes first — and
  // injecting into the card only works in the first case. In the second the card's innerHTML
  // was written afterwards and wiped the line straight back out, which is why own goals lost
  // their flavour and ordinary ones kept it.
  //
  // So the line is remembered and the CARD asks for it. Either order works.
  if (big) { lastBig = { html, at: performance.now() }; applyFlav(); }
  const p = document.createElement('p');
  p.innerHTML = String(html || '');
  // NOT `if (big)`. `big` means announce this urgently — a grudge match forming, an alliance
  // shifting, a keeper catching fire — and none of those are goals. The engine already wraps the
  // twenty lines that ARE goals in <span class="goal">, so the markup decides and the page does
  // not. Colouring every urgent line yellow made most of the feed yellow, which meant the colour
  // stopped saying anything.
  //
  // Urgency is weight, which is a different axis from what-kind-of-event.
  if (big) p.className = 'big';
  feedEl.appendChild(p);
  while (feedEl.children.length > 5) feedEl.removeChild(feedEl.firstChild);
}
Object.assign(ENGINE_HOOKS, {
  say,
  renderScore,

  // spawnNote, spawnPing, flash, flamePop, openCoachMenu, closeCoachMenu, showSetup,
  // renderTeamSlots, resetGoals, drawBoards and clearMarks stay no-ops: this page has no
  // sponsor boards, no coach menu and no SVG marks to clear.
});


// ── THE ANNOUNCER ───────────────────────────────────────────────────────────
// The browser's own voice. No hollerbox here — that was pulled out of this page deliberately and
// this is not the moment to put an experiment back inside an experiment.
//
// The engine already writes the commentary; all this does is speak it and put it on screen. The
// text arrives as HTML with colour spans in it, so it has to be stripped before speaking or the
// voice reads out the markup.
// `voiceOn` is an ENGINE name — declaring it here again is a SyntaxError that kills the whole
// inline script, which is exactly how this page went blank earlier today. Caught before shipping
// this time by concatenating the two files and parsing them together, which is the only test
// that sees it.
const speechOK = 'speechSynthesis' in window;
let sayAloud = false, capsOn = true, lastSpokeAt = 0;
const capEl = document.getElementById('caption');

// THE FLAT PAGE'S PIPELINE, and I had ported only its first line. Stripping tags is not enough:
// what is left is full of emoji, and a screen reader voice says "bullseye" and "yellow square"
// out loud in the middle of a sentence.
//
// The rest of it is hard-won and worth keeping verbatim — stretched spellings like GOOOAL read
// as "gull" unless collapsed, and "+1" and "20s" are read as characters rather than as words
// unless spelled out. Emphasis comes from delivery, not from spelling.
const strip = html => String(html)
  .replace(/<[^>]*>/g, '')
  .replace(/&mdash;|&#8212;/g, '\u2014')
  .replace(/&[a-z]+;/g, ' ')
  .replace(/[\p{Extended_Pictographic}\u{FE0F}\u{200D}]/gu, '')   // no more "yellow square"
  .replace(/G+O+A+L+/gi, 'goal')
  .replace(/\+1/g, 'plus one').replace(/\u22121/g, 'minus one').replace(/-1\b/g, 'minus one')
  .replace(/\+(\d+)s\b/g, 'plus $1 seconds')
  .replace(/(\d+)s\b/g, '$1 seconds')
  .replace(/\s*\u2014\s*/g, ', ')          // eat the spaces too, or it says "CARD , Romero"
  .replace(/\s+/g, ' ')
  .trim();

function shutUp(){
  if (speechOK) { try { speechSynthesis.cancel(); } catch(e){} }
  // The queue goes too. Without this, resetting mid-match leaves a goal from the last one
  // waiting to be shouted over the setup screen.
  highQ = []; speakingPrio = null; highLockUntil = 0;
  if (pendingHigh) { clearTimeout(pendingHigh); pendingHigh = null; }
  capEl.classList.remove('on');
}

// ── THE ANNOUNCER'S QUEUE ───────────────────────────────────────────────────
//
// Goals were being dropped, and sometimes the voice went silent altogether. My version did
// `cancel()` then `speak()` on the next line — and the flat page's comments name both faults
// exactly, having hit them first:
//
//   "the old 'latest wins' slot let a goal be replaced by its own follow-ups"
//   "Android fires onend for CANCELLED utterances"
//   "the Android speech engine is unstable under cancel/speak churn"
//
// cancel() is asynchronous. A speak() issued in the same tick is routinely swallowed, which is
// the silence. And a goal followed within a second by its own commentary meant the second call
// cancelled the first — so the goal itself never got said.
//
// So: big calls QUEUE IN ORDER and never clobber one another. Cancelling low speech defers the
// next call by 90ms rather than racing it. And a big call holds the microphone for two seconds
// so ordinary chatter cannot jump in front of a goal.
let highQ = [], speakingPrio = null, pendingHigh = null, highLockUntil = 0, lastCancelAt = 0;

function utter(text, cap, isGoal){
  const u = new SpeechSynthesisUtterance(text);
  u.rate  = isGoal ? 0.98 : 1.12;      // the goal call slows down and lifts
  u.pitch = isGoal ? 1.06 : 1;
  if (capsOn && cap) {
    capEl.textContent = cap;
    capEl.classList.add('on');
    clearTimeout(capEl._t);
    capEl._t = setTimeout(() => capEl.classList.remove('on'), isGoal ? 4200 : 2800);
  }
  u.onend = u.onerror = () => {
    speakingPrio = null;
    // Only drain if nothing is already deferred: a cancelled utterance fires onend too, and
    // without this guard that ghost drains the queue ahead of the goal it was cancelled for.
    if (highQ.length && !pendingHigh) {
      const nxt = highQ.shift();
      highLockUntil = performance.now() + 2000;
      setTimeout(() => {
        try { speakingPrio = 'high'; speechSynthesis.speak(utter(nxt[0], nxt[1], nxt[2])); }
        catch (e) { speakingPrio = null; }
      }, 40);
    }
  };
  return u;
}

function announce(html, big){
  const text = strip(html);
  // The caption keeps its punctuation and em-dashes — only the speech needs those flattened.
  const cap = String(html).replace(/<[^>]*>/g, '')
    .replace(/[\p{Extended_Pictographic}\u{FE0F}\u{200D}]/gu, '')
    .replace(/\s+/g, ' ').trim();
  if (!text) return;

  if (capsOn && !sayAloud) {           // captions without a voice still need showing
    capEl.textContent = cap;
    capEl.classList.add('on');
    clearTimeout(capEl._t);
    capEl._t = setTimeout(() => capEl.classList.remove('on'), big ? 4200 : 2800);
  }
  if (!sayAloud || !speechOK) return;

  const isGoal = /G+O+A+L+|IT'S IN|NET BULGES/i.test(html);
  const now = performance.now();
  const fire = () => {
    try { speakingPrio = big ? 'high' : 'low'; speechSynthesis.speak(utter(text, cap, isGoal)); }
    catch (e) { speakingPrio = null; }
  };

  if (big) {
    highLockUntil = now + 2000;        // the mic belongs to the big calls
    if (speakingPrio === 'high' || pendingHigh || highQ.length) {
      if (highQ.length < 4) highQ.push([text, cap, isGoal]);   // in order, never clobbered
      return;
    }
    if (speechSynthesis.speaking || speechSynthesis.pending) {
      // Interrupting ordinary chatter: cancel, then WAIT. Speaking in the same tick as a cancel
      // is what loses the utterance.
      if (now - lastCancelAt > 150) { try { speechSynthesis.cancel(); } catch (e) {} lastCancelAt = now; }
      pendingHigh = setTimeout(() => { pendingHigh = null; fire(); }, 90);
      return;
    }
    fire();
    return;
  }

  // Chatter waits its turn, and stays out of the way of anything big.
  if (now < highLockUntil || speakingPrio || pendingHigh || highQ.length) return;
  if (speechSynthesis.speaking || speechSynthesis.pending) return;
  if (now - lastSpokeAt < 900) return;
  lastSpokeAt = now;
  fire();
}

setInterval(() => { try { if (sayAloud && speechSynthesis.speaking) speechSynthesis.resume(); } catch(e){} }, 4000);
document.addEventListener('visibilitychange', () => { if (document.hidden) shutUp(); });

// ── KEEP THE SCREEN ON ──────────────────────────────────────────────────────
// A match you are watching rather than touching will put a phone to sleep in thirty seconds. The
// flat page holds a wake lock for exactly this reason and this one did not — which matters more
// here, not less, since there is even less reason to touch the screen.
//
// Re-acquired on visibility change, because the lock is released when a tab is backgrounded and
// is NOT restored when it comes back.
let wake = null;
async function keepAwake(on){
  try {
    if (on && !wake && navigator.wakeLock) wake = await navigator.wakeLock.request('screen');
    else if (!on && wake) { await wake.release(); wake = null; }
  } catch (e) { /* refused or unsupported: the match still plays */ }
}
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && running) keepAwake(true); else wake = null;
});

// ── THE SCENE ───────────────────────────────────────────────────────────────
const cv = document.getElementById('gl');
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0d1410, 1400, 3400);   // pushed back for the bigger ground
const cam = new THREE.PerspectiveCamera(40, 1, 1, 4000);
const ren = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
ren.setPixelRatio(Math.min(2, devicePixelRatio || 1));
ren.setClearColor(0x0d1410, 1);

// A raised three-quarter orbit. Three-sided football has no attacking direction, so there is no
// end to sit behind — every camera convention borrowed from two-goal football picks a side, and
// picking a side here is picking a team. 30 degrees is low enough that players have height and
// the ball's arc reads against the grass rather than only against its shadow.
let az = -Math.PI/2, el = 0.52, rad = 840, follow = true;
const look = new THREE.Vector3(CX, 0, CY);
function placeCam(){
  cam.position.set(look.x + rad*Math.cos(el)*Math.cos(az),
                   look.y + rad*Math.sin(el),
                   look.z + rad*Math.cos(el)*Math.sin(az));
  cam.lookAt(look);
  if (stands.length) occludeStands();
}
function resize(){
  const r = cv.getBoundingClientRect();
  // A ZERO BOX IS NOT A REASON TO GIVE UP. This returned and never came back, so if the canvas
  // measured zero at boot — which a layout can, for one frame, before it settles — the renderer
  // kept its default size and the scene drew into nothing. Everything was built, positioned and
  // lit, and none of it appeared.
  //
  // The ResizeObserver only helps if the box later CHANGES; a box that is zero and stays zero
  // fires once and never again. Retrying on the next frame costs nothing and covers the case.
  if (!r.width || !r.height) { requestAnimationFrame(resize); return; }
  ren.setSize(r.width, r.height, false);
  cam.aspect = r.width / r.height;
  cam.updateProjectionMatrix();
  placeCam();
}
new ResizeObserver(resize).observe(cv);

scene.add(new THREE.AmbientLight(0xffffff, 0.66));
const sun = new THREE.DirectionalLight(0xffffff, 0.75);
sun.position.set(400, 1000, -300);
scene.add(sun);

// ── THE PITCH ───────────────────────────────────────────────────────────────
// Built from the engine's own V and EDGES, so the mesh cannot drift from the shape the ball
// bounces off. That is the whole argument for a shared engine, in one object.
//
// Inside a function, and called from boot(), because at top level a throw here happens BEFORE
// the guard below and takes the page down with nothing said. The first guarded version had
// exactly that hole: it caught everything except the part most likely to fail.
function buildPitch(){
  const shape = new THREE.Shape();
  V.forEach((p, i) => i ? shape.lineTo(p.x, p.y) : shape.moveTo(p.x, p.y));
  shape.closePath();
  // THE GRASS WAS BLACK. A Shape is built in the XY plane and its normals point along +Z;
  // rotating the mesh -90 degrees about X lays it flat and points every normal at the floor, so
  // the sun lit the underside and the top got nothing but ambient. Rotating +90 and taking the
  // other side is the fix, and DoubleSide means it cannot happen again from the other direction.
  const grass = new THREE.Mesh(new THREE.ShapeGeometry(shape),
    new THREE.MeshLambertMaterial({ color: 0x2a6b38, side: THREE.DoubleSide }));
  // PLUS ninety, not minus. A Shape lives in XY and rotating it -90 about X sends (x,y) to
  // (x,0,-y) — the pitch came out mirrored through the centre line, sitting south of the players
  // who are placed at z = +p.y. The lines were built as explicit Vector3s with y as z, so THEY
  // were right, which is why the markings and the grass disagreed.
  grass.rotation.x = Math.PI/2;
  scene.add(grass);

  // ── THE MARKINGS ─────────────────────────────────────────────────────────
  // Drawn as RIBBONS, not lines. THREE.LineBasicMaterial has a linewidth property and almost
  // every browser ignores it — every marking on this pitch was a one-pixel hairline that thinned
  // to nothing as the camera pulled back, which is why the pitch read as bare grass.
  //
  // A ribbon is two triangles per segment laid flat on the turf. It has real width in world
  // units, so it stays a line of chalk at any distance, and it can be as bright as chalk is.
  const CHALK = 0xf2f6f2;
  function ribbon(pts, w, colour, y){
    const half = w/2, verts = [], h = y === undefined ? 0.8 : y;
    for (let i = 0; i < pts.length - 1; i++) {
      const a = pts[i], b = pts[i+1];
      const dx = b.x - a.x, dz = b.z - a.z, d = Math.hypot(dx, dz) || 1;
      const nx = -dz/d * half, nz = dx/d * half;
      verts.push(a.x+nx, h, a.z+nz,  b.x+nx, h, b.z+nz,  b.x-nx, h, b.z-nz);
      verts.push(a.x+nx, h, a.z+nz,  b.x-nx, h, b.z-nz,  a.x-nx, h, a.z-nz);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
    scene.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({
      color: colour === undefined ? CHALK : colour, side: THREE.DoubleSide,
      transparent: true, opacity: 0.92 })));
  }

  // THE TOUCHLINE, and it is the widest of them: it is the edge of the world here, and a pitch
  // whose boundary you cannot see is a green field with players milling about on it.
  ribbon(V.concat([V[0]]).map(p => new THREE.Vector3(p.x, 0, p.y)), 5.5);
  // A closed ring of points, at the flat page's own radius of 70 rather than the 92 I guessed.
  const ring = (r, cx, cy, from, to) => {
    const pts = [];
    const a0 = from === undefined ? 0 : from, a1 = to === undefined ? Math.PI*2 : to;
    for (let k = 0; k <= 64; k++) {
      const a = a0 + (a1 - a0) * k/64;
      pts.push(new THREE.Vector3((cx === undefined ? CX : cx) + r*Math.cos(a), 0,
                                 (cy === undefined ? CY : cy) + r*Math.sin(a)));
    }
    ribbon(pts, 3.6);
  };
  ring(70);
  scene.add(new THREE.Mesh(new THREE.CircleGeometry(4, 10),
    new THREE.MeshBasicMaterial({ color: 0xdfe8df })).rotateX(Math.PI/2));

  // THE HEX DIVISIONS. Dashed spokes from the centre to the three NON-goal edges, which is what
  // divides the pitch into three thirds — one per team. Two-goal football has a halfway line;
  // this is the three-sided equivalent and the flat page draws it.
  [1, 3, 5].forEach(k => {
    const e = EDGES[k], pts = [];
    for (let i = 0; i <= 22; i++) {            // dashes, as short segments
      if (i % 2) continue;
      const t0 = i/22, t1 = Math.min(1, (i+1)/22);
      ribbon([new THREE.Vector3(CX + (e.mx-CX)*t0, 0, CY + (e.my-CY)*t0),
              new THREE.Vector3(CX + (e.mx-CX)*t1, 0, CY + (e.my-CY)*t1)], 3.0);
    }
  });

  // THE PENALTY ARCS. One in front of each goal, at the distance the engine actually uses for
  // the zone rule rather than a number that merely looks right — a line the ball ignores is
  // worse than no line.
  // 112, taken from the rule rather than chosen. Two numbers live in that code: the ball opens
  // the zone at 110, and a player who strays inside is pushed back out to 112. The one you can
  // SEE is 112 — it is where attackers visibly stop — so that is the one to draw. A line at any
  // other radius would be a line the players ignore, which is worse than no line.
  const PEN = 112;
  GOAL_EDGE.forEach(gi => {
    const e = EDGES[gi];
    const face = Math.atan2(e.ny, e.nx);       // inward, toward the middle
    ring(PEN, e.mx, e.my, face - Math.PI/2, face + Math.PI/2);
    // the spot
    const spot = new THREE.Mesh(new THREE.CircleGeometry(3.4, 10),
      new THREE.MeshBasicMaterial({ color: 0xdfe8df }));
    spot.rotation.x = Math.PI/2;
    spot.position.set(e.mx + e.nx*PEN*0.62, 0.75, e.my + e.ny*PEN*0.62);
    scene.add(spot);
  });

  // three goals, on the three goal edges the engine nominates
  const postMat = new THREE.MeshLambertMaterial({ color: 0xf2f4f2 });
  GOAL_EDGE.forEach((gi, t) => {
    // HGT comes from the ENGINE now. It is the height the RULE tests against, and drawing a bar
    // at a different number is exactly what let a ball between 28 and 54 pass under a drawn
    // crossbar, inside the frame, without scoring. The width already came from GOAL_HALF; the
    // height had no equivalent, so the picture and the rule were free to disagree and did.
    const e = EDGES[gi], half = e.len * GOAL_HALF, HGT = GOAL_H;
    for (const s of [-1, 1]) {
      const post = new THREE.Mesh(new THREE.CylinderGeometry(3.2, 3.2, HGT, 8), postMat);
      post.position.set(e.mx + e.ux*half*s, HGT/2, e.my + e.uy*half*s);
      scene.add(post);
    }
    const bar = new THREE.Mesh(new THREE.CylinderGeometry(3.2, 3.2, half*2, 8), postMat);
    bar.position.set(e.mx, HGT, e.my);
    // THE DEFAULT ORDER IS THE RIGHT ONE HERE, and I broke it by "fixing" it. A three.js Euler
    // order names a MATRIX PRODUCT: XYZ is Rx*Ry*Rz, so the LAST letter is applied to a vector
    // FIRST. XYZ therefore lays the cylinder down (z) and then swings it (y), which is exactly
    // what a crossbar wants. Setting ZYX did the opposite — swung an upright cylinder, where it
    // does nothing, then laid it along world X on every edge.
    //
    // Checked with the matrices rather than reasoned about: under XYZ the bar is parallel to its
    // goal line on all three goals, under ZYX on none of them. A cylinder is symmetric, so
    // parallel is the test and not equal — the axis comes out antiparallel and that is the same
    // line.
    bar.rotation.z = Math.PI/2;
    bar.rotation.y = -Math.atan2(e.uy, e.ux);
    scene.add(bar);
    // ── THE FRAME BEHIND THE GOAL ────────────────────────────────────────
    // A real goal is held up by two angled stanchions running back and down from the top of each
    // post to a ground bar behind — and the net hangs OFF those, which is why a goal has that
    // wedge shape from side on rather than being a box.
    //
    // The net was also far too subtle: an opacity-0.38 line mesh in a colour lerped halfway to
    // white disappeared against grass from any distance. Brighter, denser, and now with something
    // visible holding it up.
    const BACK = 40;                                    // how far the frame reaches behind the line
    // THE TEAM'S COLOUR, EXACTLY. It was lerped 35 per cent toward white, which is how a red
    // frame came out pink and a white one came out white-on-white — a washed colour reads as a
    // rendering artefact rather than a choice, and the point of colouring the frame is to say
    // whose goal it is.
    //
    // The posts and crossbar stay white, so the frame identifies the goal and the mouth still
    // reads as a mouth.
    const barMat = new THREE.MeshLambertMaterial({ color: new THREE.Color(TEAMS[t].color) });
    const foot = [];                                    // where each stanchion meets the ground
    for (const sgn of [-1, 1]) {
      const topX = e.mx + e.ux*half*sgn,  topZ = e.my + e.uy*half*sgn;
      const botX = topX - e.nx*BACK,      botZ = topZ - e.ny*BACK;
      foot.push({ x: botX, z: botZ });
      // the stanchion itself: a cylinder from the top of the post down and back to the ground
      const dx = botX - topX, dy = -HGT, dz = botZ - topZ;
      const len = Math.hypot(dx, dy, dz);
      const st = new THREE.Mesh(new THREE.CylinderGeometry(2.4, 2.4, len, 7), barMat);
      st.position.set((topX+botX)/2, HGT/2, (topZ+botZ)/2);
      // point it along the run: a cylinder is built up the Y axis, so rotate Y onto that vector
      st.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0),
        new THREE.Vector3(dx/len, dy/len, dz/len));
      scene.add(st);
    }
    // the ground bar joining the two feet, which is what the bottom of the net is tied to
    {
      const gl2 = Math.hypot(foot[1].x-foot[0].x, foot[1].z-foot[0].z);
      const gb = new THREE.Mesh(new THREE.CylinderGeometry(2.2, 2.2, gl2, 7), barMat);
      gb.position.set((foot[0].x+foot[1].x)/2, 2.2, (foot[0].z+foot[1].z)/2);
      // THE DEFAULT ORDER, like the crossbar two feet away. I set ZYX here and it is wrong for
      // exactly the reason I wrote down when I un-broke the crossbar: a three.js Euler order
      // names a matrix product, so the LAST letter is applied to a vector FIRST. ZYX swings an
      // upright cylinder about Y, where it does nothing, and then lays it along world X on every
      // goal. XYZ lays it down first and then swings it, which is what a bar wants.
      //
      // Checked with the matrices: wrong on 3 of 3 goals under ZYX, right on 3 of 3 under the
      // default. I had the answer written in a comment and reached for the other one anyway.
      gb.rotation.z = Math.PI/2;
      gb.rotation.y = -Math.atan2(foot[1].z-foot[0].z, foot[1].x-foot[0].x);
      scene.add(gb);
    }

    // ── THE NET, HUNG OFF THE FRAME ──────────────────────────────────────
    // Every cord runs between the goal mouth and the frame behind, so the sheet follows the slope
    // the stanchions define rather than hanging in a plane of its own.
    const netMat = new THREE.LineBasicMaterial({
      color: 0xf4f8f6, transparent: true, opacity: 0.62 });
    const COLS = 15, ROWS = 9;
    const pts = [];
    // u across the mouth, v up it; the net's depth falls off as v drops, which is the slope
    const at = (u, v) => {
      const mx = e.mx + e.ux*half*(u*2-1), mz = e.my + e.uy*half*(u*2-1);
      const d = BACK * (1 - v) * 0.92;                   // deepest at the foot, tight at the bar
      return new THREE.Vector3(mx - e.nx*d, HGT*v, mz - e.ny*d);
    };
    for (let i2 = 0; i2 <= COLS; i2++) for (let j2 = 0; j2 < ROWS; j2++)
      pts.push(at(i2/COLS, j2/ROWS), at(i2/COLS, (j2+1)/ROWS));
    for (let j2 = 0; j2 <= ROWS; j2++) for (let i2 = 0; i2 < COLS; i2++)
      pts.push(at(i2/COLS, j2/ROWS), at((i2+1)/COLS, j2/ROWS));
    // and the two side panels, from post to stanchion
    for (const sgn of [-1, 1]) {
      const side = (w, v) => {
        const px = e.mx + e.ux*half*sgn, pz = e.my + e.uy*half*sgn;
        const d = BACK * (1 - v) * 0.92 * w;
        return new THREE.Vector3(px - e.nx*d, HGT*v, pz - e.ny*d);
      };
      for (let i2 = 0; i2 <= 6; i2++) for (let j2 = 0; j2 < 5; j2++)
        pts.push(side(i2/6, j2/5), side(i2/6, (j2+1)/5));
      for (let j2 = 0; j2 <= 5; j2++) for (let i2 = 0; i2 < 6; i2++)
        pts.push(side(i2/6, j2/5), side((i2+1)/6, j2/5));
    }
    scene.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts), netMat));
  });
}

// ── POLISH, PORTED FROM THE FLAT PAGE ───────────────────────────────────────
//
// Not all of it. The sponsor boards and the mowing bands are scenery a low camera mostly hides,
// and they cost geometry for something you would rarely look at. What is ported is the things
// that carry INFORMATION the 3D page was missing: who has the ball, who each cylinder is, where
// something just happened, and where the ball has been.

// ── WHO HAS IT ──────────────────────────────────────────────────────────────
// A ring under the ball in the owner's colour. In 2D this was a halo AROUND the ball; from a
// raised camera a halo is an ellipse that reads as part of the ball, so it goes on the ground
// where the shadow already is and where perspective makes it a ring rather than a smudge.
const haloGL = new THREE.Mesh(
  new THREE.RingGeometry(13, 17, 28),
  new THREE.MeshBasicMaterial({ side: THREE.DoubleSide, transparent: true, opacity: 0 }));
haloGL.rotation.x = Math.PI/2;
haloGL.position.y = 1.1;
scene.add(haloGL);

// ── WHERE IT HAS BEEN ───────────────────────────────────────────────────────
// Seven fading spheres. The flat page used circles that shrank; in three dimensions the trail
// has to carry HEIGHT too, or a lofted ball leaves a trail along the floor and looks like it
// never left it.
const TRAIL_N = 7;
const trail = [];
for (let i = 0; i < TRAIL_N; i++) {
  const m = new THREE.Mesh(
    new THREE.SphereGeometry(6.5 - i*0.65, 8, 6),
    new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0 }));
  m.visible = false;
  scene.add(m);
  trail.push(m);
}
const trailPts = [];
let headPop = 0;
// ── THE TEAM BADGE ──────────────────────────────────────────────────────────
// The flat page draws each side's motif as SVG about 13 units across — the bulldog's eyes are
// r:1.1, which is a pixel and a half on a phone. Drawn to a 128px canvas instead, the same shapes
// get roughly ten times the detail and cost one texture per side for the whole match.
//
// Same geometry as the flat page, scaled up: 13 units becomes 128 pixels, so every radius is
// multiplied by 9.85 and the drawing is otherwise identical. That matters — a badge that is
// nearly the flat page's is worse than one that is exactly it.
const _badgeCache = {};
function badgeTexture(t) {
  const T = TEAMS[t], key = T.name;
  if (_badgeCache[key]) return _badgeCache[key];
  const S = 128, K = S / 13 * 0.72;          // flat-page units -> pixels, with a little margin
  const cv = document.createElement('canvas'); cv.width = cv.height = S;
  const x = cv.getContext('2d');
  const m = T.motif || { t: 'disc', c: [T.accent] };
  const c = m.c || [T.accent];
  const P = (u) => S / 2 + u * K;            // a flat-page coordinate, in pixels
  const R = (u) => u * K;

  x.fillStyle = T.color;                     // the shirt, as the ground
  x.beginPath(); x.arc(S/2, S/2, R(7.4), 0, 7); x.fill();

  const dot = (cx, cy, r, col) => { x.fillStyle = col; x.beginPath(); x.arc(P(cx), P(cy), R(r), 0, 7); x.fill(); };
  const box = (bx, by, w, h, col) => { x.fillStyle = col; x.fillRect(P(bx), P(by), R(w), R(h)); };

  switch (m.t) {
    case 'bulldog':
      // ── A BULLDOG WITH A FACE ─────────────────────────────────────────────
      // The old one was three circles and a box: two ears, a head, a jowl. It read as a bear.
      // A bulldog is WIDE, not round — the whole animal is a jaw with a dog behind it.
      //
      // So: a squat head wider than it is tall, ears folded DOWN the sides rather than perched
      // on top, an undershot jaw that overhangs, and the wrinkle across the muzzle that is the
      // one line everybody draws when they draw a bulldog.
      box(-6.8, -3.4, 3.0, 5.2, c[0]);   box(3.8, -3.4, 3.0, 5.2, c[0]);   // folded ears, down
      box(-6.2, -4.6, 12.4, 8.4, c[0]);                                     // the head, WIDE
      dot(-6.2, -4.6, 1.6, c[0]); dot(6.2, -4.6, 1.6, c[0]);                // rounded crown
      box(-4.4, 1.2, 8.8, 4.6, '#efeae4');                                  // the jaw, overhung
      dot(-4.4, 5.8, 1.4, '#efeae4'); dot(4.4, 5.8, 1.4, '#efeae4');
      box(-3.0, -0.6, 6.0, 1.5, '#2a2018');                                 // the muzzle wrinkle
      dot(-2.9, -2.2, 1.25, '#141820'); dot(2.9, -2.2, 1.25, '#141820');    // eyes, set wide
      dot(-2.9, -2.6, 0.42, '#ffffff'); dot(2.9, -2.6, 0.42, '#ffffff');    // and a catchlight
      box(-1.5, 1.0, 3.0, 2.0, '#141820'); dot(0, 1.0, 1.5, '#141820');     // the nose
      dot(-2.2, 3.9, 0.5, '#e8dcd0'); dot(2.2, 3.9, 0.5, '#e8dcd0');        // two teeth showing
      break;
    case 'banana':
      // ── A BANANA WITH A BEND ──────────────────────────────────────────────
      // The old one was a single stroked arc — a smile, not a fruit. A banana has THICKNESS that
      // varies along its length, a stem at one end and a black tip at the other, and the bend is
      // the whole point.
      //
      // Drawn as a filled crescent: two arcs of different radius closed at the ends, which is
      // what gives it a fat middle and tapered tips.
      { const fill = c[0] && c[0] !== '#141414' ? c[0] : '#f6d743';
        x.fillStyle = fill;
        x.beginPath();
        x.arc(P(0), P(4.0), R(6.4), Math.PI * 1.12, Math.PI * 1.88);
        x.arc(P(0), P(4.0), R(3.4), Math.PI * 1.88, Math.PI * 1.12, true);
        x.closePath(); x.fill();
        // the ridge along the inside of the bend, which is what makes it read as a banana
        x.strokeStyle = 'rgba(150,110,20,0.55)'; x.lineWidth = R(0.7); x.lineCap = 'round';
        x.beginPath(); x.arc(P(0), P(4.0), R(4.6), Math.PI * 1.22, Math.PI * 1.78); x.stroke();
        // stem one end, black tip the other
        x.strokeStyle = '#6b4a12'; x.lineWidth = R(2.0);
        x.beginPath(); x.moveTo(P(-5.5), P(-0.6)); x.lineTo(P(-6.6), P(-2.2)); x.stroke();
        dot(5.6, -0.6, 1.0, '#2e2109');
      }
      break;
    case 'sparkle':
      for (let i = 0; i < 6; i++) {
        const a = i / 6 * Math.PI * 2;
        dot(Math.cos(a) * 4.4, Math.sin(a) * 4.4, 1.5, c[i % c.length] || '#fff');
      }
      dot(0, 0, 2.4, '#fff');
      break;
    case 'sun':   dot(0, 0, 4.2, c[0]);
                  for (let i = 0; i < 12; i++) { const a = i/12*Math.PI*2;
                    dot(Math.cos(a)*6.2, Math.sin(a)*6.2, 1.0, c[0]); } break;
    case 'cross': box(-7.4, -1.5, 14.8, 3, c[0]); box(-1.5, -7.4, 3, 14.8, c[0]); break;
    case 'diamond': x.fillStyle = c[0]; x.beginPath();
                  x.moveTo(P(0),P(-6.4)); x.lineTo(P(6.4),P(0)); x.lineTo(P(0),P(6.4)); x.lineTo(P(-6.4),P(0));
                  x.closePath(); x.fill(); break;
    case 'disc':  dot(0, 0, 4.6, c[0]); break;
    case 'stars': for (let i = 0; i < 5; i++) { const a = i/5*Math.PI*2 - Math.PI/2;
                    dot(Math.cos(a)*4.2, Math.sin(a)*4.2, 1.4, c[0]); } break;
    case 'vsplit': box(-7.4, -7.4, 7.4, 14.8, c[0]); break;
    case 'hband': box(-7.4, -1.8, 14.8, 3.6, c[0]); break;
    case 'hbands2': box(-7.4, -4.4, 14.8, 2.8, c[0]); box(-7.4, 1.6, 14.8, 2.8, c[0]); break;
    case 'hbands3': for (let i = 0; i < 3; i++) box(-7.4, -6 + i*4.2, 14.8, 2.4, c[i % c.length] || c[0]); break;
    case 'vbands': for (let i = 0; i < 3; i++) box(-6.6 + i*4.4, -7.4, 2.6, 14.8, c[i % c.length] || c[0]); break;
    default:      dot(0, 0, 4.6, c[0] || T.accent);
  }
  x.strokeStyle = 'rgba(0,0,0,.55)'; x.lineWidth = R(0.7);
  x.beginPath(); x.arc(S/2, S/2, R(7.4), 0, 7); x.stroke();

  const tex = new THREE.CanvasTexture(cv);
  tex.anisotropy = 8;                        // it is seen at an angle from every camera
  _badgeCache[key] = tex;
  return tex;
}

let wasBurning = false;   // so the ball can leave one last mark when it is put out

/** The man kickoff() will give the ball to, picked the way it picks him — so the ball can be
 *  returned to where it will actually end up rather than to the spot it passes through. */
function netTaker(){
  if (pendingKickoff === null || typeof pendingKickoff === 'undefined') return null;
  const t = pendingKickoff;
  return players.find(q => q.team === t && q.role === 'F' && !q.out && !q.sentOff)
      || players.find(q => q.team === t && q.role !== 'K' && !q.out && !q.sentOff)
      || null;
}      // the decaying lift off a header, see drawGL

// ── WHO EACH ONE IS ─────────────────────────────────────────────────────────
// Names as sprites, which always face the camera. A mesh label would need turning every frame
// and would still be edge-on half the time; a sprite is the one thing in three.js that is
// allowed to cheat, and a name is exactly the sort of thing that should.
/** The outline that keeps a colour readable on grass.
 *
 *  A fixed dark stroke is what made the dark blues unreadable — England's navy shorts colour or
 *  Italy's blue, outlined in black, is a dark shape on a dark shape. And the flat page's own
 *  default is `rgba(0,0,0,.65)`, so it had the same exposure; it just never showed because SVG
 *  text is crisper than a canvas at this size.
 *
 *  Chosen from the fill's own lightness instead, so contrast is guaranteed rather than hoped for:
 *  a dark label gets a white edge, a light one gets a black edge. The pink reads better with
 *  white for exactly this reason. */
// 0.62 rather than a midpoint. A midpoint puts the Sparkle Princesses' pink at 0.55 and the
// Netherlands' orange at 0.56 on the dark-edge side, and both read better with white — a mid
// colour on mid-green grass needs a LIGHT edge to separate it, not a dark one that merges with
// the shadow under it. Only the genuinely pale sides keep a black edge.
const outlineFor = fill => lum(fill) < 0.62 ? 'rgba(255,255,255,.95)' : 'rgba(6,10,8,.92)';

function nameSprite(text, colour, px, stroke){
  const size = px || 34;
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d');
  const font = '700 ' + size + 'px "Barlow Condensed", "Arial Narrow", sans-serif';
  ctx.font = font;
  c.width = Math.ceil(ctx.measureText(text).width) + 26;
  c.height = Math.round(size * 1.45);
  const g = c.getContext('2d');
  g.font = font;
  g.textBaseline = 'middle';
  g.lineJoin = 'round';                      // so the stroke does not spike at sharp corners
  g.lineWidth = Math.max(4, size * 0.17);
  g.strokeStyle = stroke || outlineFor(colour);
  g.strokeText(text, 13, c.height/2);
  g.fillStyle = colour;
  g.fillText(text, 13, c.height/2);
  const tex = new THREE.CanvasTexture(c);
  tex.minFilter = THREE.LinearFilter;
  // ── A LABEL BELONGS TO THE VIEWER, NOT TO THE PITCH ──────────────────────
  // A Sprite is in WORLD units by default, so it shrank with distance exactly like the thing it
  // labels — a 30px name rendered at 11px once the camera was pulled back, which is unreadable
  // and is the whole complaint. That behaviour is right for a flame and wrong for text.
  //
  // sizeAttenuation:false makes it a constant SCREEN size. The scale then reads as a fraction of
  // the viewport rather than a size in the world, so it is set from the canvas's aspect and one
  // number that means "how tall on screen".
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({
    map: tex, transparent: true, depthTest: false, depthWrite: false, sizeAttenuation: false }));
  // ── DRAWN LAST, ON PURPOSE ───────────────────────────────────────────────
  // depthTest:false only stops the depth BUFFER rejecting a pixel; it does not change draw
  // ORDER. three.js sorts transparent objects by distance, and the touchline ribbon is
  // transparent and frequently NEARER the camera than a label out in the middle — so it was
  // painted afterwards, straight over the text.
  //
  // renderOrder is the thing that decides who goes last. 10 puts every label above every piece
  // of scenery without needing to know what the scenery is.
  sp.renderOrder = 10;
  // 0.044 rather than 0.055: at a constant screen size the old figure was 20 per cent larger
  // than it needed to be, which was only tolerable while it shrank with distance.
  const H = (size / 30) * 0.044;
  sp.scale.set(H * (c.width / c.height), H, 1);
  sp.userData.h = H;                             // so callers can scale it without re-deriving
  return sp;
}

// ── WHERE SOMETHING JUST HAPPENED ───────────────────────────────────────────
// The engine's two annotation hooks, which were no-ops until now.
//
// A note is a line of text that rises and fades — a foul, a save, a card. A ping is a ring that
// expands and fades — a tackle, a shot. Both are on the pitch rather than in the feed because
// WHERE they happened is half of what they say, and the feed cannot carry that.
const notes3 = [], pings3 = [];
ENGINE_HOOKS.spawnNote = (x, y, text, colour, stroke) => {
  // An engine-supplied stroke is honoured only if it actually contrasts with the fill — several
  // sides pass their own accent, and a few of those are as dark as the colour they outline.
  const fill = colour || '#ffffff';
  const ok = stroke && Math.abs(lum(stroke) - lum(fill)) > 0.35;
  const sp = nameSprite(String(text), fill, 30, ok ? stroke : outlineFor(fill));
  sp.position.set(x, 46, y);
  scene.add(sp);
  notes3.push({ sp, t0: performance.now(), y0: 46 });
};
ENGINE_HOOKS.spawnPing = (x, y, colour) => {
  const m = new THREE.Mesh(
    new THREE.RingGeometry(6, 9, 24),
    new THREE.MeshBasicMaterial({ color: new THREE.Color(colour || '#ffffff'),
                                  side: THREE.DoubleSide, transparent: true, opacity: 0.9 }));
  m.rotation.x = Math.PI/2;
  m.position.set(x, 1.4, y);
