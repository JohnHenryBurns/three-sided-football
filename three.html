<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Three-Sided Football · 3D</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<!--
  A SECOND FRONT END, NOT A SECOND GAME.

  This page owns nothing about football. It loads engine.js, hands it the seventeen things it asks
  for, and draws whatever comes back. The rules, the AI, the commentary text and the ball's
  physics are all over there, and a fix to any of them lands here for free.

  The first attempt at 3D was a copy of index.html with its renderer swapped — 93 per cent
  duplicate, and every rule change would have needed making twice. That is what engine.js exists
  to prevent, and this is what it buys: a few hundred lines instead of three and a half thousand.

  It is deliberately NOT a port of the 2D page's chrome. Coach menus, team pickers, sponsor
  boards, the walk of shame — none of that is here. A camera you can move is worth more in three
  dimensions than a settings panel, and the flat page still exists for everything else.
-->

<style>
/* The flat page's palette, verbatim and under its own names — this page had the same colours
   under different ones (--line for --panel-edge, --dim for --ink-dim) and a different accent,
   hollerbox's burnt orange instead of the chalk yellow this game uses everywhere else. Two names
   for one colour is how two pages drift apart. */
:root{
  --bg:#0d1410; --panel:#152019; --panel-edge:#233529;
  --chalk:rgba(255,255,255,.85); --ink:#e8efe9; --ink-dim:#8fa596;
  --esp:#e63946; --arg:#6fb7e3; --eng:#f2f2f2;
  --hot:#ffd166;                       /* the accent this game has always used */
  --sans:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);
  display:flex;flex-direction:column}

header{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem .75rem;
  padding:.5rem .9rem;border-bottom:1px solid var(--panel-edge)}
h1{font-size:1.1rem;font-weight:600;letter-spacing:-.01em;color:var(--hot)}
.sub{font-family:var(--mono);font-size:.72rem;color:var(--ink-dim);letter-spacing:.04em}
.spacer{flex:1}

/* The score. Three teams, so no home-and-away layout to borrow — they sit in a row and the one
   in the lead is marked, which is the only ranking that fits on a phone. */
.scores{display:flex;gap:.35rem}
.sc{display:flex;align-items:center;gap:.32rem;padding:.2rem .5rem;border-radius:7px;
  background:var(--panel);border:1px solid var(--panel-edge);font-size:.82rem;white-space:nowrap}
.sc .sw{width:.6rem;height:.6rem;border-radius:2px;flex:0 0 auto}
.sc b{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sc.lead{border-color:var(--hot)}
.sc.out{opacity:.42}
#clock{font-family:var(--mono);font-size:.9rem;font-variant-numeric:tabular-nums;color:var(--ink-dim)}

#stage{position:relative;flex:1;min-height:0}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* Commentary, over the pitch rather than beside it — the pitch is the interesting part and a
   side panel would take a third of a phone to show four lines of text. */
#feed{position:absolute;left:0;right:0;bottom:0;padding:.5rem .8rem 0;
  pointer-events:none;display:flex;flex-direction:column;justify-content:flex-end;
  max-height:42%;overflow:hidden;
  background:linear-gradient(transparent,rgba(6,10,8,.82))}
#feed p{font-size:.86rem;line-height:1.35;margin-top:.2rem;text-shadow:0 1px 3px rgba(0,0,0,.8)}
#feed p:not(:last-child){opacity:.5}
#feed .goal{color:#ffd166;font-weight:700;font-size:1rem}

#bar{display:flex;gap:.4rem;align-items:center;padding:.45rem .9rem;
  border-top:1px solid var(--panel-edge)}
button{font-family:inherit;font-size:.82rem;color:var(--ink);background:var(--panel);
  border:1px solid var(--panel-edge);border-radius:7px;padding:.34rem .66rem;cursor:pointer}
button:hover{border-color:var(--ink)}
button.on{border-color:var(--hot);color:var(--hot)}
.hint{font-family:var(--mono);font-size:.68rem;color:var(--ink-dim);margin-left:auto}
@media (max-width:560px){ .hint{display:none} .sub{display:none} }

/* ── THE SCREENS ───────────────────────────────────────────────────────────
   A goal, a card, extra time, a champion. In the flat page these are four
   separate bits of markup; they are one component here, because they are the
   same thing — a coloured card over the pitch with a headline and a line under
   it — and four copies of one idea is how the nav went wrong earlier today. */
#cele{position:absolute;inset:0;z-index:6;display:none;
  align-items:center;justify-content:center;pointer-events:none;
  background:radial-gradient(ellipse at center,rgba(6,10,8,.35),rgba(6,10,8,.82))}
#cele.on{display:flex}
#celeCard{text-align:center;padding:1.1rem 1.6rem;border-radius:14px;
  background:rgba(10,16,13,.88);border:2px solid var(--cele,#ffd166);
  box-shadow:0 0 60px -10px var(--cele,#ffd166);max-width:88%;
  animation:celePop .34s cubic-bezier(.2,1.3,.4,1)}
@keyframes celePop{from{transform:scale(.72);opacity:0}to{transform:scale(1);opacity:1}}
#celeCard .big{font-size:2.1rem;font-weight:700;letter-spacing:-.01em;color:var(--cele,#ffd166);
  line-height:1.05}
#celeCard .who{font-size:1.15rem;font-weight:600;margin-top:.25rem}
#celeCard .sub{font-size:.9rem;color:var(--ink-dim);margin-top:.3rem}
/* The flavour line, in the card's own colour — it is the bit with the joke in it. */
#celeCard .fire{font-size:.92rem;font-weight:600;color:var(--cele,#ffd166);margin-top:.45rem}
@media (max-width:560px){ #celeCard .big{font-size:1.5rem} }

/* Confetti. Twenty-eight strips is enough to read as celebration and few enough
   that a phone does not care. */
#confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.confetti{position:absolute;top:-12%;width:7px;height:13px;border-radius:2px;
  animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(120vh) rotate(760deg);opacity:.15}}
@media (prefers-reduced-motion:reduce){ .confetti{display:none} #celeCard{animation:none} }

/* A card shown against a team flashes that team's chip, which is where the eye
   already is when a score changes. */
.sc.flash{animation:scFlash .7s ease-out}
@keyframes scFlash{0%{background:#ffd166;color:#14181a}100%{background:var(--panel)}}
.sc.flash.red{animation-name:scFlashRed}
@keyframes scFlashRed{0%{background:#e11d2e;color:#fff}100%{background:var(--panel)}}

/* ── THE MATCH MENU ────────────────────────────────────────────────────────
   Same options as the flat page, minus the voice engine — this page has no
   announcer, so offering a choice of throat would be a control that does
   nothing, which is worse than not having it. */
#setup{position:absolute;inset:0;z-index:8;display:none;overflow:auto;
  background:rgba(6,10,8,.93);padding:1rem}
#setup.on{display:block}
.setupCard{max-width:26rem;margin:0 auto;padding:1rem 1.2rem 1.4rem;
  background:var(--panel);border:1px solid var(--panel-edge);border-radius:14px}
.setupCard h2{font-size:1.25rem;color:var(--hot);letter-spacing:-.01em}
.setupCard .tag{font-family:var(--mono);font-size:.72rem;color:var(--ink-dim);
  letter-spacing:.05em;margin:.15rem 0 .9rem}
.frow{display:flex;flex-direction:column;gap:.28rem;margin-top:.75rem}
.frow>label{font-size:.74rem;color:var(--ink-dim);letter-spacing:.07em;text-transform:uppercase}
.frow select{width:100%;font-family:inherit;font-size:.95rem;padding:.45rem .5rem;
  background:var(--bg);color:var(--ink);border:1px solid var(--panel-edge);border-radius:7px}
.chk{display:flex;justify-content:space-between;align-items:center;margin-top:.6rem;
  font-size:.92rem}
.chk input{width:1.15rem;height:1.15rem;accent-color:var(--hot)}
#teamSlots{display:flex;flex-direction:column;gap:.3rem}
#teamSlots select{width:100%;font-family:inherit;font-size:.92rem;padding:.4rem .5rem;
  background:var(--bg);color:var(--ink);border:1px solid var(--panel-edge);border-radius:7px}
#btnStart{width:100%;margin-top:1.1rem;font-size:1.05rem;font-weight:600;padding:.6rem;
  background:var(--hot);color:#1a1005;border:0;border-radius:9px}
#btnStart:hover{filter:brightness(1.08)}

/* ── TEAM SELECTORS ────────────────────────────────────────────────────────
   The flat page's shape: three chips in the team's own colours with a stripe of
   the accent under each, a die for a random matchup, and a sheet to choose from.
   A dropdown lists names; these show you the kit, which is what you recognise a
   side by on the pitch. */
#teamSlots{display:flex;gap:.4rem;align-items:stretch}
.slotBtn{flex:1;font-family:var(--sans);font-size:1.05rem;font-weight:700;letter-spacing:.04em;
  padding:.5rem .2rem;background:var(--bg);border:2px solid var(--panel-edge);border-radius:9px;
  cursor:pointer}
.diceBtn{flex:0 0 auto;font-size:1.1rem;padding:.5rem .6rem;background:var(--bg);
  border:2px solid var(--panel-edge);border-radius:9px;cursor:pointer}
.diceBtn:hover,.slotBtn:hover{border-color:var(--ink)}

#tp{position:absolute;inset:0;z-index:9;display:none;overflow:auto;
  background:rgba(6,10,8,.94);padding:1rem}
#tp.on{display:block}
#tpCard{max-width:26rem;margin:0 auto;padding:.9rem 1rem 1.1rem;
  background:var(--panel);border:1px solid var(--panel-edge);border-radius:14px}
#tpCard .big2{font-size:1.05rem;font-weight:600;margin-bottom:.6rem;color:var(--hot)}
.tpTeam{display:flex;gap:.6rem;align-items:center;padding:.5rem .6rem;margin-top:.35rem;
  border:2px solid var(--panel-edge);border-radius:10px;cursor:pointer;background:var(--bg)}
.tpTeam:hover{border-color:var(--ink)}
.tpDot{width:2rem;height:2rem;border-radius:6px;flex:0 0 auto}
.tpBody{display:flex;flex-direction:column;min-width:0}
.tpName{font-size:1rem;font-weight:600}
.tpId{font-family:var(--mono);font-size:.66rem;color:var(--ink-dim);letter-spacing:.04em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>

<header>
  <h1>Three-Sided Football</h1>
  <span class="sub">3D · experimental</span>
  <span class="spacer"></span>
  <div class="scores" id="scores"></div>
  <span id="clock">0:00</span>
</header>

<div id="stage">
  <canvas id="gl"></canvas>
  <div id="setup" class="on">
    <div class="setupCard">
      <h2>Three-Sided Football</h2>
      <p class="tag">One ball. Three goals. Two enemies each.</p>

      <div class="frow"><label for="setRules">Scoring</label>
        <select id="setRules">
          <option value="points" selected>&plusmn;1 points &mdash; scorer +1, conceder &minus;1</option>
          <option value="conceded">Classic &mdash; fewest conceded wins</option>
        </select></div>

      <div class="frow"><label for="setLen">Match length</label>
        <select id="setLen">
          <option value="60" selected>1 minute &mdash; blitz</option>
          <option value="180">3 minutes</option>
          <option value="300">5 minutes</option>
          <option value="600">10 minutes</option>
        </select></div>

      <div class="frow"><label for="setRef">Referee</label>
        <select id="setRef">
          <option value="0">Off &mdash; let them play</option>
          <option value="1" selected>Balanced</option>
          <option value="1.8">Aggressive</option>
          <option value="3.5">MAYHEM</option>
        </select></div>

      <div class="frow"><label>Teams</label><div id="teamSlots"></div></div>

      <div class="chk"><label for="setMom">Underdog fire</label><input id="setMom" type="checkbox" checked></div>
      <div class="chk"><label for="setZone" title="Attackers can't enter the penalty area before the ball">Enforce offsides</label><input id="setZone" type="checkbox"></div>
      <div class="chk"><label for="setOob" title="Throw-ins, goal kicks, corners, keeper parries">Out of bounds</label><input id="setOob" type="checkbox" checked></div>

      <button id="btnStart">Kick off</button>
    </div>
  </div>
  <div id="tp"><div id="tpCard"></div></div>
  <div id="cele"><div id="celeCard"></div><div id="confetti"></div></div>
  <div id="feed"></div>
</div>

<div id="bar">
  <button id="play">Pause</button>
  <button id="reset">Kick off</button>
  <button id="follow" class="on">Follow ball</button>
  <button id="speed">1&times;</button>
  <button id="full">Full</button>
  <span class="hint">drag to orbit · pinch or wheel to zoom</span>
</div>

<!-- The version tag exists because GitHub Pages caches, and a page fetched fresh alongside an
     engine.js from twenty minutes ago fails in the most confusing way available: everything works
     except the newest thing. That is what "shirtOf is not defined" was — the page had the call and
     the cached engine did not have the function. Bump this whenever engine.js changes shape. -->
<script src="engine.js?v=10"></script>
<script>
// ── WHAT THE ENGINE ASKS FOR ────────────────────────────────────────────────
// Seventeen hooks. Most of them are about chrome this page does not have — coach menus, team
// pickers, sponsor boards — and those stay no-ops rather than being invented. A hook that does
// nothing is a decision; a hook that is missing is a crash.
const feedEl = document.getElementById('feed');
function say(html, big){
  const p = document.createElement('p');
  p.innerHTML = String(html || '');
  if (big) p.className = 'goal';
  feedEl.appendChild(p);
  while (feedEl.children.length > 5) feedEl.removeChild(feedEl.firstChild);
}
Object.assign(ENGINE_HOOKS, {
  say,
  renderScore,

  // spawnNote, spawnPing, flash, flamePop, openCoachMenu, closeCoachMenu, showSetup,
  // renderTeamSlots, resetGoals, drawBoards and clearMarks stay no-ops: this page has no
  // sponsor boards, no coach menu and no SVG marks to clear.
});

// ── THE SCENE ───────────────────────────────────────────────────────────────
const cv = document.getElementById('gl');
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0d1410, 900, 2600);
const cam = new THREE.PerspectiveCamera(40, 1, 1, 4000);
const ren = new THREE.WebGLRenderer({ canvas: cv, antialias: true });
ren.setPixelRatio(Math.min(2, devicePixelRatio || 1));
ren.setClearColor(0x0d1410, 1);

// A raised three-quarter orbit. Three-sided football has no attacking direction, so there is no
// end to sit behind — every camera convention borrowed from two-goal football picks a side, and
// picking a side here is picking a team. 30 degrees is low enough that players have height and
// the ball's arc reads against the grass rather than only against its shadow.
let az = -Math.PI/2, el = 0.52, rad = 1250, follow = true;
const look = new THREE.Vector3(CX, 0, CY);
function placeCam(){
  cam.position.set(look.x + rad*Math.cos(el)*Math.cos(az),
                   look.y + rad*Math.sin(el),
                   look.z + rad*Math.cos(el)*Math.sin(az));
  cam.lookAt(look);
}
function resize(){
  const r = cv.getBoundingClientRect();
  if (!r.width || !r.height) return;
  ren.setSize(r.width, r.height, false);
  cam.aspect = r.width / r.height;
  cam.updateProjectionMatrix();
  placeCam();
}
new ResizeObserver(resize).observe(cv);

scene.add(new THREE.AmbientLight(0xffffff, 0.66));
const sun = new THREE.DirectionalLight(0xffffff, 0.75);
sun.position.set(400, 1000, -300);
scene.add(sun);

// ── THE PITCH ───────────────────────────────────────────────────────────────
// Built from the engine's own V and EDGES, so the mesh cannot drift from the shape the ball
// bounces off. That is the whole argument for a shared engine, in one object.
//
// Inside a function, and called from boot(), because at top level a throw here happens BEFORE
// the guard below and takes the page down with nothing said. The first guarded version had
// exactly that hole: it caught everything except the part most likely to fail.
function buildPitch(){
  const shape = new THREE.Shape();
  V.forEach((p, i) => i ? shape.lineTo(p.x, p.y) : shape.moveTo(p.x, p.y));
  shape.closePath();
  // THE GRASS WAS BLACK. A Shape is built in the XY plane and its normals point along +Z;
  // rotating the mesh -90 degrees about X lays it flat and points every normal at the floor, so
  // the sun lit the underside and the top got nothing but ambient. Rotating +90 and taking the
  // other side is the fix, and DoubleSide means it cannot happen again from the other direction.
  const grass = new THREE.Mesh(new THREE.ShapeGeometry(shape),
    new THREE.MeshLambertMaterial({ color: 0x2a6b38, side: THREE.DoubleSide }));
  // PLUS ninety, not minus. A Shape lives in XY and rotating it -90 about X sends (x,y) to
  // (x,0,-y) — the pitch came out mirrored through the centre line, sitting south of the players
  // who are placed at z = +p.y. The lines were built as explicit Vector3s with y as z, so THEY
  // were right, which is why the markings and the grass disagreed.
  grass.rotation.x = Math.PI/2;
  scene.add(grass);

  const lineMat = new THREE.LineBasicMaterial({ color: 0xdfe8df, transparent: true, opacity: 0.5 });
  scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(
    V.concat([V[0]]).map(p => new THREE.Vector3(p.x, 0.7, p.y))), lineMat));
  const circ = [];
  for (let k = 0; k <= 64; k++) {
    const a = k/64 * Math.PI*2;
    circ.push(new THREE.Vector3(CX + 92*Math.cos(a), 0.7, CY + 92*Math.sin(a)));
  }
  scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(circ), lineMat));

  // three goals, on the three goal edges the engine nominates
  const postMat = new THREE.MeshLambertMaterial({ color: 0xf2f4f2 });
  GOAL_EDGE.forEach((gi, t) => {
    const e = EDGES[gi], half = e.len * GOAL_HALF, HGT = 54;
    for (const s of [-1, 1]) {
      const post = new THREE.Mesh(new THREE.CylinderGeometry(3.2, 3.2, HGT, 8), postMat);
      post.position.set(e.mx + e.ux*half*s, HGT/2, e.my + e.uy*half*s);
      scene.add(post);
    }
    const bar = new THREE.Mesh(new THREE.CylinderGeometry(3.2, 3.2, half*2, 8), postMat);
    bar.position.set(e.mx, HGT, e.my);
    // THE DEFAULT ORDER IS THE RIGHT ONE HERE, and I broke it by "fixing" it. A three.js Euler
    // order names a MATRIX PRODUCT: XYZ is Rx*Ry*Rz, so the LAST letter is applied to a vector
    // FIRST. XYZ therefore lays the cylinder down (z) and then swings it (y), which is exactly
    // what a crossbar wants. Setting ZYX did the opposite — swung an upright cylinder, where it
    // does nothing, then laid it along world X on every edge.
    //
    // Checked with the matrices rather than reasoned about: under XYZ the bar is parallel to its
    // goal line on all three goals, under ZYX on none of them. A cylinder is symmetric, so
    // parallel is the test and not equal — the axis comes out antiparallel and that is the same
    // line.
    bar.rotation.z = Math.PI/2;
    bar.rotation.y = -Math.atan2(e.uy, e.ux);
    scene.add(bar);
    // the net, in the defending team's colour — which is what tells you WHOSE goal it is, and
    // three-sided football needs that far more than two-goal football does
    const net = new THREE.Mesh(new THREE.PlaneGeometry(half*2, HGT),
      new THREE.MeshBasicMaterial({ color: new THREE.Color(TEAMS[t].color),
        transparent: true, opacity: 0.13, side: THREE.DoubleSide }));
    net.position.set(e.mx - e.nx*10, HGT/2, e.my - e.ny*10);
    net.rotation.y = -Math.atan2(e.uy, e.ux);
    scene.add(net);
  });
}

// ── POLISH, PORTED FROM THE FLAT PAGE ───────────────────────────────────────
//
// Not all of it. The sponsor boards and the mowing bands are scenery a low camera mostly hides,
// and they cost geometry for something you would rarely look at. What is ported is the things
// that carry INFORMATION the 3D page was missing: who has the ball, who each cylinder is, where
// something just happened, and where the ball has been.

// ── WHO HAS IT ──────────────────────────────────────────────────────────────
// A ring under the ball in the owner's colour. In 2D this was a halo AROUND the ball; from a
// raised camera a halo is an ellipse that reads as part of the ball, so it goes on the ground
// where the shadow already is and where perspective makes it a ring rather than a smudge.
const haloGL = new THREE.Mesh(
  new THREE.RingGeometry(13, 17, 28),
  new THREE.MeshBasicMaterial({ side: THREE.DoubleSide, transparent: true, opacity: 0 }));
haloGL.rotation.x = Math.PI/2;
haloGL.position.y = 1.1;
scene.add(haloGL);

// ── WHERE IT HAS BEEN ───────────────────────────────────────────────────────
// Seven fading spheres. The flat page used circles that shrank; in three dimensions the trail
// has to carry HEIGHT too, or a lofted ball leaves a trail along the floor and looks like it
// never left it.
const TRAIL_N = 7;
const trail = [];
for (let i = 0; i < TRAIL_N; i++) {
  const m = new THREE.Mesh(
    new THREE.SphereGeometry(6.5 - i*0.65, 8, 6),
    new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0 }));
  m.visible = false;
  scene.add(m);
  trail.push(m);
}
const trailPts = [];

// ── WHO EACH ONE IS ─────────────────────────────────────────────────────────
// Names as sprites, which always face the camera. A mesh label would need turning every frame
// and would still be edge-on half the time; a sprite is the one thing in three.js that is
// allowed to cheat, and a name is exactly the sort of thing that should.
function nameSprite(text, colour){
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d');
  const font = '600 34px "Barlow Condensed", "Arial Narrow", sans-serif';
  ctx.font = font;
  c.width = Math.ceil(ctx.measureText(text).width) + 20;
  c.height = 46;
  const g = c.getContext('2d');
  g.font = font;
  g.textBaseline = 'middle';
  g.lineWidth = 5;
  g.strokeStyle = 'rgba(6,10,8,.92)';        // an outline, because grass is not a uniform colour
  g.strokeText(text, 10, 24);
  g.fillStyle = colour;
  g.fillText(text, 10, 24);
  const tex = new THREE.CanvasTexture(c);
  tex.minFilter = THREE.LinearFilter;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }));
  sp.scale.set(c.width * 0.42, c.height * 0.42, 1);
  return sp;
}

// ── WHERE SOMETHING JUST HAPPENED ───────────────────────────────────────────
// The engine's two annotation hooks, which were no-ops until now.
//
// A note is a line of text that rises and fades — a foul, a save, a card. A ping is a ring that
// expands and fades — a tackle, a shot. Both are on the pitch rather than in the feed because
// WHERE they happened is half of what they say, and the feed cannot carry that.
const notes3 = [], pings3 = [];
ENGINE_HOOKS.spawnNote = (x, y, text, colour) => {
  const sp = nameSprite(String(text), colour || '#ffffff');
  sp.position.set(x, 46, y);
  scene.add(sp);
  notes3.push({ sp, t0: performance.now(), y0: 46 });
};
ENGINE_HOOKS.spawnPing = (x, y, colour) => {
  const m = new THREE.Mesh(
    new THREE.RingGeometry(6, 9, 24),
    new THREE.MeshBasicMaterial({ color: new THREE.Color(colour || '#ffffff'),
                                  side: THREE.DoubleSide, transparent: true, opacity: 0.9 }));
  m.rotation.x = Math.PI/2;
  m.position.set(x, 1.4, y);
  scene.add(m);
  pings3.push({ m, t0: performance.now() });
};

// ── SCORCH ──────────────────────────────────────────────────────────────────
// Where somebody erupted. The flat page burns a mark into the turf and leaves it for the rest of
// the match, which is the joke: the pitch remembers.
const scorch = [];
ENGINE_HOOKS.flamePop = q => {
  if (!q || scorch.length > 40) return;
  const m = new THREE.Mesh(
    new THREE.CircleGeometry(15 + Math.random()*7, 12),
    new THREE.MeshBasicMaterial({ color: 0x1a0f06, transparent: true, opacity: 0.55 }));
  m.rotation.x = Math.PI/2;
  m.position.set(q.x, 0.7, q.y);
  m.rotation.z = Math.random() * Math.PI;
  scene.add(m);
  scorch.push(m);
};

// Called every frame from drawGL, after the players have moved.
function drawPolish(now){
  // possession
  if (ball.owner) {
    haloGL.position.set(ball.x, 1.1, ball.y);
    haloGL.material.color.set(TEAMS[ball.owner.team].color);
    haloGL.material.opacity = 0.85;
  } else haloGL.material.opacity = 0;

  // the trail: only while the ball is loose and moving, as in 2D — a ball being dribbled does
  // not streak, and a trail behind a walking player is noise
  const fast = !ball.owner && Math.hypot(ball.vx, ball.vy) > 3.2;
  if (fast) trailPts.unshift({ x: ball.x, y: ball.y, z: Math.max(0, ball.z || 0) });
  else if (trailPts.length) trailPts.pop();
  trailPts.length = Math.min(trailPts.length, TRAIL_N);
  trail.forEach((m, i) => {
    const p = trailPts[i];
    if (!p) { m.visible = false; return; }
    m.visible = true;
    m.position.set(p.x, 9 + p.z, p.y);
    m.material.opacity = 0.42 * (1 - i/TRAIL_N);
  });

  // notes rise and fade over two seconds, as they do in 2D
  for (let i = notes3.length - 1; i >= 0; i--) {
    const n = notes3[i], age = (now - n.t0) / 2100;
    if (age >= 1) { scene.remove(n.sp); notes3.splice(i, 1); continue; }
    n.sp.position.y = n.y0 + 34 * age;
    n.sp.material.opacity = age < 0.45 ? 0.95 : 0.95 * (1 - (age - 0.45)/0.55);
  }
  // pings expand and fade over half a second
  for (let i = pings3.length - 1; i >= 0; i--) {
    const p = pings3[i], age = (now - p.t0) / 620;
    if (age >= 1) { scene.remove(p.m); pings3.splice(i, 1); continue; }
    p.m.scale.setScalar(1 + age * 2.6);
    p.m.material.opacity = 0.9 * (1 - age);
  }
}



// ── THE GROUND ──────────────────────────────────────────────────────────────
//
// Everything outside the touchline. None of it is simulated — the engine does not know a stand
// exists — but a pitch floating in black reads as a diagram, and this is meant to be a place.
//
// Built entirely from the engine's V and EDGES, so it cannot drift from the shape the ball
// bounces off, and so it stays right if the pitch ever changes size.
const SPONSORS = [
  "CANBY HAZELNUTS","MAX FC","ATLAS K9 SECURITY","JORN & SONS","HEX\u2022COLA","THE THIRD SIDE",
  "BURNS FAMILY FARMS","WILLAMETTE TURF CO.","TRAEGER SMOKE SIGNALS","PUMPKIN PATCH XXL",
  "GRAMPY CLIFF'S TRACTOR PARTS","NANNY'S BAKING SHOP","FRESH EGGS DAILY","HOME GYM IRONWORKS",
  "LONESOME DOVE OUTFITTERS","BLUEBERRY ROW","THE DIP STATION","REMUDA RENTALS",
  "QUIRT SPORTING GOODS","GOLDEN CONCESSIONS","WALK OF SHAME INSURANCE","TACTICAL HUGS LLC",
  "ROW Z AIRLINES","KEEPER WARS PPV","HORSECAMP","HELLFIRE CLUB",
];
const BOARD_INK = [["#c8102e","#ffd166"],["#0a2a66","#ffffff"],["#ffd166","#1a1a1a"],
  ["#0b6e3f","#ffffff"],["#ffffff","#0a2a66"],["#5b2a86","#ffd166"],["#e8600a","#ffffff"]];

/** Text on a coloured board, as a texture. Canvas rather than geometry because a hoarding is
 *  writing on a flat thing, which is what a canvas is. */
function boardTexture(text, bg, fg){
  const c = document.createElement('canvas');
  c.width = 512; c.height = 64;
  const x = c.getContext('2d');
  x.fillStyle = bg; x.fillRect(0, 0, 512, 64);
  x.fillStyle = fg;
  x.font = '700 40px "Barlow Condensed","Arial Narrow",sans-serif';
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(text, 256, 34);
  const t = new THREE.CanvasTexture(c);
  t.minFilter = THREE.LinearFilter;
  return t;
}

function buildGround(){
  // ── THE SURROUND ─────────────────────────────────────────────────────────
  // Grass beyond the touchline, out to the stands. A pitch that stops dead at its own line
  // looks like a cut-out; real grounds have run-off, and the eye expects it.
  {
    const out = new THREE.Shape();
    V.forEach((p, i) => {
      const x = CX + (p.x - CX) * 1.34, y = CY + (p.y - CY) * 1.34;
      i ? out.lineTo(x, y) : out.moveTo(x, y);
    });
    out.closePath();
    const surround = new THREE.Mesh(new THREE.ShapeGeometry(out),
      new THREE.MeshLambertMaterial({ color: 0x1b4f27, side: THREE.DoubleSide }));
    surround.rotation.x = Math.PI/2;
    surround.position.y = -0.4;                // under the pitch, so the touchline still reads
    scene.add(surround);
  }

  // ── THE HOARDINGS ────────────────────────────────────────────────────────
  // One board per edge, standing just outside the touchline and leaning back a little, the way
  // they do — a board square to the ground is invisible from a raised camera.
  EDGES.forEach((e, k) => {
    const [bg, fg] = BOARD_INK[k % BOARD_INK.length];
    const text = SPONSORS[(k * 7 + 3) % SPONSORS.length];
    const board = new THREE.Mesh(
      new THREE.PlaneGeometry(e.len * 0.92, 26),
      new THREE.MeshBasicMaterial({ map: boardTexture(text, bg, fg), side: THREE.DoubleSide }));
    board.position.set(e.mx - e.nx * 34, 13, e.my - e.ny * 34);
    // ORDER MATTERS. three.js applies Euler angles XYZ by default, so setting .x then .y leans
    // the board in WORLD space and only then swings it to face the pitch — which points the lean
    // somewhere different on every edge, and is exactly what "askew" looks like. YXZ faces it
    // first and leans it in its own frame, so all six lean back the same way.
    board.rotation.order = 'YXZ';
    board.rotation.y = -Math.atan2(e.uy, e.ux);
    board.rotation.x = -0.22;
    scene.add(board);
  });

  // ── THE STANDS ───────────────────────────────────────────────────────────
  // Three tiers of raked seating on each edge, rising away from the pitch. Boxes rather than a
  // ramp because a rake made of steps reads as seating at a glance and a smooth slope does not.
  const TIERS = 3;
  EDGES.forEach(e => {
    for (let t = 0; t < TIERS; t++) {
      const depth = 34 + t * 30, h = 16 + t * 22;
      const tier = new THREE.Mesh(
        new THREE.BoxGeometry(e.len * 1.12, h, 28),
        new THREE.MeshLambertMaterial({ color: t % 2 ? 0x232c33 : 0x2b353d }));
      tier.position.set(e.mx - e.nx * (depth + 58), h/2, e.my - e.ny * (depth + 58));
      tier.rotation.y = -Math.atan2(e.uy, e.ux);
      scene.add(tier);
      // a crowd: a band of speckled colour along the front of each tier, which at this distance
      // is what a crowd IS. Individual figures would cost thousands of meshes to say the same.
      const crowd = new THREE.Mesh(
        new THREE.PlaneGeometry(e.len * 1.12, 15),
        new THREE.MeshBasicMaterial({ map: crowdTexture(), side: THREE.DoubleSide }));
      crowd.position.set(e.mx - e.nx * (depth + 44), h - 4, e.my - e.ny * (depth + 44));
      crowd.rotation.order = 'YXZ';        // see the boards above
      crowd.rotation.y = -Math.atan2(e.uy, e.ux);
      crowd.rotation.x = -0.34;
      scene.add(crowd);
    }
  });

  // ── THE BENCHES ──────────────────────────────────────────────────────────
  // One per team, beside their own goal, where the 2D page puts them. A dugout roof and a row of
  // seats; who is sitting on them is drawn each frame, because that changes.
  GOAL_EDGE.forEach((k, t) => {
    const e = EDGES[k], hw = e.len * GOAL_HALF;
    const bx = e.mx - e.nx * 30 + e.ux * (hw + 62);
    const by = e.my - e.ny * 30 + e.uy * (hw + 62);
    benchAt[t] = { x: bx, y: by, ux: e.ux, uy: e.uy, nx: e.nx, ny: e.ny };
    const dug = new THREE.Mesh(new THREE.BoxGeometry(78, 4, 26),
      new THREE.MeshLambertMaterial({ color: 0x1a2229 }));
    dug.position.set(bx, 30, by);
    dug.rotation.y = -Math.atan2(e.uy, e.ux);
    scene.add(dug);
    for (const s of [-1, 1]) {
      const post = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 1.6, 30, 6),
        new THREE.MeshLambertMaterial({ color: 0x1a2229 }));
      post.position.set(bx + e.ux * 37 * s, 15, by + e.uy * 37 * s);
      scene.add(post);
    }
    const seat = new THREE.Mesh(new THREE.BoxGeometry(74, 5, 12),
      new THREE.MeshLambertMaterial({ color: new THREE.Color(TEAMS[t].color) }));
    seat.position.set(bx, 8, by);
    seat.rotation.y = -Math.atan2(e.uy, e.ux);
    scene.add(seat);
  });
}

/** A band of speckled colour: a crowd, at the distance a crowd is ever seen from here. */
let crowdTex = null;
function crowdTexture(){
  if (crowdTex) return crowdTex;
  const c = document.createElement('canvas');
  c.width = 256; c.height = 32;
  const x = c.getContext('2d');
  x.fillStyle = '#161d22'; x.fillRect(0, 0, 256, 32);
  const pal = ['#c8102e','#0a2a66','#ffd166','#f2f2f2','#6fb7e3','#3c4b55','#8a6a4a','#2b6b3f'];
  for (let i = 0; i < 900; i++) {
    x.fillStyle = pal[(Math.random() * pal.length) | 0];
    x.globalAlpha = 0.5 + Math.random() * 0.5;
    x.fillRect(Math.random() * 256, Math.random() * 32, 2.4, 2.4);
  }
  crowdTex = new THREE.CanvasTexture(c);
  crowdTex.minFilter = THREE.LinearFilter;
  return crowdTex;
}
const benchAt = [];

// ── THE PLAYERS ─────────────────────────────────────────────────────────────
const R_P = 11, H_P = 34;
// How light a colour is, for deciding whether a number on it should be dark or pale. index.html
// has its own copy; this page cannot see it, because it lives in the front end rather than the
// engine. Duplicated deliberately — four lines is cheaper than moving a colour helper into a
// file about the rules of football.
const lum = hex => {
  const n = parseInt(String(hex).replace('#',''), 16);
  return (0.2126*((n>>16)&255) + 0.7152*((n>>8)&255) + 0.0722*(n&255)) / 255;
};
let bodies = [];
function buildBodies(){
  bodies.forEach(b => scene.remove(b.g));
  bodies = players.map(p => {
    const g = new THREE.Group();
    const T = TEAMS[p.team];
    const col = new THREE.Color(T.color);
    const acc = new THREE.Color(T.accent || '#ffffff');
    const thr = new THREE.Color(T.third  || T.accent || '#222222');

    // ── THE KIT ──────────────────────────────────────────────────────────
    // Every team already carries three colours and the 3D page was using one of them, so fifteen
    // cylinders came out as three flat blocks of colour. Shirt, shorts and a collar is the least
    // that reads as a kit, and it uses exactly the palette the flat page already draws with.
    //
    // Built as three stacked cylinders rather than one textured body: a texture would have to be
    // authored per team and would blur at this scale, and the geometry costs nothing.
    const SHORTS = H_P * 0.3;
    const shirt = new THREE.Mesh(
      new THREE.CylinderGeometry(R_P, R_P * 0.97, H_P - SHORTS, 16),
      new THREE.MeshLambertMaterial({ color: col }));
    shirt.position.y = SHORTS + (H_P - SHORTS)/2;
    g.add(shirt);
    const shorts = new THREE.Mesh(
      new THREE.CylinderGeometry(R_P * 0.97, R_P * 0.9, SHORTS, 16),
      new THREE.MeshLambertMaterial({ color: thr }));
    shorts.position.y = SHORTS/2;
    g.add(shorts);
    // a collar, and for a keeper the whole shirt is the accent instead — which is what a keeper
    // kit IS, rather than a badge stuck on an outfield one
    if (p.role === 'K') {
      shirt.material.color.copy(acc);
      shorts.material.color.copy(col);
    }
    const collar = new THREE.Mesh(
      new THREE.CylinderGeometry(R_P * 1.04, R_P * 1.04, 3.4, 16),
      new THREE.MeshLambertMaterial({ color: p.role === 'K' ? col : acc }));
    collar.position.y = H_P - 2.4;
    g.add(collar);
    // EYES, NOT A BEAK. A cone on the front pointed the way the player faced and read as a bird,
    // which my four-year-old reviewer spotted before I did. Two eyes carry the same information —
    // you can see which way something is looking — and a face is easier to read at a glance than
    // an arrow, because reading faces is a thing people are extremely good at.
    //
    // Set slightly apart and slightly forward, so the direction is legible in profile as well as
    // head on: from the side you see one eye, which is still a heading.
    const eyeW = new THREE.MeshLambertMaterial({ color: 0xf6f8f6 });
    const eyeD = new THREE.MeshBasicMaterial({ color: 0x14181a });
    for (const side of [-1, 1]) {
      const white = new THREE.Mesh(new THREE.SphereGeometry(3.1, 10, 8), eyeW);
      white.position.set(R_P - 1.4, H_P * 0.74, side * 4.2);
      g.add(white);
      const pupil = new THREE.Mesh(new THREE.SphereGeometry(1.5, 8, 6), eyeD);
      pupil.position.set(R_P + 1.2, H_P * 0.74, side * 4.2);
      g.add(pupil);
    }
    // A SMILE. Half a torus, opening downward, which is the cheapest curve in three.js that
    // reads as a mouth — a flat arc would vanish edge-on and a sphere would read as a nose.
    // It sits below the eyes and slightly proud of the body so the cylinder does not clip it.
    const smile = new THREE.Mesh(
      new THREE.TorusGeometry(4.4, 0.9, 6, 14, Math.PI),
      new THREE.MeshBasicMaterial({ color: 0x14181a }));
    smile.position.set(R_P - 0.6, H_P * 0.56, 0);
    smile.rotation.y = Math.PI/2;      // face the front
    smile.rotation.z = Math.PI;        // corners up, not down
    g.add(smile);
    // stamina, as a ring on the grass. The 2D page shortened an arc; from a raised camera an arc
    // is unreadable, so the value lives in colour, opacity and radius instead.
    const ring = new THREE.Mesh(new THREE.RingGeometry(R_P + 3, R_P + 7, 24),
      new THREE.MeshBasicMaterial({ color: 0x7ec97e, side: THREE.DoubleSide, transparent: true }));
    ring.rotation.x = -Math.PI/2; ring.position.y = 0.9; g.add(ring);
    // ── THE BURST ────────────────────────────────────────────────────────
    // Three tongues, in the team's own fire palette, ANCHORED AT THE BACK.
    //
    // The single cone before this had its base at x=-9 while the body's back surface is at -11 —
    // so the wide end sat INSIDE the player and the flame appeared to erupt from the middle of
    // them. Each tongue now starts at the surface and runs outward from there.
    //
    // The palette comes from the engine's firePal(), which is where the easter egg lives: a team
    // flagged `she` burns rainbow instead of orange, and the Sparkle Princesses are the only one.
    // Reading it from there rather than hard-coding three oranges is what keeps that working.
    const pal = (typeof firePal === 'function') ? firePal(p.team) : ['#ff3d00','#ff8c00','#ffd166'];
    const flames = [];
    for (let f = 0; f < 3; f++) {
      const len = 26 - f * 5;
      const tongue = new THREE.Mesh(
        new THREE.ConeGeometry(5.4 - f * 1.1, len, 7),
        new THREE.MeshBasicMaterial({
          color: new THREE.Color(pal[f % pal.length]),
          transparent: true, opacity: 0, depthWrite: false }));
      tongue.rotation.order = 'YZX';
      tongue.rotation.z = Math.PI/2;                  // lay it along -X, pointing back
      // base ON the surface, tip trailing away: half the length beyond the shell
      tongue.position.set(-R_P - len/2 + 1, H_P * (0.36 + f * 0.07), (f - 1) * 3.4);
      g.add(tongue);
      flames.push(tongue);
    }
    const pip = new THREE.Mesh(new THREE.BoxGeometry(7, 10, 1.5),
      new THREE.MeshBasicMaterial({ color: 0xffd166 }));
    pip.position.set(0, H_P + 13, 0); pip.visible = false; g.add(pip);
    // The name, riding above the head. Surnames only: full names are too wide to read at this
    // scale and the commentary already says who somebody is — the label's job is to let you
    // follow ONE player across a crowded pitch, and a surname does that.
    // THE NUMBER, ON THE BACK. Drawn onto a plane rather than a sprite: a sprite always faces
    // the camera, which is right for a name floating above a head and wrong for a number on a
    // shirt — the whole point of a squad number is that you read it when a player is running
    // away from you, and it should disappear when they turn round.
    // Guarded: a missing helper should cost a shirt number, not the whole match. This page
    // cannot control when a browser decides its copy of engine.js is stale.
    const num = (typeof shirtOf === 'function') ? shirtOf(p.name) : 0;
    if (num) {
      const c = document.createElement('canvas');
      c.width = 96; c.height = 64;
      const x = c.getContext('2d');
      x.font = '700 46px "Barlow Condensed", "Arial Narrow", sans-serif';
      x.textAlign = 'center'; x.textBaseline = 'middle';
      // Ink chosen against whatever the shirt actually is — the keeper's is the accent, so
      // testing the team colour would give a white number on a yellow keeper.
      const shirtCol = p.role === 'K' ? (TEAMS[p.team].accent || '#ffffff') : TEAMS[p.team].color;
      x.fillStyle = lum(shirtCol) > 0.62 ? '#14181a' : '#f6f8f6';
      x.fillText(String(num), 48, 34);
      const tex = new THREE.CanvasTexture(c);
      tex.minFilter = THREE.LinearFilter;
      // A CURVED PANEL, NOT A FLAT ONE. A plane hovering off the back of a cylinder reads as a
      // sign held behind a player, which is what looked wrong: shirts are not flat and neither
      // are the numbers on them. This is a 90-degree slice of a cylinder at the shirt's own
      // radius, so the number wraps with the body and catches the light the same way.
      //
      // ON THE BACK, WHICH IS 270 DEGREES AND NOT 180. three.js places cylinder vertices at
      // x = r*sin(theta), z = r*cos(theta) — so theta is measured from +Z, not +X. A slice
      // centred on 180 lands on -Z, which is the player's SIDE, and that is where the number
      // was. The eyes face +X, so the back is -X, which is theta 270.
      //
      // Same shape of mistake as the boards leaning the wrong way: an assumption about which
      // axis an angle starts from, invisible until something is drawn and looked at.
      const back = new THREE.Mesh(
        new THREE.CylinderGeometry(R_P * 1.005, R_P * 0.985, 15, 14, 1, true,
                                   Math.PI * 1.25, Math.PI * 0.5),
        new THREE.MeshBasicMaterial({ map: tex, transparent: true, side: THREE.DoubleSide }));
      back.position.y = H_P * 0.66;
      g.add(back);
    }
    const label = nameSprite(p.name.split(' ').slice(-1)[0], TEAMS[p.team].accent);
    label.position.set(0, H_P + 26, 0);
    label.scale.multiplyScalar(0.55);
    g.add(label);
    scene.add(g);
    return { g, ring, flames, pip, label };
  });
}

const ballGL = new THREE.Mesh(new THREE.SphereGeometry(9, 18, 12),
  new THREE.MeshLambertMaterial({ color: 0xffffff }));
scene.add(ballGL);
const shadowGL = new THREE.Mesh(new THREE.CircleGeometry(9, 18),
  new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.34 }));
shadowGL.rotation.x = -Math.PI/2; shadowGL.position.y = 0.5;
scene.add(shadowGL);

let drawGL = function drawGL(){
  if (bodies.length !== players.length) buildBodies();
  players.forEach((p, i) => {
    const b = bodies[i]; if (!b) return;
    if (p.out && !p.benched) { b.g.visible = false; return; }
    b.g.visible = true;
    if (p.benched) {
      // ON THE BENCH, not stacked at the origin. The engine keeps a sent-off player's own x,y
      // wherever they were standing, so drawing them there leaves a ghost on the pitch.
      const B = benchAt[p.team];
      if (B) {
        const seat = ((p.seat || 0) % 4) - 1.5;
        b.g.position.set(B.x + B.ux * seat * 17, 11, B.y + B.uy * seat * 17);
        b.g.rotation.y = -Math.atan2(B.ny, B.nx) + Math.PI;   // facing the pitch
        b.g.scale.setScalar(0.72);
      }
    } else {
      b.g.position.set(p.x, 0, p.y);
      b.g.rotation.y = -Math.atan2(p.hy, p.hx);
      b.g.scale.setScalar(1);
    }
    // ONLY WHOEVER HAS THE BALL IS NAMED. Fifteen labels over fifteen cylinders is a wall of
    // text with a football behind it — and the name you actually want is the one the commentary
    // is about, which is the one on the ball. The rest are legible by colour and number.
    if (b.label) b.label.visible = (ball.owner === p);
    const s = Math.max(0, Math.min(1, p.stamina));
    b.ring.material.color.setRGB(1 - s*0.55, 0.32 + s*0.46, 0.3 + s*0.18);
    b.ring.material.opacity = 0.22 + s*0.6;
    b.ring.scale.setScalar(0.7 + s*0.3);
    // Each tongue flickers on its own clock and stretches as it burns, so the three do not pulse
    // in lockstep — which is the difference between a fire and a blinking cone.
    const burning = p.sprint != null && p.burst < 0.98;
    const spent = 1 - Math.max(0, Math.min(1, p.burst));      // brighter the harder it is spent
    b.flames.forEach((t, f) => {
      t.visible = burning;
      if (!burning) { t.material.opacity = 0; return; }
      const w = performance.now() / (48 + f * 19) + f * 2.1;
      t.material.opacity = (0.34 + 0.4 * spent) * (0.62 + 0.38 * Math.sin(w));
      t.scale.set(1, 0.72 + 0.5 * (0.5 + 0.5 * Math.sin(w * 1.4)), 1);
    });
    b.pip.visible = !!(p.redCard || p.yellows > 0);
    if (b.pip.visible) b.pip.material.color.set(p.redCard ? 0xe11d2e : 0xffd166);
  });
  const z = Math.max(0, ball.z || 0);
  ballGL.position.set(ball.x, 9 + z, ball.y);
  shadowGL.position.set(ball.x, 0.5, ball.y);
  const k = 1 / (1 + z*0.012);
  shadowGL.scale.setScalar(k);
  shadowGL.material.opacity = 0.34 * k;
  // the camera drifts toward the ball rather than snapping to it: a camera that tracks exactly
  // makes the ball look still and the world look shaky, which is the opposite of what is happening
  if (follow) {
    look.x += (ball.x - look.x) * 0.035;
    look.z += (ball.y - look.z) * 0.035;
    placeCam();
  }
  drawPolish(performance.now());
  ren.render(scene, cam);
};


// ── THE CHROME ──────────────────────────────────────────────────────────────
const scoresEl = document.getElementById('scores');
function renderScore(){
  const best = Math.max(...score);
  scoresEl.innerHTML = TEAMS.map((T, t) =>
    '<span class="sc' + (score[t] === best && best > 0 ? ' lead' : '') + (out[t] ? ' out' : '') + '">' +
    '<span class="sw" style="background:' + T.color + '"></span>' + T.short +
    ' <b>' + score[t] + '</b></span>').join('');
}
function fmtClock(s){
  const m = Math.floor(s/60);
  return m + ':' + String(Math.floor(s%60)).padStart(2, '0');
}


// ── THE SCREENS ─────────────────────────────────────────────────────────────
// One card, four uses: a goal, extra time, a champion, and anything the engine
// wants held in front of the play. The engine already distinguishes them by which
// hook it calls, so the page does not need four components to say so.
const celeEl = document.getElementById('cele');
const celeCard = document.getElementById('celeCard');
const confettiBox = document.getElementById('confetti');
let celeUntil = 0;

function showCard(colour, big, who, sub, ms, confetti, fire){
  celeCard.style.setProperty('--cele', colour);
  celeCard.innerHTML =
    '<div class="big">' + big + '</div>' +
    (who ? '<div class="who">' + who + '</div>' : '') +
    (sub ? '<div class="sub">' + sub + '</div>' : '') +
    // The fifth argument, which this page was dropping: the flavour line. "Spain catch fire —
    // 20s boost", "the killing blow". It is the part that makes a goal card feel like a
    // broadcast rather than a scoreline, and it was being thrown away because the hook took
    // four parameters and the engine has always passed five.
    (fire ? '<div class="fire">' + fire + '</div>' : '');
  confettiBox.innerHTML = '';
  if (confetti) {
    const pal = [colour, '#ffd166', '#ffffff'];
    for (let i = 0; i < 28; i++) {
      const c = document.createElement('span');
      c.className = 'confetti';
      c.style.left = (Math.random() * 100) + '%';
      c.style.background = pal[i % 3];
      c.style.animationDelay = (Math.random() * 0.5).toFixed(2) + 's';
      confettiBox.appendChild(c);
    }
  }
  celeEl.classList.add('on');
  // Infinity for a champion: the match is over and there is nothing to go back to.
  celeUntil = ms === Infinity ? Infinity : performance.now() + ms;
}
function hideCard(){ celeEl.classList.remove('on'); confettiBox.innerHTML = ''; }

ENGINE_HOOKS.showCelebration = (colour, big, who, sub, fire) =>
  showCard(colour || '#ffd166', big || 'GOAL', who || '', sub || '', 2600, true, fire);

// `dur` is already MILLISECONDS — the flat page does `performance.now() + dur` with it, and the
// engine passes 4200 for a yellow card. Multiplying by a thousand, as this did, would have held
// a card up for seventy minutes with the match frozen behind it. Nothing in a headless run can
// catch that: the number is valid, the units are not.
ENGINE_HOOKS.showNotice = (colour, big, who, sub, dur) =>
  showCard(colour || '#ffd166', big || '', who || '', sub || '', dur || 2200, false);

ENGINE_HOOKS.crownChampion = (t, how) => {
  const T = TEAMS[t];
  showCard(T.color, '\u{1F3C6} CHAMPIONS', T.name,
           (how || 'Champions of the hex') + ' \u00b7 ' + score.join(' \u2013 '), Infinity, true);
  say('\u{1F3C6} ' + T.name + ' are champions of the hex', true);
};

ENGINE_HOOKS.eliminateTeam = t => {
  const T = TEAMS[t];
  showCard(T.color, 'ELIMINATED', T.name, 'Down to two', 2000, false);
  say(T.name + ' are out');
};

// A card against a team flashes that team's chip, which is where the eye already is when
// something happens to a score. The flat page flashes a whole scorecard; there is no room for one
// here, and the chip carries the same information in a tenth of the space.
ENGINE_HOOKS.flash = t => {
  const el = scoresEl.children[t];
  if (!el) return;
  const red = players.some(p => p.team === t && p.redCard);
  el.classList.remove('flash', 'red');
  void el.offsetWidth;
  el.classList.add('flash');
  if (red) el.classList.add('red');
};


// ── THE MATCH MENU ──────────────────────────────────────────────────────────
// Shown on load and whenever the match is reset, because those are the two moments you might
// want a different match — and a settings panel you have to go looking for is one nobody changes.
const setupEl = document.getElementById('setup');
const slotsEl = document.getElementById('teamSlots');

// Three pickers, one per side. Choosing a team that is already out there swaps the two, rather
// than refusing: refusing means working out which of the other two to change first, and swapping
// is what you meant.
const tpEl = document.getElementById('tp'), tpCard = document.getElementById('tpCard');

function renderTeamSlots(){
  slotsEl.innerHTML = '';
  selTeams.forEach((sel, slot) => {
    const L = TEAM_LIBRARY[sel];
    const b = document.createElement('button');
    b.className = 'slotBtn';
    b.textContent = L.short;
    b.style.borderColor = L.color;
    b.style.color = L.color;
    b.style.boxShadow = 'inset 0 -3.5px 0 ' + L.accent;   // a stripe of the away colour
    b.addEventListener('click', () => openTeamPick(slot));
    slotsEl.appendChild(b);
  });
  const dice = document.createElement('button');
  dice.className = 'diceBtn';
  dice.textContent = '\u{1F3B2}';
  dice.title = 'Random matchup';
  dice.addEventListener('click', () => {
    const pool = [...TEAM_LIBRARY.keys()];
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    for (let i = 0; i < 3; i++) selTeams[i] = pool[i];
    applyTeamSelection(); renderTeamSlots();
  });
  slotsEl.appendChild(dice);
}

// The sheet. Every side, in its own colours, with the identity the engine gives it — which is
// what you are actually choosing between: a team that presses is a different match from one that
// sits in, and the name alone does not say so.
function openTeamPick(slot){
  const rows = ['<div class="big2">Slot ' + (slot + 1) + ': choose a side</div>',
    '<div class="tpTeam" data-i="-1" style="border-color:var(--hot)">' +
      '<div class="tpDot" style="display:flex;align-items:center;justify-content:center;' +
      'font-size:1.2rem">\u{1F3B2}</div><div class="tpBody">' +
      '<span class="tpName" style="color:var(--hot)">Surprise me</span>' +
      '<span class="tpId">a random side</span></div></div>'];
  TEAM_LIBRARY.forEach((T, i) => {
    const taken = selTeams.indexOf(i);
    rows.push('<div class="tpTeam" data-i="' + i + '" style="border-color:' + T.color +
      (taken >= 0 && taken !== slot ? ';opacity:.55' : '') + '">' +
      '<div class="tpDot" style="background:' + T.color +
        ';box-shadow:inset 0 -6px 0 ' + T.accent + '"></div>' +
      '<div class="tpBody"><span class="tpName" style="color:' + T.color + '">' + T.name + '</span>' +
      '<span class="tpId">' + T.id.atk + ' \u00b7 ' + T.id.def + ' \u00b7 ' + T.id.agg +
      (taken >= 0 && taken !== slot ? ' \u00b7 already picked \u2014 tap to swap' : '') +
      '</span></div></div>');
  });
  tpCard.innerHTML = rows.join('');
  tpCard.querySelectorAll('.tpTeam').forEach(el => el.addEventListener('click', () => {
    let want = +el.dataset.i;
    if (want < 0) {                                  // the die, for one slot only
      const free = [...TEAM_LIBRARY.keys()].filter(i => selTeams.indexOf(i) < 0);
      want = free.length ? free[Math.floor(Math.random() * free.length)] : selTeams[slot];
    }
    const other = selTeams.indexOf(want);
    if (other >= 0 && other !== slot) selTeams[other] = selTeams[slot];   // swap, do not refuse
    selTeams[slot] = want;
    applyTeamSelection();
    renderTeamSlots();
    tpEl.classList.remove('on');
  }));
  tpEl.classList.add('on');
}
tpEl.addEventListener('click', e => { if (e.target === tpEl) tpEl.classList.remove('on'); });
ENGINE_HOOKS.renderTeamSlots = renderTeamSlots;
ENGINE_HOOKS.showSetup = () => { running = false; hideCard(); celeUntil = 0; setupEl.classList.add('on'); };

function startMatch(){
  // Read every control into the engine, then build. The engine owns all of these — the page is
  // only collecting answers.
  scoreMode  = document.getElementById('setRules').value;
  matchLen   = parseInt(document.getElementById('setLen').value, 10);
  foulMult   = parseFloat(document.getElementById('setRef').value);
  momentumOn = document.getElementById('setMom').checked;
  zoneRule   = document.getElementById('setZone').checked;
  oobRule    = document.getElementById('setOob').checked;

  setupEl.classList.remove('on');
  feedEl.innerHTML = '';
  hideCard(); celeUntil = 0;
  applyTeamSelection();
  resetMatch();
  kickoff(0);
  renderScore();
  buildBodies();          // the kits change with the teams, so the bodies are rebuilt
  running = true;
  document.getElementById('play').textContent = 'Pause';
  if (oobRule) say('Touchlines in play \u2014 throw-ins, goal kicks, and corners.');
}
document.getElementById('btnStart').addEventListener('click', startMatch);

// ── THE LOOP ────────────────────────────────────────────────────────────────
// Deliberately simpler than the 2D page's. That one carries celebration timing, the walk of
// shame, penalties and coach menus; this one plays football and restarts after a goal. The match
// flow it omits is flow the engine does not require — which is worth knowing, because it means
// that flow is presentation and could move here later rather than being duplicated.
// `running` and `resumeAt` are ENGINE names — declaring them again here is a SyntaxError, and a
// SyntaxError in an inline script kills the whole block before its first line runs. That is why
// the page showed its buttons and nothing else: not a failure during boot, a failure to reach
// boot at all, which is also why the try/catch around boot() never said a word.
//
// The engine owns them, so use them rather than shadowing them.
let last = performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - last)/1000);
  last = now;
  // A card holds the play. Without this a goal celebration sits over a match that carries on
  // behind it, and the restart happens while nobody is looking at the pitch.
  if (celeUntil && now >= celeUntil && celeUntil !== Infinity) {
    hideCard(); celeUntil = 0; resumeAt = now + 500;
  }
  const held = celeUntil > 0;
  if (running && !held && now >= resumeAt) {
    if (pendingKickoff !== null && typeof pendingKickoff !== 'undefined') {
      kickoff(pendingKickoff); pendingKickoff = null; resumeAt = now + 900;
    } else {
      // The 2D page's step, verbatim: dt * speed * 0.75. `speedMult` is a PLAYER speed
      // multiplier and taking it for a clock rate was a guess from its name — it wants a player
      // and returns how fast that one runs. The clock and the simulation take the same step, so
      // the match clock and the football agree about how long a second is.
      const step = dt * speed * 0.75;
      clockSec += step;
      retargetTimer += step;
      if (retargetTimer > 6) { retargetTimer = 0; computeTargets(); }
      think(step); physics(step); colorCommentary();
      if (clockSec >= matchLen + stoppageLen) resolveFullTime();
    }
  }
  document.getElementById('clock').textContent = fmtClock(clockSec);
  drawGL();
}

document.getElementById('play').addEventListener('click', e => {
  running = !running;
  e.target.textContent = running ? 'Pause' : 'Play';
});
// Reset opens the menu rather than restarting the same match: a reset is the moment you might
// want different teams or a different length, and the flat page treats it the same way.
document.getElementById('reset').addEventListener('click', () => {
  running = false;
  hideCard(); celeUntil = 0;
  renderTeamSlots();
  setupEl.classList.add('on');
});
// Speed. The same five steps the flat page offers, and it multiplies the engine's own `speed`,
// so a second of match clock and a second of football stay the same length as each other.
const SPEEDS = [0.5, 1, 1.5, 2, 3];
document.getElementById('speed').addEventListener('click', e => {
  const i = (SPEEDS.indexOf(speed) + 1) % SPEEDS.length;
  speed = SPEEDS[i < 0 ? 1 : i];
  e.target.innerHTML = speed + '&times;';
});

// Fullscreen. On the STAGE rather than the document, so the pitch fills the screen and the
// controls come with it — a fullscreen page that leaves its buttons behind is a trap on a phone,
// where there is no obvious way back.
document.getElementById('full').addEventListener('click', async e => {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else await document.documentElement.requestFullscreen();
    e.target.classList.toggle('on', !!document.fullscreenElement);
  } catch (err) { /* refused, or unsupported: leave the button as it was */ }
});
document.addEventListener('fullscreenchange', () => {
  document.getElementById('full').classList.toggle('on', !!document.fullscreenElement);
  resize();                      // the canvas is sized from its box, and the box just changed
});

document.getElementById('follow').addEventListener('click', e => {
  follow = !follow;
  e.target.classList.toggle('on', follow);
  if (!follow) { look.set(CX, 0, CY); placeCam(); }
});

// drag to orbit, wheel or pinch to pull back
let drag = null, pinch = 0;
cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; cv.setPointerCapture(e.pointerId); });
cv.addEventListener('pointerup',   () => { drag = null; });
cv.addEventListener('pointermove', e => {
  if (!drag) return;
  az += (e.clientX - drag.x) * 0.006;
  el = Math.max(0.16, Math.min(1.42, el + (e.clientY - drag.y) * 0.005));
  drag = { x: e.clientX, y: e.clientY };
  placeCam();
});
cv.addEventListener('wheel', e => {
  e.preventDefault();
  rad = Math.max(420, Math.min(2400, rad + e.deltaY * 0.9));
  placeCam();
}, { passive: false });
cv.addEventListener('touchmove', e => {
  if (e.touches.length !== 2) return;
  e.preventDefault();
  const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                       e.touches[0].clientY - e.touches[1].clientY);
  if (pinch) { rad = Math.max(420, Math.min(2400, rad * (pinch/d))); placeCam(); }
  pinch = d;
}, { passive: false });
cv.addEventListener('touchend', () => { pinch = 0; });

// ── BOOT, OUT LOUD ──────────────────────────────────────────────────────────
// The first version of this ran bare. When it failed the page showed its buttons, an empty
// pitch and a clock stuck at 0:00 — which says nothing about which line died, and a phone has no
// console to ask. Any failure now appears where the commentary would be.
function boot(){
  if (!window.THREE) throw new Error('three.js did not load');
  if (typeof ENGINE_HOOKS === 'undefined') throw new Error('engine.js did not load');
  buildPitch();
  buildGround();
  applyTeamSelection();
  resetMatch();
  kickoff(0);
  renderScore();
  buildBodies();
  renderTeamSlots();
  resize();
  // The match is built but held: the menu is up and `running` is false, so the first frame draws
  // a pitch with players standing on it behind the card, which is a better backdrop than black.
  running = false;
  requestAnimationFrame(loop);
}
try { boot(); }
catch (e) {
  say('<b style="color:#ff6b6b">Could not start:</b> ' + (e && e.message ? e.message : e));
  say('<span style="opacity:.7">' + ((e && e.stack) ? String(e.stack).split('\n')[1] || '' : '') + '</span>');
  console.error(e);
}
// and a frame that throws must not take the loop with it — one bad frame is a glitch, a dead
// loop is a black screen
let frameFailed = false;
const rawDraw = drawGL;
drawGL = function(){
  try { rawDraw(); }
  catch (e) {
    if (!frameFailed) { frameFailed = true; say('<b style="color:#ff6b6b">Draw failed:</b> ' + e.message); console.error(e); }
  }
};
</script>
